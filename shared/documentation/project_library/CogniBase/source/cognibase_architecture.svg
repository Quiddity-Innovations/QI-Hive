  <text x="274" y="309" text-anchor="middle" font-size="11" font-weight="700" fill="#14532d">RAG / Query Engine</text>
  <text x="200" y="326" font-size="8.5" fill="#1b4d22">retrieve → synthesize</text>
  <text x="200" y="339" font-size="8.5" fill="#1b4d22">cited, grounded answers</text>
  <text x="200" y="354" font-size="8.5" fill="#1b4d22">chunker · retriever</text>
  <text x="200" y="367" font-size="8.5" fill="#1b4d22">POST /chat</text>
  <text x="200" y="384" font-size="8" fill="#5f8a66">503 if no index/embed vendor</text>

