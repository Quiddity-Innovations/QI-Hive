  <text x="376" y="339" font-size="8.5" fill="#1b4d22">Workspace = anchors+bridges</text>
  <text x="376" y="354" font-size="8.5" fill="#1b4d22">Bridge suggester (BU prefix)</text>
  <text x="376" y="367" font-size="8.5" fill="#1b4d22">materializer → JSONL+vectors</text>
  <rect x="376" y="376" width="138" height="16" rx="4" fill="#fff8e6" stroke="#b8860b"/>
  <text x="445" y="388" text-anchor="middle" font-size="7.5" fill="#7a5b06">Entity resolver: built, not wired</text>

