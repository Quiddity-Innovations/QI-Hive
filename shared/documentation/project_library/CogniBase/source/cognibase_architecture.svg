  <rect x="532" y="478" width="288" height="120" rx="9" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <rect x="544" y="492" width="120" height="22" rx="5" fill="#dcfce7" stroke="#2e7d32"/>
  <text x="604" y="507" text-anchor="middle" font-size="9" font-weight="700" fill="#14532d">Anthropic Claude ✓ active</text>
  <text x="544" y="532" font-size="8.5" fill="#9a3412">OpenAI · Gemini — pre-wired (off)</text>
  <text x="544" y="548" font-size="8.5" fill="#9a3412">Ollama · LM Studio · llama.cpp</text>
