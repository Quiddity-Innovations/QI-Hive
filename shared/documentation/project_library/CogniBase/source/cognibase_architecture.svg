  <text x="544" y="578" font-size="8" fill="#ea580c">Embeddings: OpenAI / nomic-embed-text</text>
  <text x="544" y="591" font-size="8" fill="#ea580c">Checkbox-active · multi-active · zero lock-in</text>

  <!-- ══ OnBase external (planned) ══ -->
  <rect x="678" y="220" width="0" height="0"/>
  <rect x="828" y="290" width="138" height="120" rx="9" fill="#f1f3f5" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="897" y="309" text-anchor="middle" font-size="10.5" font-weight="700" fill="#475569">Hyland OnBase</text>
  <text x="838" y="328" font-size="8.5" fill="#64748b">REST API (M2)</text>
  <text x="838" y="342" font-size="8.5" fill="#64748b">Unity API (M3)</text>
