  <text x="688" y="384" font-size="8" fill="#9a7a2e">REST/Unity = stubs (M2/M3)</text>

  <!-- arrows core -> data + vendor -> AI -->
  <line x1="98" y1="410" x2="98" y2="452" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="274" y1="410" x2="274" y2="452" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="445" y1="410" x2="445" y2="452" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="600" y1="410" x2="600" y2="500" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arr-green)"/>
