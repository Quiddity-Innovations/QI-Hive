  <text x="98" y="309" text-anchor="middle" font-size="11" font-weight="700" fill="#14532d">Capabilities</text>
  <text x="24" y="326" font-size="8.5" fill="#1b4d22">Author → validate → publish</text>
  <text x="24" y="339" font-size="8.5" fill="#1b4d22">→ grant → run</text>
  <text x="24" y="354" font-size="8.5" fill="#1b4d22">sqlglot SQL validator</text>
  <text x="24" y="367" font-size="8.5" fill="#1b4d22">(read-only, anchor-scoped)</text>
  <text x="24" y="382" font-size="8.5" fill="#1b4d22">audit_summary.docx / run</text>
  <text x="24" y="399" font-size="8" fill="#5f8a66">3 demo capabilities</text>

