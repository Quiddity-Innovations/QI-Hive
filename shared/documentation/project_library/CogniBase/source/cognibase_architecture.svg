  <text x="838" y="372" font-size="8" fill="#9aa5b1">No live connection yet —</text>
  <text x="838" y="384" font-size="8" fill="#9aa5b1">why status = pre-POC</text>
  <!-- planned link sources <- onbase -->
  <path d="M 828,350 H 822" fill="none" stroke="#9aa5b1" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arr)"/>

