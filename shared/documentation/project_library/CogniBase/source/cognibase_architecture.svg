  <line x1="270" y1="256" x2="270" y2="290" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="445" y1="256" x2="445" y2="290" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="600" y1="256" x2="600" y2="290" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-blue)"/>

