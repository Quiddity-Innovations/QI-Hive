  <text x="490" y="65" text-anchor="middle" font-size="10" fill="#9aa5b1">Local desktop OnBase intelligence layer · FastAPI :8650 · vendor-neutral LLM router · fixtures today (no live OnBase yet)</text>

  <!-- ══ LEGEND (top right) ══ -->
  <rect x="760" y="76" width="208" height="150" rx="7" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="864" y="94" text-anchor="middle" font-size="10" font-weight="700" fill="#1f2d3d">Legend</text>
  <rect x="770" y="102" width="14" height="10" rx="2" fill="#eafaf0" stroke="#2e7d32"/>
  <text x="790" y="111" font-size="9" fill="#374151">Live (runs locally today)</text>
  <rect x="770" y="119" width="14" height="10" rx="2" fill="#fff8e6" stroke="#b8860b"/>
  <text x="790" y="128" font-size="9" fill="#374151">Partial / built, not wired</text>
  <rect x="770" y="136" width="14" height="10" rx="2" fill="#f1f3f5" stroke="#9aa5b1"/>
  <text x="790" y="145" font-size="9" fill="#374151">Planned</text>
  <rect x="770" y="153" width="14" height="10" rx="2" fill="#fef3c7" stroke="#d97706" stroke-dasharray="3,2"/>
  <text x="790" y="162" font-size="9" fill="#374151">Stub / fixtures only</text>
  <rect x="770" y="170" width="14" height="10" rx="2" fill="#1f2d3d" stroke="#1f2d3d"/>
  <text x="790" y="179" font-size="9" fill="#374151">Core engine (dark)</text>
  <line x1="770" y1="194" x2="788" y2="194" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="794" y="198" font-size="9" fill="#374151">Request flow</text>
  <line x1="770" y1="210" x2="788" y2="210" stroke="#2e7d32" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="794" y="214" font-size="9" fill="#374151">Data / embedding flow</text>

  <!-- ══ USERS ══ -->
  <rect x="14" y="80" width="300" height="76" rx="9" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="6,3"/>
  <rect x="26" y="74" width="52" height="14" rx="3" fill="#f8fafc"/>
  <text x="52" y="85" text-anchor="middle" font-size="10" fill="#2563eb" font-weight="700" letter-spacing="1">USERS</text>
  <rect x="22" y="92" width="138" height="56" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="91" y="111" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">OnBase Admins</text>
  <text x="91" y="126" text-anchor="middle" font-size="8" fill="#2563eb">Author capabilities, anchors,</text>
  <text x="91" y="137" text-anchor="middle" font-size="8" fill="#2563eb">bridges; publish + grant</text>
  <rect x="168" y="92" width="138" height="56" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="237" y="111" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">Department Users</text>
  <text x="237" y="126" text-anchor="middle" font-size="8" fill="#2563eb">Run granted tiles + RAG chat</text>
  <text x="237" y="137" text-anchor="middle" font-size="8" fill="#2563eb">(no raw SQL)</text>

  <!-- arrow users -> server -->
  <line x1="164" y1="156" x2="164" y2="190" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- ══ FastAPI SERVER ══ -->
  <rect x="14" y="190" width="640" height="66" rx="9" fill="#1f2d3d" stroke="#334155" stroke-width="2"/>
  <text x="334" y="212" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">CogniBase FastAPI Server</text>
  <text x="334" y="229" text-anchor="middle" font-size="9.5" fill="#94a3b8">Application/server/app.py · Uvicorn · Port 8650 · Python 3.11+ · GET /health</text>
  <text x="334" y="244" text-anchor="middle" font-size="8.5" fill="#64748b">Routers: /chat · /vendors · /anchors · /capabilities · /visualizer · /settings   (UI = DESIGN/mockup.html placeholder)</text>

  <!-- planned UI badge -->
  <rect x="664" y="190" width="120" height="66" rx="9" fill="#f1f3f5" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="724" y="214" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">Retrieval UI</text>
  <text x="724" y="229" text-anchor="middle" font-size="8" fill="#64748b">OnBase Web Client</text>
  <text x="724" y="241" text-anchor="middle" font-size="8" fill="#9aa5b1">look-alike (M10 — planned)</text>

