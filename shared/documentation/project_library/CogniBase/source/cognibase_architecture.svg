  <text x="98" y="525" text-anchor="middle" font-size="8" fill="#0284c7">+ audit/ .docx + .json</text>

  <rect x="190" y="478" width="168" height="58" rx="7" fill="#dcfce7" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="274" y="498" text-anchor="middle" font-size="10" font-weight="700" fill="#14532d">ChromaDB</text>
  <text x="274" y="513" text-anchor="middle" font-size="8" fill="#2e7d32">Product/ONBASE/RAG_Index</text>
  <text x="274" y="525" text-anchor="middle" font-size="8" fill="#2e7d32">cognibase_main + anchor_&lt;id&gt;</text>

  <rect x="366" y="478" width="158" height="58" rx="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="445" y="498" text-anchor="middle" font-size="10" font-weight="700" fill="#0c4a6e">JSONL Data Lake</text>
  <text x="445" y="513" text-anchor="middle" font-size="8" fill="#0284c7">Product/Lake/raw/&lt;src&gt;/&lt;anchor&gt;</text>
  <text x="445" y="525" text-anchor="middle" font-size="8" fill="#0284c7">+ anchors/ workspaces/ bridges/</text>

  <!-- ══ AI VENDORS ══ -->
