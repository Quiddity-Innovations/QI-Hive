  <text x="542" y="326" font-size="8.5" fill="#1b4d22">importlib registry</text>
  <text x="542" y="339" font-size="8.5" fill="#1b4d22">prefer→default→active</text>
  <text x="542" y="352" font-size="8.5" fill="#1b4d22">no hardcoded models</text>
  <text x="542" y="365" font-size="8.5" fill="#1b4d22">env: secret indirection</text>

