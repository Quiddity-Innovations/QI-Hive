  <text x="22" y="434" font-size="8.5" fill="#92400e">④ Gemma3:27b          Ollama (local)</text>
  <text x="22" y="448" font-size="8.5" fill="#92400e">⑤ Qwen3:4b            Ollama (local)</text>
  <text x="22" y="462" font-size="8.5" fill="#92400e">⑥ MiniMax M2.5        OpenRouter (free)</text>
