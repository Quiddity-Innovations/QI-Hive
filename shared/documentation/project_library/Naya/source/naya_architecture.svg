  <text x="164" y="374" text-anchor="middle" font-size="11" font-weight="700" fill="#7c5e0a">LLM Chain (8 models · failover)</text>
  <text x="22" y="392" font-size="8.5" fill="#92400e">① DeepSeek-R1 8B      Ollama (local, primary)</text>
  <text x="22" y="406" font-size="8.5" fill="#92400e">② Cloudflare Qwen1.5  Workers AI (free)</text>
