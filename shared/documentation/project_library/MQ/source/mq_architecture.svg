  <rect x="300" y="390" width="180" height="78" rx="9" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="390" y="412" text-anchor="middle" font-size="11.5" font-weight="700" fill="#8c2a1f">Fumi — Publisher</text>
  <text x="390" y="430" text-anchor="middle" font-size="9" fill="#a93b2c">fumi_post_facebook.py</text>
  <text x="390" y="444" text-anchor="middle" font-size="9" fill="#a93b2c">Graph API v19.0 · --dry-run</text>
  <text x="390" y="460" text-anchor="middle" font-size="8.5" font-weight="600" fill="#c0392b">Blocked — no Meta token</text>

