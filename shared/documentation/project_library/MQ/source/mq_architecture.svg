  <rect x="490" y="390" width="126" height="78" rx="9" fill="#fff8e6" stroke="#b8860b" stroke-width="1.5"/>
  <text x="553" y="412" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7a5b06">Scheduler</text>
  <text x="553" y="430" text-anchor="middle" font-size="8.5" fill="#9a7a2e">fumi_scheduler.py</text>
  <text x="553" y="443" text-anchor="middle" font-size="8.5" fill="#9a7a2e">weekly / daily</text>
  <text x="553" y="459" text-anchor="middle" font-size="8" fill="#9aa5b1">tasks not registered</text>

  <!-- ══ APP CORE (FastAPI + UI) ══ -->
  <rect x="20" y="492" width="596" height="58" rx="9" fill="#1f2d3d" stroke="#334155" stroke-width="2"/>
  <text x="318" y="514" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">MQ Core — main.py</text>
  <text x="318" y="531" text-anchor="middle" font-size="9.5" fill="#94a3b8">FastAPI :8500 (/health /version /info) · Gradio UI :7840 · Python · manual launch (no NSSM service)</text>
  <text x="318" y="544" text-anchor="middle" font-size="8.5" fill="#64748b">booted once 2026-06-10 per data/logs/mq.log</text>

  <!-- ══ CHANNELS (right column) ══ -->
  <text x="640" y="248" font-size="10" fill="#9aa5b1" font-weight="600" letter-spacing="1">CHANNELS</text>
  <rect x="638" y="256" width="282" height="96" rx="9" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="779" y="276" text-anchor="middle" font-size="11.5" font-weight="700" fill="#8c2a1f">Social Surfaces</text>
  <text x="779" y="294" text-anchor="middle" font-size="9" fill="#a93b2c">Facebook Page (Maia) · QI Page</text>
  <text x="779" y="308" text-anchor="middle" font-size="9" fill="#a93b2c">Instagram · WhatsApp (planned)</text>
  <text x="779" y="324" text-anchor="middle" font-size="9" fill="#a93b2c">+ weekly AI/markets · quiddam.com diary</text>
  <text x="779" y="343" text-anchor="middle" font-size="8.5" font-weight="600" fill="#c0392b">Blocked — awaiting FB approval + credentials</text>

  <!-- ══ TUNNEL ══ -->
  <rect x="638" y="390" width="282" height="78" rx="9" fill="#eafaf0" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="779" y="412" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1b4d22">Cloudflare Tunnel — quiddam.com</text>
  <text x="779" y="430" text-anchor="middle" font-size="9" fill="#2e7d32">qi-mq (QI_MQTunnel) — static named</text>
  <text x="779" y="444" text-anchor="middle" font-size="9" fill="#2e7d32">apex→:7840 · api.→:8500 (webhooks)</text>
  <text x="779" y="460" text-anchor="middle" font-size="8.5" font-weight="600" fill="#2e7d32">Live — reserved hosts 502 until bound</text>

  <!-- ══ DATA (files, no DB) ══ -->
  <rect x="638" y="492" width="282" height="58" rx="9" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="779" y="512" text-anchor="middle" font-size="11" font-weight="700" fill="#0c4a6e">State — JSON files (no database)</text>
  <text x="779" y="528" text-anchor="middle" font-size="8.5" fill="#0284c7">config/mq.json · data/digests/*.json</text>
  <text x="779" y="541" text-anchor="middle" font-size="8.5" fill="#0284c7">data/posts/{drafts,published,failed}/*.json</text>

  <!-- ══ PIPELINE ARROWS ══ -->
  <!-- Kaze -> voice -->
  <line x1="336" y1="218" x2="200" y2="252" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Identity/Soul -> voice -->
  <line x1="118" y1="218" x2="135" y2="252" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- voice -> gate -->
  <line x1="155" y1="352" x2="155" y2="386" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- gate -> Fumi -->
  <line x1="290" y1="429" x2="298" y2="429" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Fumi -> channels -->
  <line x1="480" y1="412" x2="636" y2="320" stroke="#c0392b" stroke-width="1.4" marker-end="url(#arr)"/>
  <!-- scheduler -> voice (heartbeat) -->
  <line x1="553" y1="390" x2="553" y2="356" stroke="#b8860b" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arr-amber)"/>
  <!-- core <-> tunnel -->
  <line x1="616" y1="521" x2="700" y2="468" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr-green)"/>
  <!-- voice/Fumi -> files -->
  <path d="M 480,452 H 560 V 520 H 636" fill="none" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arr-grey)"/>

  <text x="470" y="630" text-anchor="middle" font-size="8.5" fill="#9aa5b1">Quiddity Innovations © 2026 · MQ status: new — most components are built-but-unrun or planned</text>
</svg>
