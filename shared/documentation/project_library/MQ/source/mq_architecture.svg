  <text x="155" y="430" text-anchor="middle" font-size="9" fill="#6b7280">draft → Renne approves → publish</text>
  <text x="155" y="445" text-anchor="middle" font-size="9" fill="#6b7280">enforces Bible Law 0 / D3</text>
  <text x="155" y="461" text-anchor="middle" font-size="8.5" font-weight="600" fill="#9aa5b1">Planned — to build (first dev phase)</text>

