<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 640" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
    <marker id="arr-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32"/>
    </marker>
    <marker id="arr-amber" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#b8860b"/>
    </marker>
    <marker id="arr-grey" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9aa5b1"/>
    </marker>
  </defs>

  <rect width="940" height="640" fill="#f8fafc" rx="12"/>
  <text x="470" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2d3d">Maia Quiddam (MQ) — System Architecture</text>
  <text x="470" y="47" text-anchor="middle" font-size="11.5" fill="#64748b">Quiddity Innovations · Early / Pre-launch · 2026</text>
  <text x="470" y="63" text-anchor="middle" font-size="10" fill="#9aa5b1">Hybrid coherence model — what IS Maia is branded; the plumbing stays invisible. No DB · state is JSON files.</text>

  <!-- ══ LEGEND (top right) ══ -->
  <rect x="724" y="74" width="206" height="150" rx="7" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="827" y="92" text-anchor="middle" font-size="10" font-weight="700" fill="#1f2d3d">Legend</text>
  <rect x="734" y="100" width="14" height="10" rx="2" fill="#eafaf0" stroke="#2e7d32"/>
  <text x="754" y="109" font-size="9" fill="#374151">Live / Active</text>
  <rect x="734" y="117" width="14" height="10" rx="2" fill="#fff8e6" stroke="#b8860b"/>
  <text x="754" y="126" font-size="9" fill="#374151">Built · unrun / Partial</text>
  <rect x="734" y="134" width="14" height="10" rx="2" fill="#f1f3f5" stroke="#9aa5b1"/>
  <text x="754" y="143" font-size="9" fill="#374151">Planned / Pre-wired</text>
  <rect x="734" y="151" width="14" height="10" rx="2" fill="#fdecea" stroke="#c0392b" stroke-dasharray="3,2"/>
  <text x="754" y="160" font-size="9" fill="#374151">Blocked (no credentials)</text>
  <rect x="734" y="168" width="14" height="10" rx="2" fill="#1f2d3d" stroke="#1f2d3d"/>
  <text x="754" y="177" font-size="9" fill="#374151">Core process (dark)</text>
  <line x1="734" y1="192" x2="752" y2="192" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="758" y="196" font-size="9" fill="#374151">Pipeline flow</text>
  <line x1="734" y1="208" x2="752" y2="208" stroke="#2e7d32" stroke-width="1.6" stroke-dasharray="4,2" marker-end="url(#arr-green)"/>
  <text x="758" y="212" font-size="9" fill="#374151">Tunnel / secure path</text>

  <!-- ══ FOUNDATION: Identity Kit + Soul (left column band) ══ -->
  <text x="22" y="90" font-size="10" fill="#9aa5b1" font-weight="600" letter-spacing="1">FOUNDATION</text>
  <rect x="20" y="98" width="196" height="120" rx="9" fill="#fff8e6" stroke="#b8860b" stroke-width="1.5"/>
  <text x="118" y="118" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7a5b06">Identity Kit (identity/)</text>
  <text x="118" y="136" text-anchor="middle" font-size="9" fill="#9a7a2e">manifest.json — all placeholders</text>
  <text x="118" y="150" text-anchor="middle" font-size="9" fill="#9a7a2e">face · voice · style (unlocked)</text>
  <rect x="34" y="160" width="168" height="22" rx="5" fill="#eafaf0" stroke="#2e7d32"/>
  <text x="118" y="175" text-anchor="middle" font-size="9" font-weight="600" fill="#1b4d22">Soul: docs/PERSONA_BIBLE.md</text>
  <text x="118" y="197" text-anchor="middle" font-size="8.5" fill="#5f8a66">Law 0 = Independence · 4 voices</text>
  <text x="118" y="210" text-anchor="middle" font-size="8.5" fill="#9aa5b1">written voice (most developed part)</text>

  <!-- ══ CREW: Kaze (perception) ══ -->
  <text x="248" y="90" font-size="10" fill="#9aa5b1" font-weight="600" letter-spacing="1">CREW (agents/) — invisible plumbing</text>
  <rect x="246" y="98" width="180" height="120" rx="9" fill="#fff8e6" stroke="#b8860b" stroke-width="1.5"/>
  <text x="336" y="118" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7a5b06">Kaze — Perception</text>
  <text x="336" y="135" text-anchor="middle" font-size="9" fill="#9a7a2e">agents/kaze/kaze_mq.py</text>
  <text x="336" y="150" text-anchor="middle" font-size="9" fill="#9a7a2e">RSS senses: travel · photo · ai</text>
  <text x="336" y="165" text-anchor="middle" font-size="9" fill="#9a7a2e">feedparser · md5 dedup</text>
  <text x="336" y="183" text-anchor="middle" font-size="8.5" fill="#9aa5b1">writes data/digests/*.json</text>
  <text x="336" y="205" text-anchor="middle" font-size="8.5" font-weight="600" fill="#b8860b">Built — never run</text>

  <!-- RSS feeds box (source) -->
  <rect x="456" y="98" width="160" height="120" rx="9" fill="#eafaf0" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="536" y="118" text-anchor="middle" font-size="11" font-weight="700" fill="#1b4d22">RSS Sources</text>
  <text x="536" y="136" text-anchor="middle" font-size="9" fill="#2e7d32">Lonely Planet · Nat Geo</text>
  <text x="536" y="150" text-anchor="middle" font-size="9" fill="#2e7d32">PetaPixel · DPReview</text>
  <text x="536" y="164" text-anchor="middle" font-size="9" fill="#2e7d32">Anthropic · DeepMind · HF</text>
  <text x="536" y="183" text-anchor="middle" font-size="8.5" fill="#5f8a66">config/mq.json (data-driven)</text>
  <text x="536" y="205" text-anchor="middle" font-size="8.5" fill="#5f8a66">external feeds (public)</text>

  <!-- arrow RSS -> Kaze -->
  <line x1="456" y1="158" x2="428" y2="158" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- ══ MAIA LAYER: voice (composer) ══ -->
  <text x="22" y="248" font-size="10" fill="#9aa5b1" font-weight="600" letter-spacing="1">MAIA (maia/) — what the world experiences as her</text>
  <rect x="20" y="256" width="270" height="96" rx="9" fill="#fff8e6" stroke="#b8860b" stroke-width="1.5"/>
  <text x="155" y="276" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7a5b06">maia/voice — Composer</text>
  <text x="155" y="293" text-anchor="middle" font-size="9" fill="#9a7a2e">writes posts in her voice (PERSONA_MAIA / PERSONA_QI)</text>
  <text x="155" y="307" text-anchor="middle" font-size="9" fill="#9a7a2e">today lives in agents/fumi/fumi_generate_post.py</text>
  <text x="155" y="324" text-anchor="middle" font-size="8.5" fill="#9aa5b1">LLM: Cloudflare Workers AI → Ollama fallback</text>
  <text x="155" y="340" text-anchor="middle" font-size="8.5" font-weight="600" fill="#b8860b">Built — migrate from Fumi at dev start</text>

  <!-- pre-wired maia rooms -->
  <rect x="300" y="256" width="316" height="96" rx="9" fill="#f1f3f5" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="458" y="276" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">Pre-wired faculties (empty rooms)</text>
  <text x="458" y="295" text-anchor="middle" font-size="9" fill="#6b7280">maia/memory (diary) · maia/speech (TTS)</text>
  <text x="458" y="310" text-anchor="middle" font-size="9" fill="#6b7280">maia/face (photo/video) · maia/conversation</text>
  <text x="458" y="325" text-anchor="middle" font-size="9" fill="#6b7280">maia/longform (essays / the book)</text>
  <text x="458" y="343" text-anchor="middle" font-size="8.5" fill="#9aa5b1">Planned — the evolved Maia roadmap</text>

