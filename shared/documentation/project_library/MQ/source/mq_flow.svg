<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="f" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
    <marker id="f-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c0392b"/>
    </marker>
    <marker id="f-grey" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9aa5b1"/>
    </marker>
  </defs>

  <rect width="960" height="560" fill="#ffffff" rx="12"/>
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2d3d">Maia Quiddam (MQ) — Content Pipeline Data Flow</text>
  <text x="480" y="49" text-anchor="middle" font-size="11.5" fill="#64748b">Quiddity Innovations · Early / Pre-launch · 2026</text>
  <text x="480" y="65" text-anchor="middle" font-size="10" fill="#9aa5b1">No database — every stage reads/writes JSON files on disk. RSS → digest → draft → (gate) → published. End-to-end never run.</text>

  <!-- ══ LEGEND (top right) ══ -->
  <rect x="744" y="78" width="200" height="132" rx="7" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="844" y="96" text-anchor="middle" font-size="10" font-weight="700" fill="#1f2d3d">Legend</text>
  <rect x="754" y="104" width="14" height="10" rx="2" fill="#eafaf0" stroke="#2e7d32"/>
  <text x="774" y="113" font-size="9" fill="#374151">Live / Active</text>
  <rect x="754" y="121" width="14" height="10" rx="2" fill="#fff8e6" stroke="#b8860b"/>
  <text x="774" y="130" font-size="9" fill="#374151">Built · never run</text>
  <rect x="754" y="138" width="14" height="10" rx="2" fill="#f1f3f5" stroke="#9aa5b1"/>
  <text x="774" y="147" font-size="9" fill="#374151">Planned / Pre-wired</text>
  <rect x="754" y="155" width="14" height="10" rx="2" fill="#fdecea" stroke="#c0392b" stroke-dasharray="3,2"/>
  <text x="774" y="164" font-size="9" fill="#374151">Blocked (no credentials)</text>
  <rect x="754" y="172" width="14" height="10" rx="2" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="774" y="181" font-size="9" fill="#374151">JSON file on disk</text>
  <line x1="754" y1="196" x2="772" y2="196" stroke="#6b7280" stroke-width="1.6" marker-end="url(#f)"/>
  <text x="778" y="200" font-size="9" fill="#374151">Data flow</text>

  <!-- ══ STAGE 1: RSS sources ══ -->
  <rect x="24" y="110" width="150" height="86" rx="9" fill="#eafaf0" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="99" y="130" text-anchor="middle" font-size="11" font-weight="700" fill="#1b4d22">RSS Feeds</text>
  <text x="99" y="148" text-anchor="middle" font-size="8.5" fill="#2e7d32">travel · photo · ai</text>
  <text x="99" y="161" text-anchor="middle" font-size="8.5" fill="#2e7d32">9 sources</text>
  <text x="99" y="178" text-anchor="middle" font-size="8" fill="#5f8a66">defined in</text>
  <text x="99" y="189" text-anchor="middle" font-size="8" fill="#5f8a66">config/mq.json</text>

  <!-- ══ STAGE 2: Kaze ══ -->
  <rect x="218" y="104" width="160" height="98" rx="9" fill="#fff8e6" stroke="#b8860b" stroke-width="1.5"/>
  <text x="298" y="124" text-anchor="middle" font-size="11" font-weight="700" fill="#7a5b06">Kaze (Perception)</text>
  <text x="298" y="142" text-anchor="middle" font-size="8.5" fill="#9a7a2e">kaze_mq.py</text>
  <text x="298" y="156" text-anchor="middle" font-size="8.5" fill="#9a7a2e">feedparser · strip HTML</text>
  <text x="298" y="170" text-anchor="middle" font-size="8.5" fill="#9a7a2e">md5(url) dedup · sort</text>
  <text x="298" y="190" text-anchor="middle" font-size="8" font-weight="600" fill="#b8860b">Built — never run</text>

  <!-- digest file -->
  <rect x="218" y="232" width="160" height="56" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="298" y="252" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0c4a6e">kaze-&lt;stream&gt;-digest.json</text>
  <text x="298" y="268" text-anchor="middle" font-size="8" fill="#0284c7">data/digests/ · {items:[...]}</text>
  <text x="298" y="281" text-anchor="middle" font-size="8" fill="#9aa5b1">0 files exist on disk</text>

  <!-- ══ STAGE 3: Fumi voice (composer) ══ -->
  <rect x="430" y="104" width="170" height="98" rx="9" fill="#fff8e6" stroke="#b8860b" stroke-width="1.5"/>
  <text x="515" y="124" text-anchor="middle" font-size="11" font-weight="700" fill="#7a5b06">Composer (maia/voice)</text>
  <text x="515" y="142" text-anchor="middle" font-size="8.5" fill="#9a7a2e">fumi_generate_post.py</text>
  <text x="515" y="156" text-anchor="middle" font-size="8.5" fill="#9a7a2e">persona prompt + item</text>
  <text x="515" y="170" text-anchor="middle" font-size="8.5" fill="#9a7a2e">→ LLM → post text</text>
  <text x="515" y="190" text-anchor="middle" font-size="8" font-weight="600" fill="#b8860b">Built — never run</text>

  <!-- LLM box -->
  <rect x="430" y="232" width="170" height="62" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="5,3"/>
  <text x="515" y="252" text-anchor="middle" font-size="9.5" font-weight="700" fill="#8c2a1f">LLM (cloud → local)</text>
  <text x="515" y="268" text-anchor="middle" font-size="8" fill="#a93b2c">Cloudflare qwen2.5-7b → Ollama qwen3:8b</text>
  <text x="515" y="282" text-anchor="middle" font-size="8" font-weight="600" fill="#c0392b">no CF token configured</text>

  <!-- ══ STAGE 4: draft file ══ -->
  <rect x="660" y="104" width="170" height="98" rx="9" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="745" y="124" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0c4a6e">Post Draft (JSON)</text>
  <text x="745" y="142" text-anchor="middle" font-size="8.5" fill="#0284c7">data/posts/drafts/</text>
  <text x="745" y="156" text-anchor="middle" font-size="8.5" fill="#0284c7">status:draft · post_text</text>
  <text x="745" y="170" text-anchor="middle" font-size="8.5" fill="#0284c7">fb_post_id:null</text>
  <text x="745" y="190" text-anchor="middle" font-size="8" fill="#9aa5b1">0 drafts on disk</text>

  <!-- ══ STAGE 5: GATE ══ -->
  <rect x="660" y="244" width="170" height="74" rx="9" fill="#f1f3f5" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="745" y="266" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">Approval Gate</text>
  <text x="745" y="284" text-anchor="middle" font-size="8.5" fill="#6b7280">Renne approves (Law 0 / D3)</text>
  <text x="745" y="298" text-anchor="middle" font-size="8.5" fill="#6b7280">draft → approved → publish</text>
  <text x="745" y="312" text-anchor="middle" font-size="8" font-weight="600" fill="#9aa5b1">Planned — to build</text>

  <!-- ══ STAGE 6: Fumi publisher ══ -->
  <rect x="430" y="360" width="200" height="92" rx="9" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="530" y="382" text-anchor="middle" font-size="11" font-weight="700" fill="#8c2a1f">Fumi — Publisher</text>
  <text x="530" y="400" text-anchor="middle" font-size="8.5" fill="#a93b2c">fumi_post_facebook.py</text>
  <text x="530" y="414" text-anchor="middle" font-size="8.5" fill="#a93b2c">POST graph.facebook.com/v19.0/{page}/feed</text>
  <text x="530" y="428" text-anchor="middle" font-size="8.5" fill="#a93b2c">--dry-run only path today</text>
  <text x="530" y="444" text-anchor="middle" font-size="8" font-weight="600" fill="#c0392b">Blocked — no Page token</text>

  <!-- published / failed files -->
  <rect x="660" y="356" width="170" height="44" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.4"/>
  <text x="745" y="374" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0c4a6e">published/*.json</text>
  <text x="745" y="390" text-anchor="middle" font-size="8" fill="#0284c7">+ fb_post_id · published_at</text>

  <rect x="660" y="408" width="170" height="44" rx="8" fill="#f1f3f5" stroke="#9aa5b1" stroke-width="1.4"/>
  <text x="745" y="426" text-anchor="middle" font-size="9.5" font-weight="700" fill="#475569">failed/*.json</text>
  <text x="745" y="442" text-anchor="middle" font-size="8" fill="#6b7280">+ error (on HTTP / exception)</text>

  <!-- ══ SCHEDULER (heartbeat) ══ -->
  <rect x="24" y="360" width="360" height="92" rx="9" fill="#fff8e6" stroke="#b8860b" stroke-width="1.5"/>
  <text x="204" y="382" text-anchor="middle" font-size="11" font-weight="700" fill="#7a5b06">Scheduler (Heartbeat) — fumi_scheduler.py</text>
  <text x="204" y="402" text-anchor="middle" font-size="8.5" fill="#9a7a2e">maia_weekly (Sat): Kaze travel+photo → generate → publish</text>
  <text x="204" y="416" text-anchor="middle" font-size="8.5" fill="#9a7a2e">qi_daily (Mon-Fri): Kaze ai → generate → publish</text>
  <text x="204" y="430" text-anchor="middle" font-size="8.5" fill="#9a7a2e">subprocess steps · injects --dry-run for publish</text>
  <text x="204" y="446" text-anchor="middle" font-size="8" font-weight="600" fill="#b8860b">schtasks setup ready — jobs NOT registered</text>

  <!-- ══ ARROWS ══ -->
  <!-- RSS -> Kaze -->
  <line x1="174" y1="153" x2="216" y2="153" stroke="#6b7280" stroke-width="1.5" marker-end="url(#f)"/>
  <!-- Kaze -> digest -->
  <line x1="298" y1="202" x2="298" y2="230" stroke="#6b7280" stroke-width="1.5" marker-end="url(#f)"/>
  <!-- digest -> composer -->
  <path d="M 378,258 H 404 V 153 H 428" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#f)"/>
  <!-- composer <-> LLM -->
  <line x1="515" y1="202" x2="515" y2="230" stroke="#6b7280" stroke-width="1.5" marker-end="url(#f)"/>
  <!-- composer -> draft -->
  <line x1="600" y1="153" x2="658" y2="153" stroke="#6b7280" stroke-width="1.5" marker-end="url(#f)"/>
  <!-- draft -> gate -->
  <line x1="745" y1="202" x2="745" y2="242" stroke="#6b7280" stroke-width="1.5" marker-end="url(#f)"/>
  <!-- gate -> Fumi publisher -->
  <path d="M 660,300 H 645 V 406 H 632" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#f)"/>
  <!-- Fumi -> published -->
  <line x1="630" y1="386" x2="658" y2="378" stroke="#c0392b" stroke-width="1.4" marker-end="url(#f-red)"/>
  <!-- Fumi -> failed -->
  <line x1="630" y1="424" x2="658" y2="428" stroke="#9aa5b1" stroke-width="1.4" marker-end="url(#f-grey)"/>

  <text x="480" y="544" text-anchor="middle" font-size="8.5" fill="#9aa5b1">Quiddity Innovations © 2026 · The gate stage is planned; today Fumi would publish without approval (Bible Law 0 forbids it → gate is a high-priority build)</text>
</svg>
