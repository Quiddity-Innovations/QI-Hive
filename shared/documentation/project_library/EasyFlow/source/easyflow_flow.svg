<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="f" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#285bac"/>
    </marker>
    <marker id="f-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32"/>
    </marker>
    <marker id="f-purple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a479e2"/>
    </marker>
    <marker id="f-gray" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9aa5b1"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="660" fill="#ffffff" rx="12"/>
  <text x="500" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">EasyFlow — Email Classification Data Flow</text>
  <text x="500" y="50" text-anchor="middle" font-size="11.5" fill="#64748b">Quiddity Innovations · Gmail API · 2026</text>
  <text x="500" y="66" text-anchor="middle" font-size="10" fill="#9aa5b1">How one incoming email moves from inbox to a tier label (no database — Gmail is the store)</text>

  <!-- ══ LEGEND (top right) ══ -->
  <rect x="784" y="80" width="200" height="138" rx="7" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="884" y="98" text-anchor="middle" font-size="10" font-weight="700" fill="#1f2d3d">Legend</text>
  <rect x="794" y="106" width="14" height="10" rx="2" fill="#eafaf0" stroke="#2e7d32"/>
  <text x="814" y="115" font-size="9" fill="#374151">Rule match (free)</text>
  <rect x="794" y="123" width="14" height="10" rx="2" fill="#faf5ff" stroke="#a479e2"/>
  <text x="814" y="132" font-size="9" fill="#374151">AI triage (BYOK)</text>
  <rect x="794" y="140" width="14" height="10" rx="2" fill="#f1f3f5" stroke="#9aa5b1"/>
  <text x="814" y="149" font-size="9" fill="#374151">No match → Triage</text>
  <rect x="794" y="157" width="14" height="10" rx="2" fill="#1f2d3d" stroke="#1f2d3d"/>
  <text x="814" y="166" font-size="9" fill="#374151">Decision (engine)</text>
  <line x1="794" y1="182" x2="812" y2="182" stroke="#285bac" stroke-width="2" marker-end="url(#f)"/>
  <text x="818" y="186" font-size="9" fill="#374151">Primary path</text>
  <line x1="794" y1="199" x2="812" y2="199" stroke="#2e7d32" stroke-width="2" marker-end="url(#f-green)"/>
  <text x="818" y="203" font-size="9" fill="#374151">Gmail write</text>

  <!-- ══ STEP 1: New email ══ -->
  <rect x="30" y="250" width="160" height="86" rx="9" fill="#fde9e6" stroke="#ac2b16" stroke-width="1.6"/>
  <text x="110" y="278" text-anchor="middle" font-size="12" font-weight="700" fill="#7c1d0f">New Email</text>
  <text x="110" y="297" text-anchor="middle" font-size="9" fill="#ac2b16">arrives in Gmail inbox</text>
  <text x="110" y="311" text-anchor="middle" font-size="8.5" fill="#c2654f">From · Subject · Snippet</text>
  <text x="110" y="325" text-anchor="middle" font-size="8" fill="#c2654f">in:inbox is:unread</text>

  <!-- arrow 1 → 2 -->
  <line x1="190" y1="293" x2="232" y2="293" stroke="#285bac" stroke-width="2" marker-end="url(#f)"/>

  <!-- ══ STEP 2: Pickup (two triggers) ══ -->
  <rect x="234" y="234" width="176" height="118" rx="9" fill="#eafaf0" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="322" y="256" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1b4d22">Pickup</text>
  <rect x="246" y="266" width="152" height="34" rx="6" fill="#ffffff" stroke="#bfe3c9"/>
  <text x="322" y="280" text-anchor="middle" font-size="8.5" font-weight="600" fill="#1b4d22">Apps Script (server)</text>
  <text x="322" y="293" text-anchor="middle" font-size="8" fill="#2e7d32">classifyNewEmails · 15 min</text>
  <rect x="246" y="306" width="152" height="34" rx="6" fill="#ffffff" stroke="#bfe3c9"/>
  <text x="322" y="320" text-anchor="middle" font-size="8.5" font-weight="600" fill="#1b4d22">Extension (browser)</text>
  <text x="322" y="333" text-anchor="middle" font-size="8" fill="#2e7d32">side panel · on demand</text>

  <!-- arrow 2 → 3 -->
  <line x1="410" y1="293" x2="452" y2="293" stroke="#285bac" stroke-width="2" marker-end="url(#f)"/>

  <!-- ══ STEP 3: Rules engine (decision) ══ -->
  <rect x="454" y="244" width="190" height="98" rx="9" fill="#1f2d3d" stroke="#334155" stroke-width="2"/>
  <text x="549" y="268" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">Rules Engine</text>
  <text x="549" y="285" text-anchor="middle" font-size="8.5" fill="#cbd5e1">classifyMessage_( )</text>
  <text x="549" y="299" text-anchor="middle" font-size="8.5" fill="#94a3b8">match From domain,</text>
  <text x="549" y="312" text-anchor="middle" font-size="8.5" fill="#94a3b8">then Subject keyword</text>
  <text x="549" y="328" text-anchor="middle" font-size="8" fill="#64748b">TIER_RULES ← config.json</text>

  <!-- branch A: matched → label -->
  <line x1="644" y1="276" x2="700" y2="248" stroke="#2e7d32" stroke-width="2" marker-end="url(#f-green)"/>
  <text x="660" y="252" font-size="8.5" font-weight="600" fill="#1b4d22">matched</text>

  <!-- branch B: no match → triage path (down) -->
  <line x1="549" y1="342" x2="549" y2="392" stroke="#9aa5b1" stroke-width="2" marker-end="url(#f-gray)"/>
  <text x="556" y="370" font-size="8.5" font-weight="600" fill="#6b7280">no match</text>

  <!-- ══ STEP 4 (top right): Apply tier label ══ -->
  <rect x="704" y="234" width="262" height="118" rx="9" fill="#eafaf0" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="835" y="256" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1b4d22">Apply Tier Label  (Gmail API)</text>
  <rect x="716" y="266" width="238" height="20" rx="5" fill="#ffffff" stroke="#bfe3c9"/>
  <text x="835" y="280" text-anchor="middle" font-size="8.5" fill="#1b4d22">add sub-label  e.g. 3 - Life Admin/Bills/Internet</text>
  <rect x="716" y="290" width="238" height="20" rx="5" fill="#ffffff" stroke="#bfe3c9"/>
  <text x="835" y="304" text-anchor="middle" font-size="8.5" fill="#1b4d22">add parent tier label  e.g. 3 - Life Admin</text>
  <rect x="716" y="314" width="238" height="20" rx="5" fill="#ffffff" stroke="#bfe3c9"/>
  <text x="835" y="328" text-anchor="middle" font-size="8.5" fill="#1b4d22">remove INBOX  →  moveToArchive()</text>
  <text x="835" y="347" text-anchor="middle" font-size="8" fill="#5f8a66">messages.modify / batchModify · thread.addLabel</text>

  <!-- ══ STEP 5 (middle): Triage decision (no match) ══ -->
  <rect x="430" y="392" width="238" height="86" rx="9" fill="#f1f3f5" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="549" y="414" text-anchor="middle" font-size="11" font-weight="700" fill="#566069">Triage Label</text>
  <text x="549" y="432" text-anchor="middle" font-size="8.5" fill="#6b7280">unsorted mail labeled Triage</text>
  <text x="549" y="446" text-anchor="middle" font-size="8.5" fill="#6b7280">stale (&gt;30d) auto-triaged nightly</text>
  <text x="549" y="462" text-anchor="middle" font-size="8" fill="#9aa5b1">triageStaleInbox() · daily 1 AM</text>

  <!-- arrow triage → AI -->
  <line x1="430" y1="435" x2="320" y2="435" stroke="#a479e2" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#f-purple)"/>
  <text x="360" y="427" font-size="8.5" font-weight="600" fill="#7e3fc0">optional</text>

  <!-- ══ STEP 6 (left middle): AI triage ══ -->
  <rect x="60" y="392" width="250" height="118" rx="9" fill="#faf5ff" stroke="#a479e2" stroke-width="1.5"/>
  <text x="185" y="414" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5b2a91">AI Triage  (Bring-Your-Own-Key)</text>
  <rect x="72" y="424" width="226" height="20" rx="5" fill="#ffffff" stroke="#e7d6f7"/>
  <text x="185" y="438" text-anchor="middle" font-size="8.5" fill="#5b2a91">send From + Subject + Snippet only</text>
  <rect x="72" y="448" width="226" height="20" rx="5" fill="#ffffff" stroke="#e7d6f7"/>
  <text x="185" y="462" text-anchor="middle" font-size="8.5" fill="#5b2a91">Gemini / OpenAI / Anthropic / Ollama</text>
  <rect x="72" y="472" width="226" height="20" rx="5" fill="#ffffff" stroke="#e7d6f7"/>
  <text x="185" y="486" text-anchor="middle" font-size="8.5" fill="#5b2a91">parse {label, confidence}</text>
  <text x="185" y="503" text-anchor="middle" font-size="8" fill="#a479e2">accepted only if label exists in tier tree</text>

  <!-- AI → apply label (curve up-right) -->
  <path d="M 310,430 C 360,420 380,360 452,300" fill="none" stroke="#2e7d32" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#f-green)"/>
  <text x="372" y="350" font-size="8.5" font-weight="600" fill="#1b4d22">confident → label</text>

  <!-- ══ RESULT (bottom): organized inbox ══ -->
  <rect x="120" y="540" width="760" height="92" rx="10" fill="#fde9e6" stroke="#ac2b16" stroke-width="1.6"/>
  <text x="500" y="564" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7c1d0f">Result — A Tiered, Archived Inbox</text>
  <text x="500" y="582" text-anchor="middle" font-size="9" fill="#ac2b16">Inbox holds only the genuinely unsorted; everything else is filed under its color-coded tier</text>
  <!-- six tier chips -->
  <rect x="150" y="595" width="112" height="26" rx="6" fill="#ac2b16"/><text x="206" y="612" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">1 - ME</text>
  <rect x="270" y="595" width="124" height="26" rx="6" fill="#cf8933"/><text x="332" y="612" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">2 - Inner Circle</text>
  <rect x="402" y="595" width="116" height="26" rx="6" fill="#b8941f"/><text x="460" y="612" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">3 - Life Admin</text>
  <rect x="526" y="595" width="134" height="26" rx="6" fill="#285bac"/><text x="593" y="612" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">4 - Active Projects</text>
  <rect x="668" y="595" width="100" height="26" rx="6" fill="#8c5fd0"/><text x="718" y="612" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">5 - Interests</text>
  <rect x="776" y="595" width="86" height="26" rx="6" fill="#666666"/><text x="819" y="612" text-anchor="middle" font-size="8.5" font-weight="600" fill="#fff">6 - Low Pri.</text>

  <!-- arrows from apply-label and triage down to result -->
  <line x1="835" y1="352" x2="835" y2="536" stroke="#2e7d32" stroke-width="1.8" marker-end="url(#f-green)"/>
  <line x1="549" y1="478" x2="549" y2="536" stroke="#9aa5b1" stroke-width="1.8" marker-end="url(#f-gray)"/>
</svg>
