<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="f" markerWidth="11" markerHeight="8" refX="11" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 11 4, 0 8" fill="#1f2d3d"/>
    </marker>
    <marker id="fg" markerWidth="11" markerHeight="8" refX="11" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 11 4, 0 8" fill="#2e7d32"/>
    </marker>
    <marker id="fa" markerWidth="11" markerHeight="8" refX="11" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 11 4, 0 8" fill="#b8860b"/>
    </marker>
    <marker id="fgrey" markerWidth="11" markerHeight="8" refX="11" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 11 4, 0 8" fill="#9aa5b1"/>
    </marker>
  </defs>

  <rect width="980" height="600" fill="#ffffff" rx="12"/>
  <text x="490" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">Claude Voice — Conversation Data Flow</text>
  <text x="490" y="50" text-anchor="middle" font-size="11.5" fill="#64748b">Quiddity Innovations · Active Development · 2026</text>
  <text x="490" y="66" text-anchor="middle" font-size="10" fill="#9aa5b1">voice in → STT → dual-brain router → real Claude (free CLI) → TTS → channel out · state in JSON files, no database</text>

  <!-- ══ LEGEND ══ -->
  <rect x="770" y="80" width="200" height="132" rx="7" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="870" y="98" text-anchor="middle" font-size="10" font-weight="700" fill="#1f2d3d">Legend</text>
  <rect x="780" y="106" width="14" height="10" rx="2" fill="#eafaf0" stroke="#2e7d32"/>
  <text x="800" y="115" font-size="9" fill="#374151">Live stage</text>
  <rect x="780" y="123" width="14" height="10" rx="2" fill="#fff8e6" stroke="#b8860b"/>
  <text x="800" y="132" font-size="9" fill="#374151">Built / partial stage</text>
  <rect x="780" y="140" width="14" height="10" rx="2" fill="#f1f3f5" stroke="#9aa5b1"/>
  <text x="800" y="149" font-size="9" fill="#374151">Planned stage</text>
  <rect x="780" y="157" width="14" height="10" rx="2" fill="#1f2d3d" stroke="#1f2d3d"/>
  <text x="800" y="166" font-size="9" fill="#374151">Decision point</text>
  <line x1="780" y1="182" x2="798" y2="182" stroke="#2e7d32" stroke-width="2" marker-end="url(#fg)"/>
  <text x="804" y="186" font-size="9" fill="#374151">Free real-Claude path</text>
  <line x1="780" y1="199" x2="798" y2="199" stroke="#9aa5b1" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#fgrey)"/>
  <text x="804" y="203" font-size="9" fill="#374151">Planned dispatch path</text>

  <!-- 1. INPUT -->
  <rect x="24" y="96" width="150" height="92" rx="9" fill="#eafaf0" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="24" y="96" width="150" height="24" rx="9" fill="#1f2d3d"/>
  <text x="99" y="113" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1 · Voice / Text In</text>
  <text x="36" y="138" font-size="8.5" fill="#374151">Mic · LINE voice note</text>
  <text x="36" y="152" font-size="8.5" fill="#374151">Telegram voice · typed text</text>
  <text x="36" y="166" font-size="8.5" fill="#5f8a66">VAD / wake / push-to-talk</text>
  <text x="36" y="180" font-size="8" fill="#9aa5b1">sounddevice · ffmpeg 16k</text>

  <line x1="174" y1="142" x2="206" y2="142" stroke="#2e7d32" stroke-width="2" marker-end="url(#fg)"/>

  <!-- 2. STT -->
  <rect x="206" y="96" width="150" height="92" rx="9" fill="#eafaf0" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="206" y="96" width="150" height="24" rx="9" fill="#1f2d3d"/>
  <text x="281" y="113" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2 · STT</text>
  <text x="218" y="138" font-size="8.5" fill="#374151">faster-whisper (local)</text>
  <text x="218" y="152" font-size="8.5" fill="#374151">CPU int8 · base.en / base</text>
  <text x="218" y="166" font-size="8.5" fill="#5f8a66">stt_hint biases brain names</text>
  <text x="218" y="180" font-size="8" fill="#9aa5b1">free · private · on-device</text>

  <line x1="356" y1="142" x2="388" y2="142" stroke="#2e7d32" stroke-width="2" marker-end="url(#fg)"/>

  <!-- 3. ROUTER (decision) -->
  <rect x="388" y="96" width="170" height="92" rx="9" fill="#1f2d3d" stroke="#334155" stroke-width="1.5"/>
  <text x="473" y="116" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3 · Dual-Brain Router</text>
  <text x="400" y="135" font-size="8.5" fill="#cbd5e1">brain.resolve(text)</text>
  <text x="400" y="149" font-size="8.5" fill="#cbd5e1">name toggle · hard-set lock</text>
  <text x="400" y="163" font-size="8.5" fill="#cbd5e1">“Claude” vs “Ronald”</text>
  <text x="400" y="178" font-size="8" fill="#94a3b8">mishearing-tolerant match</text>

  <!-- router -> Claude (down-right) -->
  <line x1="558" y1="128" x2="624" y2="128" stroke="#2e7d32" stroke-width="2" marker-end="url(#fg)"/>
  <text x="566" y="121" font-size="8" fill="#2e7d32">“Claude”</text>

  <!-- router -> Ronald (down) -->
  <path d="M 473,188 V 214 H 281 V 240" fill="none" stroke="#b8860b" stroke-width="1.8" marker-end="url(#fa)"/>
  <text x="360" y="210" font-size="8" fill="#b8860b">“Ronald” / fallback (disabled)</text>

  <!-- 4. REAL CLAUDE (CLI) -->
  <rect x="624" y="96" width="170" height="92" rx="9" fill="#eafaf0" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="624" y="96" width="170" height="24" rx="9" fill="#1f2d3d"/>
  <text x="709" y="113" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">4 · Real Claude (FREE)</text>
  <text x="636" y="137" font-size="8.5" fill="#374151">backends.stream_claude_cli</text>
  <text x="636" y="151" font-size="8.5" fill="#374151">headless `claude -p` (sonnet)</text>
  <text x="636" y="165" font-size="8.5" fill="#5f8a66">OAUTH_TOKEN (subscription)</text>
  <text x="636" y="179" font-size="8" fill="#9aa5b1">~20s/turn · no API bill</text>

  <!-- Claude -> TTS (down) -->
  <path d="M 709,188 V 236" fill="none" stroke="#2e7d32" stroke-width="2" marker-end="url(#fg)"/>

  <!-- Ronald local brain box -->
  <rect x="206" y="240" width="150" height="84" rx="9" fill="#fff8e6" stroke="#b8860b" stroke-width="1.5"/>
  <rect x="206" y="240" width="150" height="24" rx="9" fill="#1f2d3d"/>
  <text x="281" y="257" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">Local brain “Ronald”</text>
  <text x="218" y="280" font-size="8.5" fill="#7a5b06">Ollama llama3.1:8b</text>
  <text x="218" y="294" font-size="8.5" fill="#7a5b06">instant · free · NOT Claude</text>
  <text x="218" y="308" font-size="8" fill="#9a7a2e">disabled by config; honest</text>
  <text x="218" y="320" font-size="8" fill="#9a7a2e">“not connected” if off</text>

  <!-- Ronald -> TTS -->
  <path d="M 356,282 H 430 V 282" fill="none" stroke="#b8860b" stroke-width="1.6" marker-end="url(#fa)"/>

  <!-- 5. TTS -->
  <rect x="624" y="236" width="170" height="92" rx="9" fill="#eafaf0" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="624" y="236" width="170" height="24" rx="9" fill="#1f2d3d"/>
  <text x="709" y="253" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">5 · TTS (MALE voice)</text>
  <text x="636" y="277" font-size="8.5" fill="#374151">edge-tts en-US-AndrewNeural</text>
  <text x="636" y="291" font-size="8.5" fill="#374151">per-sentence stream · ffplay</text>
  <text x="636" y="305" font-size="8.5" fill="#5f8a66">pronounce.apply · barge-in</text>
  <text x="636" y="319" font-size="8" fill="#9aa5b1">SAPI offline fallback</text>

  <!-- TTS modality box (between) -->
  <rect x="430" y="252" width="170" height="60" rx="9" fill="#eafaf0" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="515" y="271" text-anchor="middle" font-size="10" font-weight="700" fill="#14532d">modality.choose()</text>
  <text x="442" y="287" font-size="8.5" fill="#374151">text · +voice · +video</text>
  <text x="442" y="300" font-size="8" fill="#9aa5b1">length + “moment” rules</text>

  <line x1="600" y1="282" x2="624" y2="282" stroke="#2e7d32" stroke-width="2" marker-end="url(#fg)"/>
  <!-- Claude box feeds modality -->
  <path d="M 624,160 H 615 V 252" fill="none" stroke="#9aa5b1" stroke-width="1" marker-end="url(#fgrey)"/>

  <!-- 6. OUT -->
  <rect x="624" y="372" width="170" height="92" rx="9" fill="#eafaf0" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="624" y="372" width="170" height="24" rx="9" fill="#1f2d3d"/>
  <text x="709" y="389" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">6 · Channel Out</text>
  <text x="636" y="413" font-size="8.5" fill="#374151">Speakers (ffplay)</text>
  <text x="636" y="427" font-size="8.5" fill="#374151">LINE m4a · TG OGG/Opus</text>
  <text x="636" y="441" font-size="8.5" fill="#374151">Meeting room broadcast</text>
  <text x="636" y="455" font-size="8" fill="#9aa5b1">text + voice (+ video opt-in)</text>

  <path d="M 709,328 V 372" fill="none" stroke="#2e7d32" stroke-width="2" marker-end="url(#fg)"/>

  <!-- STATE box -->
  <rect x="24" y="372" width="320" height="92" rx="9" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <rect x="24" y="372" width="320" height="24" rx="9" fill="#1f2d3d"/>
  <text x="184" y="389" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">State — JSON files (no database)</text>
  <text x="36" y="413" font-size="8.5" fill="#0c4a6e">data\brain_state.json — active brain (shared by all surfaces + :8720 UI)</text>
  <text x="36" y="429" font-size="8.5" fill="#0c4a6e">data\line_control.json — paused · guests · directive</text>
  <text x="36" y="445" font-size="8.5" fill="#0c4a6e">data\bridge_health.json — hourly probe (served at :8720/bridge/health)</text>
  <text x="36" y="459" font-size="8" fill="#0284c7">config.json (live settings) · secrets\claude_voice.env (tokens, gitignored)</text>

  <!-- router reads/writes state -->
  <path d="M 388,160 H 360 V 372" fill="none" stroke="#0284c7" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#f)"/>
  <text x="364" y="356" font-size="7.5" fill="#0284c7">read/write</text>

  <!-- PLANNED dispatch lane -->
  <rect x="24" y="492" width="770" height="78" rx="9" fill="#f1f3f5" stroke="#9aa5b1" stroke-width="1.4" stroke-dasharray="6,3"/>
  <text x="38" y="512" font-size="10.5" font-weight="700" fill="#475569">PLANNED — Voice Dispatch lane (reuses the existing QI Hive queue, no parallel layer)</text>
  <text x="38" y="531" font-size="8.5" fill="#64748b">Speak a work order → classify (conversation vs dispatch) → POST :9011/api/dispatch source=voice_* → CoWork queue</text>
  <text x="38" y="547" font-size="8.5" fill="#64748b">→ approve BY VOICE (PATCH /api/dispatch/&lt;id&gt;) → net-new executor runs `claude -p` + hive-&lt;role&gt; agents (free)</text>
  <text x="38" y="563" font-size="8.5" fill="#64748b">→ write report to C:\QIH\shared\reports\inbox\ → net-new notifier speaks/LINE/TG: “Done: &lt;result&gt;.”</text>

  <!-- router -> dispatch (planned) -->
  <path d="M 473,188 V 470 H 200 V 492" fill="none" stroke="#9aa5b1" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#fgrey)"/>
</svg>
