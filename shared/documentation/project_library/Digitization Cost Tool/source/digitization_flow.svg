<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5b6770"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>

  <!-- Title -->
  <text x="500" y="38" text-anchor="middle" font-size="23" font-weight="700" fill="#1f2d3d">Cost Model Data Flow — Inputs to Comparison</text>
  <text x="500" y="60" text-anchor="middle" font-size="13" fill="#666">Quiddity Innovations · Complete · 2026</text>

  <!-- Legend box -->
  <g>
    <rect x="784" y="76" width="200" height="116" rx="8" fill="#ffffff" stroke="#ccc"/>
    <text x="796" y="96" font-size="12" font-weight="700" fill="#1f2d3d">Legend</text>
    <rect x="796" y="106" width="14" height="14" rx="3" fill="#eafaf0" stroke="#2e7d32"/>
    <text x="818" y="117" font-size="11" fill="#333">Input data</text>
    <rect x="796" y="126" width="14" height="14" rx="3" fill="#1f2d3d"/>
    <text x="818" y="137" font-size="11" fill="#333">Formula / compute</text>
    <rect x="796" y="146" width="14" height="14" rx="3" fill="#fff8e6" stroke="#b8860b"/>
    <text x="818" y="157" font-size="11" fill="#333">Rate / assumption</text>
    <rect x="796" y="166" width="14" height="14" rx="3" fill="#eef8ef" stroke="#1a7f37"/>
    <text x="818" y="177" font-size="11" fill="#333">Comparison output</text>
  </g>

  <!-- Band 1: INPUTS -->
  <text x="40" y="100" font-size="13" font-weight="700" fill="#9aa5b1">1 · INPUTS</text>
  <rect x="40" y="110" width="200" height="70" rx="6" fill="#eafaf0" stroke="#2e7d32"/>
  <text x="140" y="134" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d">Records profile</text>
  <text x="140" y="152" text-anchor="middle" font-size="10" fill="#555">boxes x pages/box</text>
  <text x="140" y="166" text-anchor="middle" font-size="10" fill="#555">or page override</text>

  <rect x="40" y="190" width="200" height="64" rx="6" fill="#eafaf0" stroke="#2e7d32"/>
  <text x="140" y="214" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d">Condition + depth</text>
  <text x="140" y="232" text-anchor="middle" font-size="10" fill="#555">clean/avg/complex ·</text>
  <text x="140" y="245" text-anchor="middle" font-size="10" fill="#555">basic/std/deep · OCR</text>

  <rect x="40" y="264" width="200" height="64" rx="6" fill="#eafaf0" stroke="#2e7d32"/>
  <text x="140" y="288" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d">Staffing</text>
  <text x="140" y="306" text-anchor="middle" font-size="10" fill="#555">students x hrs/week,</text>
  <text x="140" y="319" text-anchor="middle" font-size="10" fill="#555">own scanner?</text>

  <rect x="40" y="338" width="200" height="76" rx="6" fill="#eafaf0" stroke="#2e7d32"/>
  <text x="140" y="362" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d">Hybrid matrix (inp.hy)</text>
  <text x="140" y="380" text-anchor="middle" font-size="10" fill="#555">11 services:</text>
  <text x="140" y="394" text-anchor="middle" font-size="10" fill="#555">vendor or BU per task</text>
  <text x="140" y="408" text-anchor="middle" font-size="10" fill="#555">+ optional budget</text>

  <!-- Rate table feeding compute -->
  <rect x="40" y="470" width="200" height="120" rx="6" fill="#fff8e6" stroke="#b8860b"/>
  <text x="140" y="494" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d">RATE_DEFS</text>
  <text x="140" y="514" text-anchor="middle" font-size="10" fill="#555">vendor $/page rates</text>
  <text x="140" y="530" text-anchor="middle" font-size="10" fill="#555">student wages + fringe</text>
  <text x="140" y="546" text-anchor="middle" font-size="10" fill="#555">throughput (pages/hr)</text>
  <text x="140" y="562" text-anchor="middle" font-size="10" fill="#555">internal effort hrs</text>
  <text x="140" y="578" text-anchor="middle" font-size="9.5" fill="#b35900">editable · assumptions tagged</text>

  <!-- Band 2: COMPUTE -->
  <text x="320" y="100" font-size="13" font-weight="700" fill="#9aa5b1">2 · COST-MODEL FORMULAS — calc()</text>

  <rect x="320" y="110" width="360" height="80" rx="6" fill="#1f2d3d"/>
  <text x="500" y="134" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Derive quantities</text>
  <text x="500" y="154" text-anchor="middle" font-size="10.5" fill="#cdd6df">pages = override or boxes x ppb</text>
  <text x="500" y="170" text-anchor="middle" font-size="10.5" fill="#cdd6df">docs = pages / (ppd or ppbundle) · trips = ceil(boxes/40)</text>
  <text x="500" y="184" text-anchor="middle" font-size="10" fill="#9fb0c0">highVol = pages &#8805; 100k</text>

  <rect x="320" y="202" width="360" height="86" rx="6" fill="#1f2d3d"/>
  <text x="500" y="225" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Labor hours from throughput</text>
  <text x="500" y="245" text-anchor="middle" font-size="10.5" fill="#cdd6df">prepHrs = pages / prepTp · scanHrs = pages / t_scan</text>
  <text x="500" y="261" text-anchor="middle" font-size="10.5" fill="#cdd6df">idxHrs = docs / idxTp · siHrs = pages / siTp</text>
  <text x="500" y="278" text-anchor="middle" font-size="10.5" fill="#cdd6df">cost = hrs x wage x (1 + fringe%)</text>

  <!-- Three scenarios -->
  <rect x="320" y="304" width="113" height="150" rx="6" fill="#1f2d3d"/>
  <text x="376" y="326" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Scenario A</text>
  <text x="376" y="346" text-anchor="middle" font-size="9.5" fill="#cdd6df">vendor every</text>
  <text x="376" y="359" text-anchor="middle" font-size="9.5" fill="#cdd6df">step (per page)</text>
  <text x="376" y="378" text-anchor="middle" font-size="9.5" fill="#cdd6df">+ min fee, pickup,</text>
  <text x="376" y="391" text-anchor="middle" font-size="9.5" fill="#cdd6df">setup, BU import</text>
  <text x="376" y="416" text-anchor="middle" font-size="9.5" fill="#9fb0c0">= sum(items)</text>
  <text x="376" y="434" text-anchor="middle" font-size="9.5" fill="#9fb0c0">weeks, $/page</text>

  <rect x="443" y="304" width="113" height="150" rx="6" fill="#1f2d3d"/>
  <text x="499" y="326" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Scenario B</text>
  <text x="499" y="346" text-anchor="middle" font-size="9.5" fill="#cdd6df">per service:</text>
  <text x="499" y="359" text-anchor="middle" font-size="9.5" fill="#cdd6df">vendor OR student</text>
  <text x="499" y="378" text-anchor="middle" font-size="9.5" fill="#cdd6df">+ 2x PM, DRIP,</text>
  <text x="499" y="391" text-anchor="middle" font-size="9.5" fill="#cdd6df">15% rework</text>
  <text x="499" y="416" text-anchor="middle" font-size="9.5" fill="#9fb0c0">= sum(items)</text>
  <text x="499" y="434" text-anchor="middle" font-size="9.5" fill="#9fb0c0">weeks, $/page</text>

  <rect x="566" y="304" width="114" height="150" rx="6" fill="#1f2d3d"/>
  <text x="623" y="326" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Scenario C</text>
  <text x="623" y="346" text-anchor="middle" font-size="9.5" fill="#cdd6df">students scan+</text>
  <text x="623" y="359" text-anchor="middle" font-size="9.5" fill="#cdd6df">index, one pass</text>
  <text x="623" y="378" text-anchor="middle" font-size="9.5" fill="#cdd6df">+ hardware, queue</text>
  <text x="623" y="391" text-anchor="middle" font-size="9.5" fill="#cdd6df">setup, 1 PM</text>
  <text x="623" y="416" text-anchor="middle" font-size="9.5" fill="#9fb0c0">= sum(items)</text>
  <text x="623" y="434" text-anchor="middle" font-size="9.5" fill="#9fb0c0">weeks, $/page</text>

  <rect x="320" y="470" width="360" height="56" rx="6" fill="#fff8e6" stroke="#b8860b"/>
  <text x="500" y="492" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f2d3d">OnBase license = $0 (BU IS&amp;T) on every scenario</text>
  <text x="500" y="510" text-anchor="middle" font-size="9.5" fill="#b35900">explicit $0 lines show departments what they are NOT paying for</text>

  <!-- Band 3: OUTPUT -->
  <text x="730" y="232" font-size="13" font-weight="700" fill="#9aa5b1">3 · OUTPUT</text>

  <rect x="730" y="244" width="240" height="74" rx="6" fill="#eef8ef" stroke="#1a7f37"/>
  <text x="850" y="268" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d">Comparison + cheapest</text>
  <text x="850" y="287" text-anchor="middle" font-size="10" fill="#555">cards, bars, savings %</text>
  <text x="850" y="303" text-anchor="middle" font-size="10" fill="#555">reduce() picks lowest total</text>

  <rect x="730" y="330" width="240" height="70" rx="6" fill="#eef8ef" stroke="#1a7f37"/>
  <text x="850" y="354" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d">Budget check</text>
  <text x="850" y="373" text-anchor="middle" font-size="10" fill="#555">which scenarios fit;</text>
  <text x="850" y="387" text-anchor="middle" font-size="10" fill="#555">best value within budget</text>

  <rect x="730" y="412" width="240" height="70" rx="6" fill="#eef8ef" stroke="#1a7f37"/>
  <text x="850" y="436" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d">Staffing sensitivity</text>
  <text x="850" y="455" text-anchor="middle" font-size="10" fill="#555">1-5 students: total holds,</text>
  <text x="850" y="469" text-anchor="middle" font-size="10" fill="#555">per-student + weeks drop</text>

  <rect x="730" y="494" width="240" height="70" rx="6" fill="#eef8ef" stroke="#1a7f37"/>
  <text x="850" y="518" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d">Signed PDF report</text>
  <text x="850" y="537" text-anchor="middle" font-size="10" fill="#555">letterhead, line items,</text>
  <text x="850" y="551" text-anchor="middle" font-size="10" fill="#555">disclaimer, signature</text>

  <!-- Arrows inputs -> compute -->
  <line x1="240" y1="145" x2="318" y2="140" stroke="#5b6770" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="240" y1="222" x2="318" y2="160" stroke="#5b6770" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="240" y1="296" x2="318" y2="240" stroke="#5b6770" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="240" y1="376" x2="318" y2="380" stroke="#5b6770" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="240" y1="500" x2="318" y2="260" stroke="#b8860b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/>

  <!-- compute internal flow -->
  <line x1="500" y1="190" x2="500" y2="200" stroke="#5b6770" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="500" y1="288" x2="500" y2="302" stroke="#5b6770" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- scenarios -> output -->
  <line x1="680" y1="360" x2="728" y2="285" stroke="#5b6770" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="680" y1="380" x2="728" y2="362" stroke="#5b6770" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="680" y1="400" x2="728" y2="444" stroke="#5b6770" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="680" y1="420" x2="728" y2="524" stroke="#5b6770" stroke-width="1.6" marker-end="url(#arr)"/>
</svg>
