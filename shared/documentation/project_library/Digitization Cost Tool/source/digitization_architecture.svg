<svg viewBox="0 0 1000 660" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5b6770"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>

  <!-- Title -->
  <text x="500" y="38" text-anchor="middle" font-size="23" font-weight="700" fill="#1f2d3d">Digitization Cost Comparison Tool — Architecture</text>
  <text x="500" y="60" text-anchor="middle" font-size="13" fill="#666">Quiddity Innovations · Complete · 2026</text>

  <!-- Legend box -->
  <g>
    <rect x="772" y="78" width="210" height="138" rx="8" fill="#ffffff" stroke="#ccc" stroke-width="1"/>
    <text x="784" y="98" font-size="12" font-weight="700" fill="#1f2d3d">Legend</text>
    <rect x="784" y="108" width="14" height="14" rx="3" fill="#eafaf0" stroke="#2e7d32"/>
    <text x="806" y="119" font-size="11" fill="#333">Live</text>
    <rect x="784" y="128" width="14" height="14" rx="3" fill="#fff8e6" stroke="#b8860b"/>
    <text x="806" y="139" font-size="11" fill="#333">Partial / assumption</text>
    <rect x="784" y="148" width="14" height="14" rx="3" fill="#f1f3f5" stroke="#9aa5b1"/>
    <text x="806" y="159" font-size="11" fill="#333">Planned</text>
    <rect x="784" y="168" width="14" height="14" rx="3" fill="#ffffff" stroke="#b35900" stroke-dasharray="3 2"/>
    <text x="806" y="179" font-size="11" fill="#333">Not security (caution)</text>
    <rect x="784" y="188" width="14" height="14" rx="3" fill="#1f2d3d"/>
    <text x="806" y="199" font-size="11" fill="#333">Core logic</text>
  </g>

  <!-- Band: Browser (single file) -->
  <rect x="20" y="80" width="730" height="540" rx="10" fill="#f7f9fb" stroke="#dde3e8" stroke-width="1"/>
  <text x="36" y="102" font-size="13" font-weight="700" fill="#5b6770">BROWSER — single self-contained index.html (no server, no database)</text>

  <!-- UI layer band -->
  <rect x="40" y="118" width="690" height="118" rx="8" fill="#ffffff" stroke="#e3e8ec"/>
  <text x="54" y="137" font-size="12" font-weight="700" fill="#9aa5b1">UI LAYER (tabs)</text>

  <rect x="54" y="146" width="150" height="74" rx="6" fill="#eafaf0" stroke="#2e7d32"/>
  <text x="129" y="172" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Project Inputs</text>
  <text x="129" y="190" text-anchor="middle" font-size="10.5" fill="#555">records profile,</text>
  <text x="129" y="204" text-anchor="middle" font-size="10.5" fill="#555">scenarios A/B/C</text>

  <rect x="218" y="146" width="150" height="74" rx="6" fill="#eafaf0" stroke="#2e7d32"/>
  <text x="293" y="172" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Results</text>
  <text x="293" y="190" text-anchor="middle" font-size="10.5" fill="#555">cards, bars,</text>
  <text x="293" y="204" text-anchor="middle" font-size="10.5" fill="#555">savings, budget</text>

  <rect x="382" y="146" width="150" height="74" rx="6" fill="#eafaf0" stroke="#2e7d32"/>
  <text x="457" y="172" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Report</text>
  <text x="457" y="190" text-anchor="middle" font-size="10.5" fill="#555">signed, paginated</text>
  <text x="457" y="204" text-anchor="middle" font-size="10.5" fill="#555">print / PDF</text>

  <rect x="546" y="146" width="170" height="74" rx="6" fill="#fff8e6" stroke="#b8860b"/>
  <text x="631" y="168" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Configuration</text>
  <text x="631" y="185" text-anchor="middle" font-size="10.5" fill="#555">rates + preparers</text>
  <text x="631" y="200" text-anchor="middle" font-size="10" fill="#b35900">password gate (not security)</text>

  <!-- Logic core band -->
  <rect x="40" y="248" width="690" height="150" rx="8" fill="#ffffff" stroke="#e3e8ec"/>
  <text x="54" y="267" font-size="12" font-weight="700" fill="#9aa5b1">LOGIC CORE (vanilla JS)</text>

  <rect x="54" y="278" width="150" height="100" rx="6" fill="#1f2d3d"/>
  <text x="129" y="312" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">gather()</text>
  <text x="129" y="332" text-anchor="middle" font-size="10.5" fill="#cdd6df">read inputs</text>
  <text x="129" y="348" text-anchor="middle" font-size="10.5" fill="#cdd6df">into typed object</text>

  <rect x="232" y="278" width="190" height="100" rx="6" fill="#1f2d3d"/>
  <text x="327" y="306" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">calc()</text>
  <text x="327" y="326" text-anchor="middle" font-size="10.5" fill="#cdd6df">build Scenarios A / B / C</text>
  <text x="327" y="342" text-anchor="middle" font-size="10.5" fill="#cdd6df">line items, totals,</text>
  <text x="327" y="358" text-anchor="middle" font-size="10.5" fill="#cdd6df">$/page, weeks</text>

  <rect x="450" y="278" width="120" height="100" rx="6" fill="#1f2d3d"/>
  <text x="510" y="312" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">calcAndShow()</text>
  <text x="510" y="332" text-anchor="middle" font-size="10.5" fill="#cdd6df">render +</text>
  <text x="510" y="348" text-anchor="middle" font-size="10.5" fill="#cdd6df">savings/budget</text>

  <rect x="598" y="278" width="118" height="100" rx="6" fill="#1f2d3d"/>
  <text x="657" y="312" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">buildReport()</text>
  <text x="657" y="332" text-anchor="middle" font-size="10.5" fill="#cdd6df">+ paginate</text>
  <text x="657" y="348" text-anchor="middle" font-size="10.5" fill="#cdd6df">/ printReport()</text>

  <!-- Data band -->
  <rect x="40" y="410" width="690" height="194" rx="8" fill="#ffffff" stroke="#e3e8ec"/>
  <text x="54" y="429" font-size="12" font-weight="700" fill="#9aa5b1">DATA (in-page + browser storage)</text>

  <rect x="54" y="440" width="200" height="86" rx="6" fill="#eafaf0" stroke="#2e7d32"/>
  <text x="154" y="466" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">RATE_DEFS</text>
  <text x="154" y="485" text-anchor="middle" font-size="10.5" fill="#555">~50 unit rates, wages,</text>
  <text x="154" y="500" text-anchor="middle" font-size="10.5" fill="#555">throughput, planning</text>
  <text x="154" y="515" text-anchor="middle" font-size="10.5" fill="#555">factors (+ sources)</text>

  <rect x="268" y="440" width="200" height="86" rx="6" fill="#eafaf0" stroke="#2e7d32"/>
  <text x="368" y="466" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">localStorage</text>
  <text x="368" y="485" text-anchor="middle" font-size="10.5" fill="#555">rates, inputs,</text>
  <text x="368" y="500" text-anchor="middle" font-size="10.5" fill="#555">preparers, pass hash</text>
  <text x="368" y="515" text-anchor="middle" font-size="10" fill="#555">(in-memory fallback)</text>

  <rect x="482" y="440" width="234" height="86" rx="6" fill="#eafaf0" stroke="#2e7d32"/>
  <text x="599" y="466" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Export / Import</text>
  <text x="599" y="485" text-anchor="middle" font-size="10.5" fill="#555">config JSON (rates+preparers)</text>
  <text x="599" y="500" text-anchor="middle" font-size="10.5" fill="#555">rates CSV (Excel-editable)</text>
  <text x="599" y="515" text-anchor="middle" font-size="10.5" fill="#555">portable between machines</text>

  <rect x="54" y="540" width="662" height="50" rx="6" fill="#fff8e6" stroke="#b8860b"/>
  <text x="385" y="562" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f2d3d">BU_INTERNAL_ONLY flag — presentation/policy banner only, NOT authentication</text>
  <text x="385" y="579" text-anchor="middle" font-size="10.5" fill="#b35900">Real BU-only access comes from where the file is hosted (login-gated page / permissioned SharePoint)</text>

  <!-- Output / hosting band (right) -->
  <rect x="772" y="232" width="210" height="372" rx="10" fill="#f7f9fb" stroke="#dde3e8"/>
  <text x="788" y="254" font-size="12" font-weight="700" fill="#5b6770">OUTPUT &amp; HOSTING</text>

  <rect x="788" y="266" width="178" height="70" rx="6" fill="#eafaf0" stroke="#2e7d32"/>
  <text x="877" y="292" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d">Signed PDF report</text>
  <text x="877" y="312" text-anchor="middle" font-size="10.5" fill="#555">browser print-to-PDF</text>
  <text x="877" y="326" text-anchor="middle" font-size="10.5" fill="#555">auto-named file</text>

  <rect x="788" y="346" width="178" height="58" rx="6" fill="#eafaf0" stroke="#2e7d32"/>
  <text x="877" y="370" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f2d3d">Run anywhere</text>
  <text x="877" y="389" text-anchor="middle" font-size="10" fill="#555">file:// · web server · USB</text>

  <rect x="788" y="414" width="178" height="58" rx="6" fill="#fff8e6" stroke="#b8860b"/>
  <text x="877" y="438" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f2d3d">SharePoint embed</text>
  <text x="877" y="457" text-anchor="middle" font-size="9.5" fill="#b35900">needs hosted URL (blocks page JS)</text>

  <rect x="788" y="482" width="178" height="50" rx="6" fill="#f1f3f5" stroke="#9aa5b1"/>
  <text x="877" y="504" text-anchor="middle" font-size="11" font-weight="700" fill="#1f2d3d">Migrate to C:\ root</text>
  <text x="877" y="521" text-anchor="middle" font-size="9.5" fill="#667">QI standard layout (planned)</text>

  <rect x="788" y="542" width="178" height="50" rx="6" fill="#ffffff" stroke="#9aa5b1"/>
  <text x="877" y="564" text-anchor="middle" font-size="11" font-weight="700" fill="#1f2d3d">build_package.py</text>
  <text x="877" y="581" text-anchor="middle" font-size="9.5" fill="#667">.docx + zip (Python tooling)</text>

  <!-- Arrows -->
  <line x1="129" y1="220" x2="129" y2="276" stroke="#5b6770" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="204" y1="328" x2="230" y2="328" stroke="#5b6770" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="422" y1="328" x2="448" y2="328" stroke="#5b6770" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="570" y1="328" x2="596" y2="328" stroke="#5b6770" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="510" y1="278" x2="345" y2="222" stroke="#5b6770" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="657" y1="278" x2="465" y2="222" stroke="#5b6770" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="154" y1="440" x2="200" y2="380" stroke="#5b6770" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="631" y1="220" x2="368" y2="438" stroke="#5b6770" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="716" y1="328" x2="786" y2="298" stroke="#5b6770" stroke-width="1.6" marker-end="url(#arrow)"/>
</svg>
