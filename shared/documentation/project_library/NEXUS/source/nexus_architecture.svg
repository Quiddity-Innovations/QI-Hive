  <rect x="20" y="552" width="948" height="190" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <rect x="36" y="572" width="218" height="152" rx="8" fill="#eafaf0" stroke="#2e7d32" stroke-width="1.4"/>
