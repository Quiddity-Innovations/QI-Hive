  <text x="834" y="475" text-anchor="middle" font-size="9" fill="#2e7d32">synthesis · provider_count · success_count</text>
  <text x="834" y="489" text-anchor="middle" font-size="9" fill="#2e7d32">elapsed_ms · raw_responses? · judge_results?</text>
  <text x="834" y="505" text-anchor="middle" font-size="8.5" fill="#5f8a66">streamed via SSE or returned whole → caller</text>
