  <text x="521" y="491" text-anchor="middle" font-size="9.5" fill="#7a5b06">Clarity · Accuracy · Depth → best response</text>
  <text x="521" y="507" text-anchor="middle" font-size="9" fill="#9a7a2e">judge provider configurable (default Groq)</text>

