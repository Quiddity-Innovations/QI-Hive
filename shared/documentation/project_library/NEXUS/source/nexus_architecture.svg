  <text x="145" y="613" text-anchor="middle" font-size="9" fill="#2e7d32">scout/runner.py · per topic</text>
  <text x="145" y="629" text-anchor="middle" font-size="9" fill="#2e7d32">fetch RSS / Reddit / HN / YouTube</text>
  <text x="145" y="645" text-anchor="middle" font-size="9" fill="#2e7d32">→ rapidfuzz dedup → AI digest</text>
  <rect x="50" y="656" width="190" height="18" rx="5" fill="#e3f5e9" stroke="#2e7d32"/>
  <text x="145" y="669" text-anchor="middle" font-size="8.5" font-weight="600" fill="#1b4d22">LIVE · default every 6h</text>
  <text x="145" y="691" text-anchor="middle" font-size="8.5" fill="#5f8a66">13,244 items · 99 digests · .docx out</text>
  <text x="145" y="706" text-anchor="middle" font-size="8.5" fill="#5f8a66">per-topic interval override</text>

  <rect x="266" y="572" width="218" height="152" rx="8" fill="#eafaf0" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="375" y="594" text-anchor="middle" font-size="12" font-weight="700" fill="#1b4d22">Bench</text>
  <text x="375" y="613" text-anchor="middle" font-size="9" fill="#2e7d32">bench/runner.py</text>
  <text x="375" y="629" text-anchor="middle" font-size="9" fill="#2e7d32">suite × providers → score</text>
  <text x="375" y="645" text-anchor="middle" font-size="9" fill="#2e7d32">track over time → regression</text>
  <rect x="280" y="656" width="190" height="18" rx="5" fill="#e3f5e9" stroke="#2e7d32"/>
  <text x="375" y="669" text-anchor="middle" font-size="8.5" font-weight="600" fill="#1b4d22">LIVE · reuses dispatch + scorer</text>
  <text x="375" y="691" text-anchor="middle" font-size="8.5" fill="#5f8a66">/bench/recommend · starter suite seeded</text>
  <text x="375" y="706" text-anchor="middle" font-size="8.5" fill="#5f8a66">1 suite · 5 cases · 4 runs</text>

  <rect x="496" y="572" width="218" height="152" rx="8" fill="#fff8e6" stroke="#b8860b" stroke-width="1.4"/>
  <text x="605" y="594" text-anchor="middle" font-size="12" font-weight="700" fill="#7a5b06">RAG Knowledge</text>
  <text x="605" y="613" text-anchor="middle" font-size="9" fill="#b8860b">shared/rag.py · ChromaDB</text>
  <text x="605" y="629" text-anchor="middle" font-size="9" fill="#b8860b">collection: nexus_knowledge</text>
  <text x="605" y="645" text-anchor="middle" font-size="9" fill="#b8860b">ingest curated JSONL + exports</text>
  <rect x="510" y="656" width="190" height="18" rx="5" fill="#fdf3d4" stroke="#b8860b"/>
  <text x="605" y="669" text-anchor="middle" font-size="8.5" font-weight="600" fill="#7a5b06">PARTIAL · augments synthesis</text>
  <text x="605" y="691" text-anchor="middle" font-size="8.5" fill="#9a7a2e">cosine search → relevance % context</text>
  <text x="605" y="706" text-anchor="middle" font-size="8.5" fill="#9a7a2e">background init (300s deadline)</text>

  <rect x="726" y="572" width="226" height="152" rx="8" fill="#1f2d3d" stroke="#0f1825" stroke-width="1.4"/>
  <text x="839" y="594" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">SQLite — nexus.db</text>
  <text x="839" y="613" text-anchor="middle" font-size="9" fill="#cbd5e1">shared/db.py · WAL · FK on · schema v4</text>
  <text x="839" y="629" text-anchor="middle" font-size="9" fill="#aebccd">sessions · responses · providers</text>
  <text x="839" y="645" text-anchor="middle" font-size="9" fill="#aebccd">scout_items / clusters / digests</text>
  <text x="839" y="661" text-anchor="middle" font-size="9" fill="#aebccd">bench_* · batch_* · scheduled_jobs</text>
  <text x="839" y="681" text-anchor="middle" font-size="8.5" fill="#8a99ab">17 app tables · 5,093 sessions</text>
  <text x="839" y="696" text-anchor="middle" font-size="8.5" fill="#8a99ab">seeded from config/providers.json</text>
  <text x="839" y="711" text-anchor="middle" font-size="8.5" fill="#8a99ab">+ Gradio personas (config/personas.json)</text>

  <!-- arrows from core down to background -->
  <line x1="180" y1="522" x2="180" y2="566" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arr)"/>
