  <text x="263" y="168" text-anchor="middle" font-size="8" fill="#5f8a66">939 listings</text>

  <rect x="348" y="112" width="156" height="60" rx="7" fill="#fff8e6" stroke="#b8860b" stroke-width="1.5"/>
