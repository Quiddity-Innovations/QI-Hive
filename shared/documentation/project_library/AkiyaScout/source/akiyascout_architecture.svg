  <text x="460" y="63" text-anchor="middle" font-size="10" fill="#9aa5b1">English-first JP real-estate Scout · ingest → normalize → translate → dedup → match → notify</text>

  <!-- ══ LEGEND (top right) ══ -->
  <rect x="700" y="74" width="206" height="150" rx="7" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
