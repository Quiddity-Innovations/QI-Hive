  <path d="M 70,396 V 432" fill="none" stroke="#f97316" stroke-width="1.2" marker-end="url(#arr-orange)"/>
  <path d="M 230,396 V 432" fill="none" stroke="#f97316" stroke-width="1.2" marker-end="url(#arr-orange)"/>
  <path d="M 390,396 V 432" fill="none" stroke="#f97316" stroke-width="1.2" marker-end="url(#arr-orange)"/>
  <path d="M 530,396 V 432" fill="none" stroke="#22c55e" stroke-width="1.2" marker-end="url(#arr-green)"/>
  <path d="M 700,396 V 432" fill="none" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arr-sky)"/>

  <rect x="14" y="432" width="130" height="58" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
