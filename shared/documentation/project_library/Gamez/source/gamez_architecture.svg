  <text x="79" y="466" text-anchor="middle" font-size="8" fill="#16a34a">Fixtures · scores</text>
  <text x="79" y="478" text-anchor="middle" font-size="8" fill="#16a34a">standings (no key)</text>

  <rect x="154" y="432" width="130" height="58" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="219" y="451" text-anchor="middle" font-size="10" font-weight="700" fill="#14532d">EA FC 26 CSV</text>
  <text x="219" y="466" text-anchor="middle" font-size="8" fill="#16a34a">Player ratings</text>
  <text x="219" y="478" text-anchor="middle" font-size="8" fill="#16a34a">free · no key</text>

  <rect x="294" y="432" width="130" height="58" rx="7" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="359" y="451" text-anchor="middle" font-size="10" font-weight="700" fill="#713f12">API-Football</text>
  <text x="359" y="466" text-anchor="middle" font-size="8" fill="#ca8a04">Deep stats (key)</text>
  <text x="359" y="478" text-anchor="middle" font-size="8" fill="#ca8a04">2026 empty yet</text>

  <rect x="464" y="432" width="130" height="58" rx="7" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="529" y="451" text-anchor="middle" font-size="10" font-weight="700" fill="#713f12">Kalshi</text>
  <text x="529" y="466" text-anchor="middle" font-size="8" fill="#ca8a04">Market odds</text>
  <text x="529" y="478" text-anchor="middle" font-size="8" fill="#ca8a04">no WC markets yet</text>

  <rect x="634" y="432" width="130" height="58" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="699" y="451" text-anchor="middle" font-size="10" font-weight="700" fill="#14532d">OpenRouter</text>
  <text x="699" y="466" text-anchor="middle" font-size="8" fill="#16a34a">Cloud AI (:free)</text>
  <text x="699" y="478" text-anchor="middle" font-size="8" fill="#16a34a">+ free fallback</text>

  <rect x="774" y="432" width="112" height="58" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="830" y="451" text-anchor="middle" font-size="10" font-weight="700" fill="#14532d">Ollama</text>
  <text x="830" y="466" text-anchor="middle" font-size="8" fill="#16a34a">Local AI</text>
  <text x="830" y="478" text-anchor="middle" font-size="8" fill="#16a34a">free · private</text>

  <!-- ══ ECOSYSTEM LAYER ══ -->
  <text x="18" y="514" font-size="10" fill="#94a3b8" font-weight="600" letter-spacing="1">QI ECOSYSTEM</text>
  <path d="M 700,396 V 505 H 230 V 530" fill="none" stroke="#a855f7" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#arr)"/>

  <rect x="14" y="530" width="300" height="56" rx="7" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="164" y="549" text-anchor="middle" font-size="10" font-weight="700" fill="#581c87">Maia — maia.db (shared key, read-only)</text>
  <text x="164" y="564" text-anchor="middle" font-size="8" fill="#7e22ce">system.openrouter_api_key reused (like MapSnap)</text>
  <text x="164" y="576" text-anchor="middle" font-size="8" fill="#7e22ce">registry integrates_with: maia · family_tier cousin</text>

  <rect x="324" y="530" width="300" height="56" rx="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="474" y="549" text-anchor="middle" font-size="10" font-weight="700" fill="#0c4a6e">qi_registry.json (id gamez)</text>
  <text x="474" y="564" text-anchor="middle" font-size="8" fill="#0284c7">port block 8710-8719 · status active</text>
  <text x="474" y="576" text-anchor="middle" font-size="8" fill="#0284c7">exposes / /health /snapshot /kalshi /ai/openrouter</text>

  <rect x="634" y="530" width="252" height="56" rx="7" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="760" y="549" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">Packaging</text>
  <text x="760" y="564" text-anchor="middle" font-size="8" fill="#64748b">PyInstaller + pywebview · win/mac/linux CI</text>
  <text x="760" y="576" text-anchor="middle" font-size="8" fill="#64748b">portable .exe — proxy bundled, config sanitized</text>
</svg>
