<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
    <marker id="arr-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/>
    </marker>
    <marker id="arr-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22c55e"/>
    </marker>
    <marker id="arr-purple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a855f7"/>
    </marker>
    <marker id="arr-orange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f97316"/>
    </marker>
  </defs>

  <rect width="920" height="640" fill="#f8fafc" rx="12"/>
  <text x="460" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b">QI Brain — System Architecture</text>
  <text x="460" y="46" text-anchor="middle" font-size="11" fill="#64748b">Quiddity Innovations · Ecosystem Knowledge Substrate · 2026</text>

  <!-- ══ LEGEND (top right) ══ -->
  <rect x="700" y="58" width="208" height="150" rx="7" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="804" y="76" text-anchor="middle" font-size="10" font-weight="700" fill="#1e293b">Legend</text>
  <rect x="708" y="83" width="14" height="10" rx="2" fill="#dcfce7" stroke="#16a34a"/>
  <text x="728" y="93" font-size="9" fill="#374151">Live / Active</text>
  <rect x="708" y="100" width="14" height="10" rx="2" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="728" y="110" font-size="9" fill="#374151">Built · Partial</text>
  <rect x="708" y="117" width="14" height="10" rx="2" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="728" y="127" font-size="9" fill="#374151">Planned</text>
  <line x1="708" y1="142" x2="726" y2="142" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="732" y="146" font-size="9" fill="#374151">Caller → interface</text>
  <line x1="708" y1="159" x2="726" y2="159" stroke="#22c55e" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="732" y="163" font-size="9" fill="#374151">Write-through to store</text>
  <line x1="708" y1="176" x2="726" y2="176" stroke="#f97316" stroke-width="2" marker-end="url(#arr-orange)"/>
  <text x="732" y="180" font-size="9" fill="#374151">Embedding call</text>
  <rect x="708" y="186" width="14" height="10" rx="2" fill="#1e293b" stroke="#1e293b"/>
  <text x="728" y="195" font-size="9" fill="#374151">Brain core (FastAPI)</text>

  <!-- ══ CALLERS ══ -->
  <rect x="8" y="62" width="660" height="76" rx="9" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6,3"/>
  <rect x="20" y="56" width="64" height="14" rx="3" fill="#f8fafc"/>
  <text x="52" y="67" text-anchor="middle" font-size="10" fill="#3b82f6" font-weight="700" letter-spacing="1">CALLERS</text>

  <rect x="16" y="74" width="150" height="56" rx="7" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="91" y="92" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e40af">Claude Code</text>
  <text x="91" y="107" text-anchor="middle" font-size="8" fill="#3b82f6">every QI project session</text>
  <text x="91" y="120" text-anchor="middle" font-size="8" fill="#93c5fd">via 12 MCP tools (stdio)</text>

  <rect x="176" y="74" width="150" height="56" rx="7" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="251" y="92" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e40af">7 Hive Agents</text>
  <text x="251" y="107" text-anchor="middle" font-size="8" fill="#3b82f6">architect · builder · inspector</text>
  <text x="251" y="120" text-anchor="middle" font-size="8" fill="#93c5fd">scout · scribe · ops · librarian</text>

  <rect x="336" y="74" width="150" height="56" rx="7" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="411" y="92" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e40af">Sibling Services</text>
  <text x="411" y="107" text-anchor="middle" font-size="8" fill="#3b82f6">Maia · Naya · NEXUS</text>
  <text x="411" y="120" text-anchor="middle" font-size="8" fill="#93c5fd">REST (registered agents)</text>

  <rect x="496" y="74" width="160" height="56" rx="7" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="576" y="92" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e40af">QI Hive Dashboard</text>
  <text x="576" y="107" text-anchor="middle" font-size="8" fill="#3b82f6">Mission Control · War Room</text>
  <text x="576" y="120" text-anchor="middle" font-size="8" fill="#93c5fd">read-only consumer (:8600)</text>

  <!-- ══ INTERFACES ══ -->
  <line x1="160" y1="138" x2="160" y2="166" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="470" y1="138" x2="470" y2="166" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <rect x="60" y="166" width="200" height="50" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="160" y="186" text-anchor="middle" font-size="11" font-weight="700" fill="#4c1d95">MCP Server (stdio)</text>
  <text x="160" y="201" text-anchor="middle" font-size="8" fill="#7c3aed">mcp.py · 12 tools · JSON-RPC 2.0</text>
  <text x="160" y="212" text-anchor="middle" font-size="8" fill="#a78bfa">thin forwarders → :9011</text>

  <rect x="370" y="166" width="200" height="50" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="470" y="186" text-anchor="middle" font-size="11" font-weight="700" fill="#0c4a6e">REST API (HTTP)</text>
  <text x="470" y="201" text-anchor="middle" font-size="8" fill="#0284c7">same 12 ops + ops/agents/dispatch</text>
  <text x="470" y="212" text-anchor="middle" font-size="8" fill="#38bdf8">/health · /version · /info · /docs</text>

  <line x1="160" y1="216" x2="200" y2="244" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="470" y1="216" x2="420" y2="244" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ══ BRAIN CORE ══ -->
  <rect x="14" y="246" width="642" height="74" rx="9" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="335" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="white">QI Brain Core — FastAPI</text>
  <text x="335" y="285" text-anchor="middle" font-size="9.5" fill="#94a3b8">api.py · Uvicorn · Port 9011 · QI_BrainAPI NSSM service · Python 3.11 · CORS *</text>
  <text x="335" y="301" text-anchor="middle" font-size="8.5" fill="#64748b">get_context (ranked, token-budgeted) · log_decision/feature/session · update_state · search_memory · supersede · explain · override</text>
  <text x="335" y="314" text-anchor="middle" font-size="8.5" fill="#64748b">project_id normalize + fuzzy-resolve · write-through (SQL authoritative, Chroma best-effort)</text>

  <!-- core -> right: providers -->
  <line x1="656" y1="283" x2="690" y2="283" stroke="#f97316" stroke-width="1.5" marker-end="url(#arr-orange)"/>

  <!-- ══ PROVIDERS (right) ══ -->
  <rect x="690" y="246" width="222" height="74" rx="9" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="801" y="266" text-anchor="middle" font-size="11" font-weight="700" fill="#9a3412">LLM Providers (config-driven)</text>
  <text x="700" y="282" font-size="8.5" fill="#c2410c">embed: nomic-embed-text (768-dim)</text>
  <text x="700" y="295" font-size="8.5" fill="#c2410c">eval: qwen3:8b · feature relevance</text>
  <text x="700" y="308" font-size="8.5" fill="#854d0e">via Ollama (local, free) · llm_providers table</text>

  <!-- ══ DUAL STORE ══ -->
  <text x="18" y="344" font-size="10" fill="#94a3b8" font-weight="600" letter-spacing="1">DUAL STORE</text>

  <line x1="180" y1="320" x2="180" y2="356" stroke="#22c55e" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <line x1="490" y1="320" x2="490" y2="356" stroke="#f97316" stroke-width="1.8" marker-end="url(#arr-orange)"/>

  <!-- SQLite -->
  <rect x="14" y="356" width="320" height="96" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="174" y="376" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14532d">SQLite — qi_brain.db (source of truth)</text>
  <text x="174" y="392" text-anchor="middle" font-size="8.5" fill="#16a34a">core/db.py open_brain_db() · WAL · FK ON · busy_timeout</text>
  <text x="174" y="406" text-anchor="middle" font-size="8.5" fill="#16a34a">25 tables · 491 decisions · 394 features · 565 sessions</text>
  <text x="174" y="420" text-anchor="middle" font-size="8.5" fill="#16a34a">239 state · 921 docs · 2,203 edges · 2,873 dispatches</text>
  <text x="174" y="434" text-anchor="middle" font-size="8" fill="#15803d">C:\QIH\data\qi_brain.db</text>
  <text x="174" y="446" text-anchor="middle" font-size="8" fill="#15803d">46,654 compliance · 18,718 poll · 1,643 heartbeats</text>

  <!-- ChromaDB -->
  <rect x="344" y="356" width="312" height="96" rx="9" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="500" y="376" text-anchor="middle" font-size="11.5" font-weight="700" fill="#581c87">ChromaDB — qi_memory/ (vector recall)</text>
  <text x="500" y="392" text-anchor="middle" font-size="8.5" fill="#7e22ce">core/memory_store.py · cosine HNSW · rebuildable index</text>
  <text x="500" y="408" text-anchor="middle" font-size="8.5" fill="#7e22ce">qi_decisions · qi_features · qi_sessions · qi_docs</text>
  <text x="500" y="424" text-anchor="middle" font-size="8.5" fill="#7e22ce">embeds every logged record (best-effort, non-blocking)</text>
  <text x="500" y="440" text-anchor="middle" font-size="8" fill="#9333ea">C:\QIH\engine\brain\qi_memory\</text>

  <!-- embed arrow from chroma to providers (vertical up reference) -->
  <path d="M 656 404 C 690 404 700 360 760 324" fill="none" stroke="#f97316" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-orange)"/>

  <!-- ══ AUTONOMY LAYER ══ -->
  <text x="18" y="478" font-size="10" fill="#94a3b8" font-weight="600" letter-spacing="1">AUTONOMY — keeps the Brain current without a push</text>

  <line x1="120" y1="452" x2="120" y2="496" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <rect x="14" y="496" width="210" height="118" rx="9" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="119" y="516" text-anchor="middle" font-size="11" font-weight="700" fill="#713f12">Background Poller</text>
  <text x="26" y="533" font-size="8.5" fill="#854d0e">poller.py · daemon thread</text>
  <text x="26" y="547" font-size="8.5" fill="#854d0e">reads each project state.json</text>
  <text x="26" y="561" font-size="8.5" fill="#854d0e">+ git log --since</text>
  <text x="26" y="575" font-size="8.5" fill="#854d0e">+ inbox/*.json (file drop)</text>
  <text x="26" y="592" font-size="8" fill="#a16207">every 300s · 18,718 cycles</text>
  <text x="26" y="606" font-size="8" fill="#a16207">config in brain_config</text>

  <rect x="234" y="496" width="210" height="118" rx="9" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="339" y="516" text-anchor="middle" font-size="11" font-weight="700" fill="#713f12">Feature Propagation</text>
  <text x="246" y="533" font-size="8.5" fill="#854d0e">feature_engine.py</text>
  <text x="246" y="547" font-size="8.5" fill="#854d0e">on new feature → eval each</text>
  <text x="246" y="561" font-size="8.5" fill="#854d0e">other project (qwen3:8b)</text>
  <text x="246" y="575" font-size="8.5" fill="#854d0e">strict JSON: adopt/adapt/</text>
  <text x="246" y="589" font-size="8.5" fill="#854d0e">skip/discuss + history</text>
  <text x="246" y="605" font-size="8" fill="#a16207">→ feature_evaluations (owner review)</text>

  <rect x="454" y="496" width="202" height="118" rx="9" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="555" y="516" text-anchor="middle" font-size="11" font-weight="700" fill="#713f12">Documentation Brain</text>
  <text x="466" y="533" font-size="8.5" fill="#854d0e">doc_harvester.py</text>
  <text x="466" y="547" font-size="8.5" fill="#854d0e">discover + classify .md/.docx</text>
  <text x="466" y="561" font-size="8.5" fill="#854d0e">→ docs (921) catalog</text>
  <text x="466" y="575" font-size="8.5" fill="#854d0e">derive typed edges (2,203)</text>
  <text x="466" y="589" font-size="8.5" fill="#854d0e">→ doc_relationships graph</text>
  <text x="466" y="605" font-size="8" fill="#a16207">powers hive-librarian + qi_docs</text>

  <!-- distiller (planned-ish, partial) right -->
  <rect x="690" y="356" width="222" height="96" rx="9" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="801" y="376" text-anchor="middle" font-size="11" font-weight="700" fill="#713f12">Distiller</text>
  <text x="700" y="394" font-size="8.5" fill="#854d0e">distiller.py · POST /api/distill</text>
  <text x="700" y="408" font-size="8.5" fill="#854d0e">LLM summarizes raw inbox</text>
  <text x="700" y="422" font-size="8.5" fill="#854d0e">notes → structured records</text>
  <text x="700" y="438" font-size="8" fill="#a16207">built · light use (partial)</text>

  <!-- autonomy writes back into core -->
  <path d="M 119 496 C 119 470 150 470 200 320" fill="none" stroke="#22c55e" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-green)"/>

  <text x="460" y="632" text-anchor="middle" font-size="8" fill="#94a3b8">Quiddity Innovations © 2026 · Brain is the backbone — the dashboard consumes it, the Brain does not depend on the dashboard</text>
</svg>
