  <text x="781" y="275" text-anchor="middle" font-size="8" fill="#8a6d00">design-time authored</text>

  <!-- launcher -> browser -->
  <line x1="306" y1="176" x2="306" y2="212" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- ══ CLOUDFLARE TUNNEL (right, secure path) ══ -->
  <rect x="876" y="280" width="208" height="86" rx="9" fill="#eafaf0" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="980" y="302" text-anchor="middle" font-size="11" font-weight="700" fill="#1b5e20">Cloudflare Tunnel</text>
  <text x="980" y="320" text-anchor="middle" font-size="8.5" fill="#2e7d32">HTTPS · no open inbound port</text>
  <text x="980" y="335" text-anchor="middle" font-size="8.5" fill="#2e7d32">PIN-gated (CF-Ray detected)</text>
  <text x="980" y="352" text-anchor="middle" font-size="8" fill="#4a7d4f">/health · /version bypass the PIN</text>

  <!-- browser <-> tunnel dashed (remote access) -->
  <path d="M 864,253 H 980 V 280" fill="none" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-green)"/>
  <!-- tunnel -> core (dashed down to server band) -->
  <path d="M 980,366 V 392 H 700 V 408" fill="none" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-green)"/>

