  <text x="439" y="450" text-anchor="middle" font-size="9.5" fill="#aeb8c4">~7,400 lines · loopback 127.0.0.1:6969 · switch -Regex route dispatch · ~80 /api/* routes · Send-Json</text>
  <text x="439" y="467" text-anchor="middle" font-size="9" fill="#7e8b99">Access gate (PIN for tunnel) · Read-AppSettings (autopdf-settings.json) · single-threaded loop + async index tasks</text>
  <text x="439" y="485" text-anchor="middle" font-size="9" fill="#7e8b99">Convert · Split · Zone/Tagged extract · Index Creator · Write-IndexXml (OnBase DIP) · Scheduler (partial)</text>

