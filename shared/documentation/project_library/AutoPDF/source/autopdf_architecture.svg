  <line x1="150" y1="500" x2="150" y2="540" stroke="#1f2d3d" stroke-width="1.6" marker-end="url(#arr-navy)"/>
  <line x1="439" y1="500" x2="439" y2="540" stroke="#e8772e" stroke-width="1.6" marker-end="url(#arr-orange)"/>
  <line x1="700" y1="500" x2="700" y2="540" stroke="#2e7d32" stroke-width="1.6" marker-end="url(#arr-green)"/>

