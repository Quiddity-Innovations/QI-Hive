<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
    <marker id="arr-navy" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1f2d3d"/>
    </marker>
    <marker id="arr-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32"/>
    </marker>
    <marker id="arr-amber" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#b8860b"/>
    </marker>
    <marker id="arr-orange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e8772e"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="720" fill="#ffffff" rx="12"/>
  <text x="550" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#b3261e">AutoPDF — System Architecture</text>
  <text x="550" y="50" text-anchor="middle" font-size="11.5" fill="#5b6b7c">Quiddity Innovations · Local-first PDF Toolkit · 2026 · 127.0.0.1:6969 · v2026.06.15 · no cloud · no telemetry</text>

  <!-- ══ LEGEND (top right) ══ -->
  <rect x="872" y="60" width="216" height="196" rx="7" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="980" y="79" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1f2d3d">Legend</text>
  <rect x="882" y="87" width="14" height="10" rx="2" fill="#eafaf0" stroke="#2e7d32"/>
  <text x="902" y="96" font-size="9" fill="#374151">Live / Active</text>
  <rect x="882" y="104" width="14" height="10" rx="2" fill="#fff8e6" stroke="#b8860b"/>
  <text x="902" y="113" font-size="9" fill="#374151">Built · Partial / Pending</text>
  <rect x="882" y="121" width="14" height="10" rx="2" fill="#f1f3f5" stroke="#9aa5b1"/>
  <text x="902" y="130" font-size="9" fill="#374151">Planned</text>
  <rect x="882" y="138" width="14" height="10" rx="2" fill="#fff3e8" stroke="#e8772e" stroke-dasharray="3,2"/>
  <text x="902" y="147" font-size="9" fill="#374151">Caution / Disabled</text>
  <rect x="882" y="155" width="14" height="10" rx="2" fill="#1f2d3d" stroke="#0f1620"/>
  <text x="902" y="164" font-size="9" fill="#374151">Core server (PowerShell)</text>
  <line x1="882" y1="180" x2="900" y2="180" stroke="#1f2d3d" stroke-width="2" marker-end="url(#arr-navy)"/>
  <text x="906" y="184" font-size="9" fill="#374151">Request flow (solid)</text>
  <path d="M 882,198 H 900" fill="none" stroke="#2e7d32" stroke-width="1.6" stroke-dasharray="4,2" marker-end="url(#arr-green)"/>
  <text x="906" y="202" font-size="9" fill="#374151">Tunnel / secure path (dashed)</text>
  <rect x="882" y="211" width="14" height="10" rx="2" fill="none" stroke="#3b6ea5" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="902" y="220" font-size="9" fill="#374151">Layer boundary</text>
  <text x="980" y="240" text-anchor="middle" font-size="8" fill="#9aa5b1">All processing stays on the machine.</text>
  <text x="980" y="251" text-anchor="middle" font-size="8" fill="#9aa5b1">Quiddity Innovations © 2026</text>

  <!-- ══ USER / LAUNCH BAND ══ -->
  <text x="22" y="78" font-size="10" fill="#9aa5b1" font-weight="600" letter-spacing="1">USER · LAUNCH</text>
  <rect x="20" y="84" width="180" height="92" rx="8" fill="#eef4fb" stroke="#3b6ea5" stroke-width="1.5"/>
  <text x="110" y="106" text-anchor="middle" font-size="12" font-weight="700" fill="#1d3a5f">Records / Office user</text>
  <text x="110" y="124" text-anchor="middle" font-size="8.5" fill="#33475b">Double-clicks AutoPDF.exe</text>
  <text x="110" y="137" text-anchor="middle" font-size="8.5" fill="#33475b">or opens the browser UI</text>
  <text x="110" y="155" text-anchor="middle" font-size="8" fill="#7a8a9a">No installer · no admin</text>
  <text x="110" y="168" text-anchor="middle" font-size="8" fill="#7a8a9a">copy-folder portable</text>

  <rect x="216" y="84" width="180" height="92" rx="8" fill="#eafaf0" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="306" y="106" text-anchor="middle" font-size="12" font-weight="700" fill="#1b5e20">AutoPDF.exe</text>
  <text x="306" y="124" text-anchor="middle" font-size="8.5" fill="#2e7d32">Native C# launcher (Launcher.cs)</text>
  <text x="306" y="137" text-anchor="middle" font-size="8.5" fill="#2e7d32">Pings /api/status; start-or-open</text>
  <text x="306" y="155" text-anchor="middle" font-size="8" fill="#4a7d4f">Starts server hidden (pwsh/PS 5.1)</text>
  <text x="306" y="168" text-anchor="middle" font-size="8" fill="#4a7d4f">Splash + browser, AUTOPDF_NO_BROWSER</text>

  <!-- arrows user -> launcher -> browser -->
  <line x1="200" y1="130" x2="216" y2="130" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ══ BROWSER UI BAND ══ -->
  <text x="22" y="206" font-size="10" fill="#9aa5b1" font-weight="600" letter-spacing="1">BROWSER UI (single page · vanilla JS)</text>
  <rect x="14" y="212" width="850" height="82" rx="9" fill="none" stroke="#3b6ea5" stroke-width="1.5" stroke-dasharray="6,3"/>
  <rect x="28" y="226" width="160" height="56" rx="7" fill="#eef4fb" stroke="#3b6ea5" stroke-width="1.5"/>
  <text x="108" y="248" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1d3a5f">AutoPDFTool.html</text>
  <text x="108" y="263" text-anchor="middle" font-size="8" fill="#33475b">Converter · Splitter · Index</text>
  <text x="108" y="275" text-anchor="middle" font-size="8" fill="#33475b">Scan · Settings tabs</text>

  <rect x="198" y="226" width="160" height="56" rx="7" fill="#eef4fb" stroke="#3b6ea5" stroke-width="1.5"/>
  <text x="278" y="248" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1d3a5f">app.js</text>
  <text x="278" y="263" text-anchor="middle" font-size="8" fill="#33475b">fetch() the ~80 /api routes</text>
  <text x="278" y="275" text-anchor="middle" font-size="8" fill="#33475b">drag-to-draw zones</text>

  <rect x="368" y="226" width="170" height="56" rx="7" fill="#eafaf0" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="453" y="248" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1b5e20">zone-mapper.html</text>
  <text x="453" y="263" text-anchor="middle" font-size="8" fill="#2e7d32">Visual Zone Mapper</text>
  <text x="453" y="275" text-anchor="middle" font-size="8" fill="#2e7d32">Modal / Tab / Window / Split</text>

  <rect x="548" y="226" width="150" height="56" rx="7" fill="#eef4fb" stroke="#3b6ea5" stroke-width="1.5"/>
  <text x="623" y="248" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1d3a5f">styles.css</text>
  <text x="623" y="263" text-anchor="middle" font-size="8" fill="#33475b">Segoe UI theme</text>
  <text x="623" y="275" text-anchor="middle" font-size="8" fill="#33475b">no build step</text>

  <rect x="708" y="226" width="146" height="56" rx="7" fill="#fff8e6" stroke="#b8860b" stroke-width="1.5"/>
  <text x="781" y="248" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6b5200">recipes · templates</text>
