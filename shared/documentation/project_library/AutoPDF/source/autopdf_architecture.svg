  <text x="114" y="700" text-anchor="middle" font-size="8" fill="#2e7d32">per-document · searchable OCR</text>

  <rect x="222" y="668" width="200" height="44" rx="7" fill="#eafaf0" stroke="#2e7d32" stroke-width="1.5"/>
