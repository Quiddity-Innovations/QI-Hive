  <rect x="134" y="556" width="100" height="36" rx="6" fill="#eafaf0" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="184" y="573" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1b5e20">Poppler</text>
  <text x="184" y="586" text-anchor="middle" font-size="7.5" fill="#2e7d32">poppler\ · pdftotext</text>
  <rect x="242" y="556" width="100" height="36" rx="6" fill="#eafaf0" stroke="#2e7d32" stroke-width="1.3"/>
