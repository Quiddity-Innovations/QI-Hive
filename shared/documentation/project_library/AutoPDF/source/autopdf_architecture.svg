  <text x="292" y="586" text-anchor="middle" font-size="7.5" fill="#2e7d32">tesseract\ · OCR</text>
  <rect x="350" y="556" width="100" height="36" rx="6" fill="#eafaf0" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="400" y="573" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1b5e20">PDFtk</text>
  <text x="400" y="586" text-anchor="middle" font-size="7.5" fill="#2e7d32">pdftk\ · split/merge</text>
  <rect x="458" y="556" width="104" height="36" rx="6" fill="#eafaf0" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="510" y="573" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1b5e20">Tabula · Java</text>
  <text x="510" y="586" text-anchor="middle" font-size="7.5" fill="#2e7d32">tabula\ · java\</text>
  <rect x="26" y="600" width="216" height="32" rx="6" fill="#eafaf0" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="134" y="620" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1b5e20">NAPS2 (naps2\) — scanner capture</text>
  <rect x="250" y="600" width="312" height="32" rx="6" fill="#eef4fb" stroke="#3b6ea5" stroke-width="1.3"/>
  <text x="406" y="620" text-anchor="middle" font-size="9" fill="#1d3a5f">Office COM (Word/Excel SaveAs PDF) · native WIA scan · invoked as child processes</text>

  <!-- ══ LOCAL AI BAND ══ -->
  <text x="592" y="536" font-size="10" fill="#9aa5b1" font-weight="600" letter-spacing="1">LOCAL AI (opt-in)</text>
  <rect x="588" y="542" width="276" height="100" rx="9" fill="#fff3e8" stroke="#e8772e" stroke-width="1.5"/>
  <text x="726" y="566" text-anchor="middle" font-size="11" font-weight="700" fill="#a8541a">Ollama — local LLM</text>
  <text x="726" y="584" text-anchor="middle" font-size="8.5" fill="#b8631f">127.0.0.1:11434 · /api/generate</text>
  <text x="726" y="599" text-anchor="middle" font-size="8.5" fill="#b8631f">chat · propose fields · ai_extract</text>
  <text x="726" y="616" text-anchor="middle" font-size="8" fill="#c47a3a">Proposes only — rules stay authoritative</text>
  <text x="726" y="630" text-anchor="middle" font-size="8" fill="#c47a3a">No OpenAI / Anthropic / Gemini · no telemetry</text>

  <!-- ══ OUTPUT / DEPLOYMENT BAND ══ -->
  <text x="22" y="664" font-size="10" fill="#9aa5b1" font-weight="600" letter-spacing="1">OUTPUT · DEPLOYMENT</text>
