<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="f-arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
    <marker id="f-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/>
    </marker>
    <marker id="f-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32"/>
    </marker>
    <marker id="f-orange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f97316"/>
    </marker>
    <marker id="f-purple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a855f7"/>
    </marker>
  </defs>

  <rect width="900" height="600" fill="#f8fafc" rx="12"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b">CypherMiner — Tool Catalog &amp; Data Flow</text>
  <text x="450" y="45" text-anchor="middle" font-size="11" fill="#64748b">Quiddity Innovations · Complete · 2026</text>

  <!-- ══ LEGEND ══ -->
  <rect x="690" y="58" width="202" height="150" rx="7" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="791" y="76" text-anchor="middle" font-size="10" font-weight="700" fill="#1e293b">Legend</text>
  <rect x="698" y="84" width="14" height="10" rx="2" fill="#eafaf0" stroke="#2e7d32"/>
  <text x="718" y="93" font-size="9" fill="#374151">Live tool / step</text>
  <rect x="698" y="101" width="14" height="10" rx="2" fill="#fff8e6" stroke="#b8860b"/>
  <text x="718" y="110" font-size="9" fill="#374151">Optional / partial</text>
  <rect x="698" y="118" width="14" height="10" rx="2" fill="#1f2d3d"/>
  <text x="718" y="127" font-size="9" fill="#374151">Core engine step</text>
  <line x1="698" y1="143" x2="716" y2="143" stroke="#3b82f6" stroke-width="2" marker-end="url(#f-blue)"/>
  <text x="722" y="147" font-size="9" fill="#374151">Input → transform</text>
  <line x1="698" y1="160" x2="716" y2="160" stroke="#2e7d32" stroke-width="2" marker-end="url(#f-green)"/>
  <text x="722" y="164" font-size="9" fill="#374151">Result → output</text>
  <line x1="698" y1="177" x2="716" y2="177" stroke="#a855f7" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#f-purple)"/>
  <text x="722" y="181" font-size="9" fill="#374151">Optional visual / assist</text>
  <text x="791" y="200" text-anchor="middle" font-size="8" fill="#94a3b8">Everything in-browser · no network</text>

  <!-- ══ INPUT BAND ══ -->
  <rect x="14" y="70" width="200" height="430" rx="9" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6,3"/>
  <rect x="26" y="64" width="70" height="14" rx="3" fill="#f8fafc"/>
  <text x="61" y="75" text-anchor="middle" font-size="10" fill="#3b82f6" font-weight="700" letter-spacing="1">INPUT</text>

  <rect x="26" y="86" width="176" height="96" rx="7" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="114" y="106" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">Auto-built form</text>
  <text x="114" y="123" text-anchor="middle" font-size="8" fill="#3b82f6">from tool.inputs (types.ts)</text>
  <text x="114" y="137" text-anchor="middle" font-size="8" fill="#3b82f6">text · textarea · number</text>
  <text x="114" y="150" text-anchor="middle" font-size="8" fill="#3b82f6">range · select</text>
  <text x="114" y="166" text-anchor="middle" font-size="8" fill="#60a5fa">bilingual labels (Loc)</text>

  <rect x="26" y="196" width="176" height="86" rx="7" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="114" y="216" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">User types / drags</text>
  <text x="114" y="233" text-anchor="middle" font-size="8" fill="#3b82f6">every change updates</text>
  <text x="114" y="246" text-anchor="middle" font-size="8" fill="#3b82f6">the values bag</text>
  <text x="114" y="262" text-anchor="middle" font-size="8" fill="#60a5fa">live · no submit button</text>

  <rect x="26" y="296" width="176" height="90" rx="7" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="114" y="316" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">Assistant (optional)</text>
  <text x="114" y="333" text-anchor="middle" font-size="8" fill="#3b82f6">"which tool do I need?"</text>
  <text x="114" y="346" text-anchor="middle" font-size="8" fill="#3b82f6">TF-IDF over tool index</text>
  <text x="114" y="362" text-anchor="middle" font-size="8" fill="#60a5fa">picks a tool → routes here</text>

  <rect x="26" y="400" width="176" height="86" rx="7" fill="#fff8e6" stroke="#b8860b" stroke-width="1.5"/>
  <text x="114" y="420" text-anchor="middle" font-size="11" font-weight="700" fill="#7a5b00">config.json</text>
  <text x="114" y="437" text-anchor="middle" font-size="8" fill="#8a6d00">assistantMode · endpoints</text>
  <text x="114" y="450" text-anchor="middle" font-size="8" fill="#8a6d00">lotteryWizUrl · showAll</text>
  <text x="114" y="466" text-anchor="middle" font-size="8" fill="#b8860b">edit without rebuild</text>

  <!-- ══ TRANSFORM (core, dark navy) ══ -->
  <rect x="270" y="70" width="320" height="430" rx="9" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="6,3"/>
  <rect x="282" y="64" width="170" height="14" rx="3" fill="#f8fafc"/>
  <text x="367" y="75" text-anchor="middle" font-size="10" fill="#f97316" font-weight="700" letter-spacing="1">TRANSFORM — tool.run()</text>

  <!-- runner core box -->
  <rect x="284" y="86" width="292" height="66" rx="9" fill="#1f2d3d" stroke="#334155" stroke-width="2"/>
  <text x="430" y="108" text-anchor="middle" font-size="11" font-weight="700" fill="white">Live runner (core/ui.ts)</text>
  <text x="430" y="124" text-anchor="middle" font-size="8" fill="#94a3b8">run(values, ctx{lang}) → string | Promise</text>
  <text x="430" y="138" text-anchor="middle" font-size="8" fill="#64748b">runToken guard · errors caught → ⚠ inline</text>

  <!-- five category transform boxes -->
  <rect x="284" y="166" width="140" height="58" rx="7" fill="#eafaf0" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="354" y="185" text-anchor="middle" font-size="10" font-weight="700" fill="#14532d">🔐 Crypto (19)</text>
  <text x="354" y="200" text-anchor="middle" font-size="7.5" fill="#2e7d32">shift / substitute / hash</text>
  <text x="354" y="212" text-anchor="middle" font-size="7.5" fill="#16a34a">Web Crypto · IoC · χ²</text>

  <rect x="436" y="166" width="140" height="58" rx="7" fill="#eafaf0" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="506" y="185" text-anchor="middle" font-size="10" font-weight="700" fill="#14532d">🔣 Encoding (13)</text>
  <text x="506" y="200" text-anchor="middle" font-size="7.5" fill="#2e7d32">Base64 · hex · binary</text>
  <text x="506" y="212" text-anchor="middle" font-size="7.5" fill="#16a34a">Morse · NATO · unicode</text>

  <rect x="284" y="234" width="140" height="58" rx="7" fill="#eafaf0" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="354" y="253" text-anchor="middle" font-size="10" font-weight="700" fill="#14532d">🔢 Math (14)</text>
  <text x="354" y="268" text-anchor="middle" font-size="7.5" fill="#2e7d32">BigInt factorize · prime</text>
  <text x="354" y="280" text-anchor="middle" font-size="7.5" fill="#16a34a">Miller-Rabin · Pollard ρ</text>

  <rect x="436" y="234" width="140" height="58" rx="7" fill="#eafaf0" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="506" y="253" text-anchor="middle" font-size="10" font-weight="700" fill="#14532d">🎟️ Lottery (2)</text>
  <text x="506" y="268" text-anchor="middle" font-size="7.5" fill="#2e7d32">hypergeometric odds</text>
  <text x="506" y="280" text-anchor="middle" font-size="7.5" fill="#16a34a">covering wheel · nCrBig</text>

  <rect x="284" y="302" width="292" height="50" rx="7" fill="#eafaf0" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="430" y="320" text-anchor="middle" font-size="10" font-weight="700" fill="#14532d">✍️ Text (11)</text>
  <text x="430" y="335" text-anchor="middle" font-size="7.5" fill="#2e7d32">case · reverse · slugify (NFD) · wordfreq · dedupe · lorem</text>
  <text x="430" y="346" text-anchor="middle" font-size="7.5" fill="#16a34a">pure string functions</text>

  <!-- shared helpers -->
  <rect x="284" y="362" width="140" height="58" rx="7" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="354" y="381" text-anchor="middle" font-size="9.5" font-weight="700" fill="#581c87">tool.visual()</text>
  <text x="354" y="396" text-anchor="middle" font-size="7.5" fill="#7e22ce">widgets/visuals.ts</text>
  <text x="354" y="408" text-anchor="middle" font-size="7.5" fill="#a855f7">wheel · grid · zigzag</text>

  <rect x="436" y="362" width="140" height="58" rx="7" fill="#eafaf0" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="506" y="381" text-anchor="middle" font-size="9.5" font-weight="700" fill="#14532d">ctx.lang (EN/PT)</text>
  <text x="506" y="396" text-anchor="middle" font-size="7.5" fill="#2e7d32">output localised</text>
  <text x="506" y="408" text-anchor="middle" font-size="7.5" fill="#16a34a">+ educational content</text>

  <rect x="284" y="430" width="292" height="56" rx="7" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="430" y="450" text-anchor="middle" font-size="10" font-weight="700" fill="#9a3412">Registry (core/registry.ts)</text>
  <text x="430" y="466" text-anchor="middle" font-size="8" fill="#c2410c">every tool self-registers via register() — UI built from it</text>
  <text x="430" y="478" text-anchor="middle" font-size="7.5" fill="#ea580c">no AI · no server · no network for any of the 59 tools</text>

  <!-- ══ OUTPUT BAND ══ -->
  <rect x="646" y="220" width="240" height="280" rx="9" fill="none" stroke="#2e7d32" stroke-width="2" stroke-dasharray="6,3"/>
  <rect x="658" y="214" width="80" height="14" rx="3" fill="#f8fafc"/>
  <text x="698" y="225" text-anchor="middle" font-size="10" fill="#2e7d32" font-weight="700" letter-spacing="1">OUTPUT</text>

  <rect x="658" y="236" width="216" height="74" rx="7" fill="#eafaf0" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="766" y="258" text-anchor="middle" font-size="11" font-weight="700" fill="#14532d">Live result panel</text>
  <text x="766" y="275" text-anchor="middle" font-size="8" fill="#2e7d32">recomputed on each change</text>
  <text x="766" y="288" text-anchor="middle" font-size="8" fill="#2e7d32">errors shown inline (⚠)</text>
  <text x="766" y="301" text-anchor="middle" font-size="8" fill="#16a34a">Copy button</text>

  <rect x="658" y="324" width="216" height="74" rx="7" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="766" y="346" text-anchor="middle" font-size="11" font-weight="700" fill="#581c87">Live visual (some tools)</text>
  <text x="766" y="363" text-anchor="middle" font-size="8" fill="#7e22ce">Caesar wheel · Polybius grid</text>
  <text x="766" y="376" text-anchor="middle" font-size="8" fill="#7e22ce">rail-fence zigzag · strips</text>
  <text x="766" y="389" text-anchor="middle" font-size="8" fill="#a855f7">redrawn from current inputs</text>

  <rect x="658" y="412" width="216" height="74" rx="7" fill="#eafaf0" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="766" y="434" text-anchor="middle" font-size="11" font-weight="700" fill="#14532d">Stays on device</text>
  <text x="766" y="451" text-anchor="middle" font-size="8" fill="#2e7d32">favorites/lang/theme →</text>
  <text x="766" y="464" text-anchor="middle" font-size="8" fill="#2e7d32">localStorage only</text>
  <text x="766" y="477" text-anchor="middle" font-size="8" fill="#16a34a">nothing ever uploaded</text>

  <!-- FLOW ARROWS -->
  <!-- input form -> runner -->
  <line x1="202" y1="119" x2="282" y2="115" stroke="#3b82f6" stroke-width="2" marker-end="url(#f-blue)"/>
  <!-- user types -> runner -->
  <line x1="202" y1="232" x2="282" y2="140" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#f-blue)"/>
  <!-- assistant -> runner (routes to a tool) -->
  <line x1="202" y1="335" x2="282" y2="150" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#f-purple)"/>
  <!-- config -> assistant/runner -->
  <line x1="202" y1="430" x2="282" y2="320" stroke="#b8860b" stroke-width="1.5" marker-end="url(#f-arr)"/>

  <!-- runner -> result -->
  <line x1="576" y1="120" x2="656" y2="262" stroke="#2e7d32" stroke-width="2" marker-end="url(#f-green)"/>
  <!-- visual -> live visual -->
  <line x1="424" y1="388" x2="656" y2="360" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#f-purple)"/>
  <!-- result -> stays on device -->
  <line x1="766" y1="398" x2="766" y2="412" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#f-green)"/>
</svg>
