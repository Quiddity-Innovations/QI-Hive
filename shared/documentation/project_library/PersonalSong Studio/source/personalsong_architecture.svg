  <line x1="734" y1="193" x2="752" y2="193" stroke="#a855f7" stroke-width="1.6" marker-end="url(#arr-purple)"/>
  <text x="758" y="197" font-size="9" fill="#374151">Subprocess / isolated venv</text>
