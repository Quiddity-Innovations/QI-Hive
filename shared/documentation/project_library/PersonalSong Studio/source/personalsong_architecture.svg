  <text x="222" y="137" text-anchor="middle" font-size="8" fill="#3b82f6">karaoke stems · QR card</text>
  <text x="222" y="148" text-anchor="middle" font-size="8" fill="#93c5fd">/api/library · /api/extras</text>

