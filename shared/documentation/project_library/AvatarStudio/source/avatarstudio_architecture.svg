  <text x="18" y="366" font-size="10" fill="#94a3b8" font-weight="600" letter-spacing="1">FACE ANIMATION / RENDER ENGINES</text>

  <rect x="14" y="372" width="648" height="150" rx="9" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="6,3"/>
  <rect x="26" y="366" width="140" height="14" rx="3" fill="#f8fafc"/>
  <text x="96" y="377" text-anchor="middle" font-size="9" fill="#16a34a" font-weight="700" letter-spacing="1">WSL2 Ubuntu-24.04</text>

  <!-- LivePortrait -->
  <rect x="24" y="386" width="150" height="60" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="99" y="404" text-anchor="middle" font-size="10" font-weight="700" fill="#14532d">LivePortrait</text>
  <text x="99" y="418" text-anchor="middle" font-size="7.5" fill="#16a34a">motion transfer · ~30s</text>
  <text x="99" y="430" text-anchor="middle" font-size="7.5" fill="#16a34a">driving video · not audio-driven</text>
  <text x="99" y="441" text-anchor="middle" font-size="7.5" fill="#16a34a">conda env: liveportrait</text>

  <!-- Hallo2 -->
  <rect x="184" y="386" width="150" height="60" rx="7" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="259" y="404" text-anchor="middle" font-size="10" font-weight="700" fill="#713f12">Hallo2</text>
  <text x="259" y="418" text-anchor="middle" font-size="7.5" fill="#ca8a04">audio-driven · lips match WAV</text>
  <text x="259" y="430" text-anchor="middle" font-size="7.5" fill="#ca8a04">slow ~15–30 min/min · timeout 1h</text>
  <text x="259" y="441" text-anchor="middle" font-size="7.5" fill="#ca8a04">conda env: hallo</text>

  <!-- retalking -->
  <rect x="344" y="386" width="150" height="60" rx="7" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="419" y="404" text-anchor="middle" font-size="10" font-weight="700" fill="#713f12">video-retalking</text>
  <text x="419" y="418" text-anchor="middle" font-size="7.5" fill="#ca8a04">lip-sync post-process pass</text>
  <text x="419" y="430" text-anchor="middle" font-size="7.5" fill="#ca8a04">opt-in checkbox · #1 quality lever</text>
  <text x="419" y="441" text-anchor="middle" font-size="7.5" fill="#ca8a04">conda env: retalking</text>

