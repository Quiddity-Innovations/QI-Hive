  <line x1="470" y1="246" x2="470" y2="270" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arr-purple)"/>

  <rect x="334" y="270" width="328" height="78" rx="9" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="498" y="288" text-anchor="middle" font-size="11" font-weight="700" fill="#581c87">Portrait &amp; Background</text>
  <text x="498" y="304" text-anchor="middle" font-size="8.5" fill="#7e22ce">rembg cutout + PIL composite (solid color / image)</text>
  <text x="498" y="318" text-anchor="middle" font-size="8.5" fill="#7e22ce">OpenCV best-frame finder · ffmpeg frame extract · screen capture</text>
  <rect x="368" y="326" width="260" height="16" rx="5" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="498" y="338" text-anchor="middle" font-size="8" fill="#475569">Generate-avatar-from-description (Phase 2 · planned)</text>

