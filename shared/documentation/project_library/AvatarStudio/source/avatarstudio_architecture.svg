<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
    <marker id="arr-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/>
    </marker>
    <marker id="arr-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22c55e"/>
    </marker>
    <marker id="arr-orange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f97316"/>
    </marker>
    <marker id="arr-purple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a855f7"/>
    </marker>
    <marker id="arr-sky" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" fill="#f8fafc" rx="12"/>
  <text x="450" y="25" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b">QI Avatar Studio — System Architecture</text>
  <text x="450" y="45" text-anchor="middle" font-size="11" fill="#64748b">Quiddity Innovations · Proof of Concept · 2026</text>

  <!-- ══ LEGEND (top right) ══ -->
  <rect x="686" y="58" width="206" height="172" rx="7" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="789" y="76" text-anchor="middle" font-size="10" font-weight="700" fill="#1e293b">Legend</text>
  <rect x="694" y="83" width="14" height="10" rx="2" fill="#dcfce7" stroke="#16a34a"/>
  <text x="714" y="93" font-size="9" fill="#374151">Live / Active</text>
  <rect x="694" y="100" width="14" height="10" rx="2" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="714" y="110" font-size="9" fill="#374151">Built · Partial / Pending</text>
  <rect x="694" y="117" width="14" height="10" rx="2" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="714" y="127" font-size="9" fill="#374151">Planned</text>
  <rect x="694" y="134" width="14" height="10" rx="2" fill="#fef3c7" stroke="#f59e0b" stroke-dasharray="3,2"/>
  <text x="714" y="144" font-size="9" fill="#374151">Caution / Disabled</text>
  <line x1="694" y1="159" x2="712" y2="159" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="718" y="163" font-size="9" fill="#374151">Pipeline data flow</text>
  <path d="M 694,176 H 704 V 182 H 712" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="718" y="184" font-size="9" fill="#374151">Connector (elbow)</text>
  <rect x="694" y="194" width="14" height="10" rx="2" fill="#1f2d3d"/>
  <text x="714" y="203" font-size="9" fill="#374151">WSL2 / core compute</text>
  <text x="789" y="222" text-anchor="middle" font-size="8" fill="#94a3b8">Quiddity Innovations © 2026</text>

  <!-- ══ USERS / ENTRY GROUP ══ -->
  <rect x="8" y="62" width="500" height="84" rx="9" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6,3"/>
  <rect x="20" y="56" width="120" height="14" rx="3" fill="#f8fafc"/>
  <text x="80" y="67" text-anchor="middle" font-size="10" fill="#3b82f6" font-weight="700" letter-spacing="1">USERS / ENTRY</text>

  <rect x="16" y="74" width="150" height="64" rx="7" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="91" y="93" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">Operator (Studio)</text>
  <text x="91" y="108" text-anchor="middle" font-size="8" fill="#3b82f6">Pick agent · script · language</text>
  <text x="91" y="120" text-anchor="middle" font-size="8" fill="#3b82f6">engine · click Generate</text>
  <text x="91" y="132" text-anchor="middle" font-size="8" fill="#93c5fd">Gradio UI · localhost:7862</text>

  <rect x="176" y="74" width="150" height="64" rx="7" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="251" y="93" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">CLI User</text>
  <text x="251" y="108" text-anchor="middle" font-size="8" fill="#3b82f6">run_avatar.bat &lt;agent&gt; "text"</text>
  <text x="251" y="120" text-anchor="middle" font-size="8" fill="#3b82f6">headless Kokoro → Hallo2</text>
  <text x="251" y="132" text-anchor="middle" font-size="8" fill="#93c5fd">avatar_pipeline.py</text>

  <rect x="336" y="74" width="160" height="64" rx="7" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="416" y="93" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">Scene Author</text>
  <text x="416" y="108" text-anchor="middle" font-size="8" fill="#3b82f6">Long script → per-character</text>
  <text x="416" y="120" text-anchor="middle" font-size="8" fill="#3b82f6">scenes → concat movie</text>
  <text x="416" y="132" text-anchor="middle" font-size="8" fill="#93c5fd">scene_pipeline.py (partial)</text>

  <!-- ARROW: Users → Core App -->
  <line x1="258" y1="146" x2="258" y2="182" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- ══ CORE APP (Windows) ══ -->
  <rect x="14" y="182" width="648" height="64" rx="9" fill="#1f2d3d" stroke="#334155" stroke-width="2"/>
  <text x="338" y="203" text-anchor="middle" font-size="13" font-weight="700" fill="white">Avatar Studio Core (Windows)</text>
  <text x="338" y="219" text-anchor="middle" font-size="10" fill="#94a3b8">avatar_studio.py · Gradio :7862 · pipeline_generate() orchestrator · own .venv (Python + PyTorch cu128)</text>
  <text x="338" y="234" text-anchor="middle" font-size="9" fill="#64748b">Config + secret overlay · engine dispatch · background prep · to_wsl_path() · ffmpeg mux · progress streaming</text>

  <!-- ARROW: Core → Config (right) -->
  <line x1="662" y1="214" x2="682" y2="214" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-sky)"/>

  <!-- CONFIG / SECRETS box -->
  <rect x="682" y="244" width="208" height="92" rx="9" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="786" y="263" text-anchor="middle" font-size="11" font-weight="700" fill="#0c4a6e">Config &amp; Secrets</text>
  <text x="786" y="279" text-anchor="middle" font-size="8" fill="#0284c7">studio_config.json (engines)</text>
  <text x="786" y="292" text-anchor="middle" font-size="8" fill="#0284c7">agents.json · languages.json</text>
  <text x="786" y="305" text-anchor="middle" font-size="8" fill="#0284c7">VOICE_CATALOG (~60 voices)</text>
  <rect x="700" y="312" width="172" height="18" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-dasharray="3,2"/>
  <text x="786" y="325" text-anchor="middle" font-size="8" font-weight="600" fill="#92400e">secrets/avatarstudio.env (gitignored)</text>
