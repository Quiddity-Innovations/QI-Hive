  <rect x="504" y="386" width="148" height="60" rx="7" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="578" y="404" text-anchor="middle" font-size="9.5" font-weight="700" fill="#92400e">MuseTalk · SadTalker</text>
  <text x="578" y="417" text-anchor="middle" font-size="9.5" font-weight="700" fill="#92400e">Wav2Lip</text>
  <text x="578" y="431" text-anchor="middle" font-size="7.5" fill="#b45309">wrappers present · disabled</text>
  <text x="578" y="441" text-anchor="middle" font-size="7.5" fill="#b45309">need WSL2 install</text>

  <!-- Cloud engines -->
  <rect x="24" y="456" width="320" height="56" rx="7" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="184" y="474" text-anchor="middle" font-size="10" font-weight="700" fill="#713f12">Cloud Render (REST)</text>
  <text x="184" y="489" text-anchor="middle" font-size="8" fill="#ca8a04">D-ID Talks API — implemented, enabled, no key set</text>
  <text x="184" y="502" text-anchor="middle" font-size="8" fill="#ca8a04">HeyGen Talking Photo — implemented, disabled (no key)</text>

  <!-- Pipeline flow note -->
  <rect x="356" y="456" width="296" height="56" rx="7" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="504" y="474" text-anchor="middle" font-size="10" font-weight="700" fill="#3730a3">Render dispatch (per language)</text>
  <text x="504" y="489" text-anchor="middle" font-size="8" fill="#4f46e5">pipeline_generate selects ONE engine per run</text>
  <text x="504" y="502" text-anchor="middle" font-size="8" fill="#4f46e5">→ optional retalking → ffmpeg audio mux</text>

  <!-- ARROW: Render group → Output -->
  <line x1="338" y1="522" x2="338" y2="548" stroke="#22c55e" stroke-width="2" marker-end="url(#arr-green)"/>
