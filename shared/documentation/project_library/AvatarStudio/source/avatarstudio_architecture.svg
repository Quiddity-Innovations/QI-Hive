  <!-- ══ TTS LAYER ══ -->
  <text x="18" y="262" font-size="10" fill="#94a3b8" font-weight="600" letter-spacing="1">TTS LAYER</text>
  <!-- ARROW: Core → TTS -->
  <line x1="160" y1="246" x2="160" y2="270" stroke="#f97316" stroke-width="1.5" marker-end="url(#arr-orange)"/>

  <rect x="14" y="270" width="300" height="78" rx="9" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="164" y="288" text-anchor="middle" font-size="11" font-weight="700" fill="#9a3412">Text-to-Speech (generate_voice)</text>
  <rect x="24" y="296" width="138" height="42" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="93" y="312" text-anchor="middle" font-size="9" font-weight="700" fill="#14532d">Kokoro-82M (local)</text>
  <text x="93" y="325" text-anchor="middle" font-size="7.5" fill="#16a34a">en·pt·es·it·zh · offline</text>
