  <text x="174" y="582" text-anchor="middle" font-size="8" fill="#0284c7">Final talking-head videos · gitignored</text>
  <text x="174" y="595" text-anchor="middle" font-size="8" fill="#0284c7">served via Gradio allowed_paths</text>

  <rect x="344" y="548" width="318" height="58" rx="7" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="503" y="567" text-anchor="middle" font-size="10" font-weight="700" fill="#713f12">QI Ecosystem (planned)</text>
  <text x="503" y="582" text-anchor="middle" font-size="8" fill="#ca8a04">QI Hive dashboard :8600 · QI Brain :9011 · NEXUS :8010</text>
  <text x="503" y="595" text-anchor="middle" font-size="8" fill="#ca8a04">no integrations wired yet · QI_AvatarStudio NSSM (demand-start)</text>

  <!-- ARROW: Output → ecosystem -->
  <line x1="334" y1="577" x2="344" y2="577" stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr)"/>
