  <rect x="170" y="296" width="134" height="42" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="237" y="312" text-anchor="middle" font-size="9" font-weight="700" fill="#14532d">edge-tts (MS Neural)</text>
  <text x="237" y="325" text-anchor="middle" font-size="7.5" fill="#16a34a">ja·fr·ru·de · internet</text>
  <text x="237" y="335" text-anchor="middle" font-size="7.5" fill="#16a34a">SSML rate/pitch · free</text>

