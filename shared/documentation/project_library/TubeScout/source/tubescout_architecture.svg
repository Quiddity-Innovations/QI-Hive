<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 660" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
    <marker id="arr-orange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f97316"/>
    </marker>
    <marker id="arr-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arr-sky" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="940" height="660" fill="#f9fafb" rx="12"/>
  <text x="470" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2d3d">TubeScout — System Architecture</text>
  <text x="470" y="47" text-anchor="middle" font-size="11.5" fill="#64748b">Quiddity Innovations · Active Development · 2026</text>
  <text x="470" y="63" text-anchor="middle" font-size="10" fill="#9aa5b1">Subscription-first · read-only YouTube · no LLM in-process (all summarization routes through NEXUS)</text>

  <!-- ══ LEGEND (top right) ══ -->
  <rect x="726" y="74" width="206" height="150" rx="7" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="829" y="92" text-anchor="middle" font-size="10" font-weight="700" fill="#1f2d3d">Legend</text>
  <rect x="736" y="100" width="14" height="10" rx="2" fill="#eafaf0" stroke="#2e7d32"/>
  <text x="756" y="109" font-size="9" fill="#374151">Live / Active</text>
  <rect x="736" y="117" width="14" height="10" rx="2" fill="#fff8e6" stroke="#b8860b"/>
  <text x="756" y="126" font-size="9" fill="#374151">Built · Partial / opt-in</text>
  <rect x="736" y="134" width="14" height="10" rx="2" fill="#f1f3f5" stroke="#9aa5b1"/>
  <text x="756" y="143" font-size="9" fill="#374151">Planned</text>
  <rect x="736" y="151" width="14" height="10" rx="2" fill="#1f2d3d" stroke="#1f2d3d"/>
  <text x="756" y="160" font-size="9" fill="#374151">Core service (TubeScout)</text>
  <line x1="736" y1="176" x2="754" y2="176" stroke="#f97316" stroke-width="2" marker-end="url(#arr-orange)"/>
  <text x="760" y="180" font-size="9" fill="#374151">Pipeline flow</text>
  <path d="M 736,193 H 754" fill="none" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="4,2" marker-end="url(#arr-green)"/>
  <text x="760" y="197" font-size="9" fill="#374151">Tunnel / external call</text>
  <rect x="736" y="206" width="14" height="10" rx="2" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="756" y="215" font-size="9" fill="#374151">Data store</text>

  <!-- ══ SOURCE BAND ══ -->
  <text x="22" y="92" font-size="9.5" fill="#9aa5b1" font-weight="700" letter-spacing="0.5">SOURCE — YouTube Data API v3 (read-only OAuth)</text>
  <rect x="20" y="100" width="200" height="78" rx="9" fill="#eafaf0" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="120" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#1b4d22">YouTube API v3</text>
  <text x="120" y="139" text-anchor="middle" font-size="8.5" fill="#16a34a">subscriptions.list · channels.list</text>
  <text x="120" y="152" text-anchor="middle" font-size="8.5" fill="#16a34a">playlistItems.list (1 unit)</text>
  <text x="120" y="165" text-anchor="middle" font-size="8.5" fill="#16a34a">topicDetails · search (name lookup)</text>

  <!-- captions box -->
  <rect x="236" y="100" width="180" height="78" rx="9" fill="#eafaf0" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="326" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#1b4d22">Captions</text>
  <text x="326" y="139" text-anchor="middle" font-size="8.5" fill="#16a34a">youtube-transcript-api</text>
  <text x="326" y="152" text-anchor="middle" font-size="8.5" fill="#16a34a">throttle + IP-block backoff</text>
  <rect x="248" y="158" width="156" height="14" rx="4" fill="#fff8e6" stroke="#b8860b"/>
  <text x="326" y="168" text-anchor="middle" font-size="8" font-weight="600" fill="#7a5b06">Whisper fallback — opt-in</text>

  <!-- ① arrow source band -> sweep core -->
  <line x1="218" y1="186" x2="218" y2="208" stroke="#f97316" stroke-width="2" marker-end="url(#arr-orange)"/>

  <!-- ══ PIPELINE CORE (dark navy) ══ -->
  <rect x="20" y="208" width="690" height="92" rx="9" fill="#1f2d3d" stroke="#334155" stroke-width="2"/>
  <text x="365" y="230" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">TubeScout Daily Cycle  ·  shared/cycle.py</text>
  <text x="365" y="247" text-anchor="middle" font-size="9.5" fill="#94a3b8">QI_TubeScout_AM (07:00) · QI_TubeScout_PM (19:00) — each stage _safe-wrapped, one failure never aborts the run</text>

  <!-- pipeline stage chips -->
  <rect x="34" y="258" width="92" height="30" rx="6" fill="#334155"/>
  <text x="80" y="277" text-anchor="middle" font-size="9.5" font-weight="600" fill="#ffffff">1 · Sweep</text>
  <rect x="132" y="258" width="100" height="30" rx="6" fill="#334155"/>
  <text x="182" y="273" text-anchor="middle" font-size="9" font-weight="600" fill="#ffffff">2 · Reclassify</text>
  <text x="182" y="284" text-anchor="middle" font-size="7.5" fill="#94a3b8">topics</text>
  <rect x="238" y="258" width="100" height="30" rx="6" fill="#334155"/>
  <text x="288" y="273" text-anchor="middle" font-size="9" font-weight="600" fill="#ffffff">3 · Transcripts</text>
  <text x="288" y="284" text-anchor="middle" font-size="7.5" fill="#94a3b8">captions</text>
  <rect x="344" y="258" width="100" height="30" rx="6" fill="#3a2a12" stroke="#f97316" stroke-width="1.2"/>
  <text x="394" y="273" text-anchor="middle" font-size="9" font-weight="600" fill="#fdba74">4 · Summarize</text>
  <text x="394" y="284" text-anchor="middle" font-size="7.5" fill="#fdba74">→ NEXUS</text>
  <rect x="450" y="258" width="92" height="30" rx="6" fill="#334155"/>
  <text x="496" y="277" text-anchor="middle" font-size="9.5" font-weight="600" fill="#ffffff">5 · Dedup</text>
  <rect x="548" y="258" width="100" height="30" rx="6" fill="#3a2a12" stroke="#f97316" stroke-width="1.2"/>
  <text x="598" y="273" text-anchor="middle" font-size="9" font-weight="600" fill="#fdba74">6 · Score</text>
  <text x="598" y="284" text-anchor="middle" font-size="7.5" fill="#fdba74">→ NEXUS/Brain</text>
  <rect x="654" y="258" width="46" height="30" rx="6" fill="#334155"/>
  <text x="677" y="273" text-anchor="middle" font-size="8" font-weight="600" fill="#ffffff">7</text>
  <text x="677" y="284" text-anchor="middle" font-size="7" fill="#94a3b8">Scout</text>

  <!-- ② arrow core -> DB -->
  <line x1="180" y1="300" x2="180" y2="326" stroke="#0284c7" stroke-width="1.4" marker-end="url(#arr-sky)"/>
  <!-- ③ arrow core -> news page -->
  <line x1="540" y1="300" x2="540" y2="326" stroke="#f97316" stroke-width="2" marker-end="url(#arr-orange)"/>

  <!-- ══ DATA STORE ══ -->
  <text x="22" y="320" font-size="9.5" fill="#9aa5b1" font-weight="700" letter-spacing="0.5">DATA</text>
  <rect x="20" y="326" width="280" height="74" rx="9" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="160" y="348" text-anchor="middle" font-size="12" font-weight="700" fill="#0c4a6e">tubescout.db (SQLite · WAL)</text>
  <text x="160" y="365" text-anchor="middle" font-size="8.5" fill="#0284c7">channels 816 · videos 4,014 · summaries 4,014</text>
  <text x="160" y="378" text-anchor="middle" font-size="8.5" fill="#0284c7">transcripts 151 · scores 439 · sweeps 15</text>
  <text x="160" y="391" text-anchor="middle" font-size="8.5" fill="#0284c7">recommendations · state · schema v1</text>

  <!-- ══ NEWS PAGE / API (dark navy) ══ -->
  <rect x="316" y="326" width="394" height="74" rx="9" fill="#1f2d3d" stroke="#334155" stroke-width="2"/>
  <text x="513" y="348" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">TubeScout API + News Page  ·  api/main.py</text>
  <text x="513" y="364" text-anchor="middle" font-size="9" fill="#94a3b8">FastAPI + Uvicorn · :8503 · QI_TubeScout NSSM service</text>
  <text x="513" y="378" text-anchor="middle" font-size="8.5" fill="#64748b">/news · /favorites · /discover · /digest · /settings · /api/* · /health · /version · /info</text>
  <text x="513" y="391" text-anchor="middle" font-size="8" fill="#64748b">write-guard middleware (token) · reads public · tangerine theme · Gradio status UI :7843</text>

  <!-- ④ arrow news page -> tunnel -->
  <line x1="710" y1="363" x2="744" y2="363" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="4,2" marker-end="url(#arr-green)"/>

  <!-- tunnel + viewers -->
  <rect x="744" y="330" width="178" height="66" rx="9" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="833" y="351" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">QI_TubeScoutTunnel</text>
  <text x="833" y="367" text-anchor="middle" font-size="8" fill="#16a34a">tubescout.quiddityinnovations.com</text>
  <text x="833" y="380" text-anchor="middle" font-size="8" fill="#16a34a">named Cloudflare tunnel · no open port</text>

  <!-- ══ NEXUS BACKBONE BAND ══ -->
  <text x="22" y="436" font-size="9.5" fill="#9aa5b1" font-weight="700" letter-spacing="0.5">QI ECOSYSTEM — TubeScout consumes (no LLM runs in-process)</text>

  <!-- ⑤ arrow summarize -> NEXUS -->
  <path d="M 394,300 V 452" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arr-orange)"/>

  <rect x="20" y="452" width="250" height="92" rx="9" fill="#fff8e6" stroke="#b8860b" stroke-width="1.5"/>
  <text x="145" y="474" text-anchor="middle" font-size="12" font-weight="700" fill="#7a5b06">NEXUS (:8010)</text>
  <text x="145" y="491" text-anchor="middle" font-size="8.5" fill="#9a7a2e">POST /synthesize — every summary + score</text>
  <text x="145" y="504" text-anchor="middle" font-size="8.5" fill="#9a7a2e">providers: Groq → Cloudflare → Gemini</text>
  <text x="145" y="517" text-anchor="middle" font-size="8.5" fill="#9a7a2e">Discover reasoner (gemma4 local switchable)</text>
  <text x="145" y="532" text-anchor="middle" font-size="8.5" fill="#9a7a2e">/scout/import/opml — Kaze digest feed</text>

  <rect x="286" y="452" width="210" height="92" rx="9" fill="#fff8e6" stroke="#b8860b" stroke-width="1.5"/>
  <text x="391" y="474" text-anchor="middle" font-size="12" font-weight="700" fill="#7a5b06">NEXUS Scout → Kaze</text>
  <text x="391" y="491" text-anchor="middle" font-size="8.5" fill="#9a7a2e">curated OPML of AI/tech subs</text>
  <text x="391" y="504" text-anchor="middle" font-size="8.5" fill="#9a7a2e">topic 'TubeScout-YouTube'</text>
  <text x="391" y="519" text-anchor="middle" font-size="8.5" fill="#9a7a2e">folds YouTube items into the</text>
  <text x="391" y="532" text-anchor="middle" font-size="8.5" fill="#9a7a2e">daily Kaze AI Digest (Maia Quiddam)</text>

  <rect x="512" y="452" width="198" height="92" rx="9" fill="#fff8e6" stroke="#b8860b" stroke-width="1.5"/>
  <text x="611" y="474" text-anchor="middle" font-size="12" font-weight="700" fill="#7a5b06">QI Brain (:9011)</text>
  <text x="611" y="491" text-anchor="middle" font-size="8.5" fill="#9a7a2e">POST /api/log_feature</text>
  <text x="611" y="504" text-anchor="middle" font-size="8.5" fill="#9a7a2e">implement-worthy videos (≥ 7.0)</text>
  <text x="611" y="517" text-anchor="middle" font-size="8.5" fill="#9a7a2e">→ pending-features queue</text>
  <rect x="524" y="523" width="174" height="14" rx="4" fill="#f1f3f5" stroke="#9aa5b1"/>
  <text x="611" y="533" text-anchor="middle" font-size="7.5" font-weight="600" fill="#6b7280">session/decision logging — planned</text>

  <rect x="726" y="452" width="196" height="92" rx="9" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="824" y="474" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">Kaze AI Digest</text>
  <text x="824" y="491" text-anchor="middle" font-size="8.5" fill="#16a34a">C:\OC\runtime\dashboard\</text>
  <text x="824" y="504" text-anchor="middle" font-size="8.5" fill="#16a34a">ai-digest\index.html</text>
  <text x="824" y="519" text-anchor="middle" font-size="8.5" fill="#16a34a">read live + re-served by TubeScout</text>
  <text x="824" y="532" text-anchor="middle" font-size="8.5" fill="#16a34a">at /digest (own tunnel)</text>

  <!-- ⑥ arrow score -> Brain -->
  <path d="M 598,300 V 360 H 611 V 446" fill="none" stroke="#f97316" stroke-width="1.6" stroke-dasharray="4,2" marker-end="url(#arr-orange)"/>

  <!-- ⑦ arrow scout -> Kaze digest pull back into news page (digest read) -->
  <path d="M 824,446 V 410 H 833 V 398" fill="none" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="4,2" marker-end="url(#arr-green)"/>

  <!-- ══ VIEWERS / CONTROL band ══ -->
  <rect x="20" y="566" width="430" height="74" rx="9" fill="#eafaf0" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="235" y="588" text-anchor="middle" font-size="12" font-weight="700" fill="#1b4d22">Owner (Renne) &amp; Public Viewers</text>
  <text x="235" y="605" text-anchor="middle" font-size="8.5" fill="#16a34a">Public: read news + Kaze digest (no login, read-only)</text>
  <text x="235" y="618" text-anchor="middle" font-size="8.5" fill="#16a34a">Owner: Settings → interests (AI · Travel · Retirement · DOAC),</text>
  <text x="235" y="631" text-anchor="middle" font-size="8.5" fill="#16a34a">favorites, mute, thresholds, providers — config-driven, no restart</text>

  <rect x="466" y="566" width="456" height="74" rx="9" fill="#f1f3f5" stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="480" y="586" font-size="9.5" fill="#6b7280" font-weight="600">Resilience &amp; privacy notes:</text>
  <text x="480" y="601" font-size="8.5" fill="#6b7280">• Read-only OAuth — TubeScout never posts/subscribes on YouTube · uploads via playlist (1 unit) not search</text>
  <text x="480" y="614" font-size="8.5" fill="#6b7280">• Every stage degrades: no captions → description · NEXUS down → description-fallback card · YT block → cooldown</text>
  <text x="480" y="627" font-size="8.5" fill="#6b7280">• Discover taste profile stays on-machine; YouTube touched only for a neutral name lookup</text>

  <!-- ⑧ arrow tunnel -> viewers -->
  <path d="M 833,396 V 552 H 235 V 562" fill="none" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-green)"/>

  <text x="922" y="654" text-anchor="end" font-size="8" fill="#9aa5b1">Quiddity Innovations © 2026 · cousin tier · API 8503 / UI 7843</text>
</svg>
