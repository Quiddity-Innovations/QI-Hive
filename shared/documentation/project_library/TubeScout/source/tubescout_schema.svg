<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 700" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="fk" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 9 3.5, 0 7" fill="#c2185b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="980" height="700" fill="#ffffff" rx="12"/>
  <text x="490" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">TubeScout — Database Schema (tubescout.db)</text>
  <text x="490" y="50" text-anchor="middle" font-size="11.5" fill="#64748b">Quiddity Innovations · YouTube Subscription Intelligence · 2026</text>
  <text x="490" y="66" text-anchor="middle" font-size="10" fill="#9aa5b1">SQLite · WAL · foreign_keys ON · schema_version v1 · 8 app tables · live row counts · PK = primary key · FK = foreign key</text>

  <!-- ══ LEGEND (top right) ══ -->
  <rect x="762" y="78" width="206" height="124" rx="7" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="865" y="96" text-anchor="middle" font-size="10" font-weight="700" fill="#1f2d3d">Legend</text>
  <rect x="772" y="104" width="14" height="10" rx="2" fill="#eafaf0" stroke="#2e7d32"/>
  <text x="792" y="113" font-size="9" fill="#374151">Core content tables</text>
  <rect x="772" y="121" width="14" height="10" rx="2" fill="#fff8e6" stroke="#b8860b"/>
  <text x="792" y="130" font-size="9" fill="#374151">Pipeline-output tables</text>
  <rect x="772" y="138" width="14" height="10" rx="2" fill="#f1f3f5" stroke="#9aa5b1"/>
  <text x="792" y="147" font-size="9" fill="#374151">Bookkeeping / kv</text>
  <rect x="772" y="155" width="14" height="10" rx="2" fill="#1f2d3d" stroke="#1f2d3d"/>
  <text x="792" y="164" font-size="9" fill="#374151">Title bar (table header)</text>
  <line x1="772" y1="180" x2="790" y2="180" stroke="#c2185b" stroke-width="1.6" marker-end="url(#fk)"/>
  <text x="796" y="184" font-size="9" fill="#374151">Foreign-key reference</text>

  <!-- ══ channels (core, green) ══ -->
  <rect x="20" y="90" width="262" height="220" rx="8" fill="#eafaf0" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="20" y="90" width="262" height="26" rx="8" fill="#1f2d3d"/>
  <text x="151" y="108" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">channels</text>
  <text x="32" y="134" font-size="10" fill="#1f2d3d">channel_id  (PK, text)</text>
  <text x="32" y="151" font-size="10" fill="#374151">title · description · thumbnail</text>
  <text x="32" y="168" font-size="10" fill="#374151">uploads_playlist</text>
  <text x="32" y="185" font-size="10" fill="#374151">topic (default 'other')</text>
  <text x="32" y="202" font-size="10" fill="#374151">priority (must_read|digest|mute)</text>
  <text x="32" y="219" font-size="10" fill="#374151">favorite · topic_manual · disabled</text>
  <text x="32" y="236" font-size="10" fill="#374151">subscribed · last_swept · added_at</text>
  <text x="32" y="258" font-size="9" fill="#5f8a66">816 subscribed rows · 66 favorited</text>
  <text x="32" y="274" font-size="8.5" fill="#9aa5b1">topics: lifestyle 228 · news 95 · software_dev 76</text>
  <text x="32" y="288" font-size="8.5" fill="#9aa5b1">… ai_ml 25 · travel 15 · retirement 25 (~3 'other')</text>
  <text x="32" y="302" font-size="8.5" fill="#9aa5b1">manual topic (topic_manual=1) never auto-reclassified</text>

  <!-- ══ videos (core, green) ══ -->
  <rect x="306" y="90" width="266" height="220" rx="8" fill="#eafaf0" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="306" y="90" width="266" height="26" rx="8" fill="#1f2d3d"/>
  <text x="439" y="108" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">videos</text>
  <text x="318" y="134" font-size="10" fill="#1f2d3d">video_id  (PK, text)</text>
  <text x="318" y="151" font-size="10" fill="#c2185b">channel_id → channels.channel_id</text>
  <text x="318" y="168" font-size="10" fill="#374151">title · description · url · thumbnail</text>
  <text x="318" y="185" font-size="10" fill="#374151">published_at · duration · discovered_at</text>
  <text x="318" y="202" font-size="10" fill="#374151">has_captions (-1|0|1|2)</text>
  <text x="318" y="219" font-size="10" fill="#374151">transcript_status · summary_status</text>
  <text x="318" y="236" font-size="10" fill="#374151">score_status · sweep_run_id</text>
  <text x="318" y="253" font-size="10" fill="#374151">dup_of → videos.video_id · dup_count</text>
  <text x="318" y="275" font-size="9" fill="#5f8a66">4,014 rows</text>
  <text x="318" y="290" font-size="8.5" fill="#9aa5b1">transcript_status: done 151 · none 38 · pending 3,824</text>
  <text x="318" y="303" font-size="8.5" fill="#9aa5b1">idx on channel_id, published_at · self-FK = cross-channel dup</text>

  <!-- FK videos.channel_id -> channels -->
  <line x1="306" y1="151" x2="284" y2="151" stroke="#c2185b" stroke-width="1.6" marker-end="url(#fk)"/>
  <!-- self FK dup_of -->
  <path d="M 560 253 C 588 253 588 130 478 116" fill="none" stroke="#c2185b" stroke-width="1.3" marker-end="url(#fk)"/>

  <!-- ══ sweeps (bookkeeping) ══ -->
  <rect x="596" y="90" width="262" height="148" rx="8" fill="#f1f3f5" stroke="#9aa5b1" stroke-width="1.5"/>
  <rect x="596" y="90" width="262" height="26" rx="8" fill="#1f2d3d"/>
  <text x="727" y="108" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">sweeps</text>
  <text x="608" y="134" font-size="10" fill="#1f2d3d">run_id  (PK, autoincrement)</text>
  <text x="608" y="151" font-size="10" fill="#374151">started_at · finished_at</text>
  <text x="608" y="168" font-size="10" fill="#374151">new_videos · channels_swept</text>
  <text x="608" y="185" font-size="10" fill="#374151">status (running|done) · note</text>
  <text x="608" y="207" font-size="9" fill="#6b7280">15 rows</text>
  <text x="608" y="222" font-size="8.5" fill="#9aa5b1">last: #15 — 364 new / 811 swept (2026-06-22)</text>

  <!-- videos.sweep_run_id -> sweeps (soft ref, not enforced FK) -->
  <line x1="596" y1="160" x2="574" y2="222" stroke="#c2185b" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#fk)"/>
  <text x="582" y="200" font-size="7.5" fill="#9aa5b1" transform="rotate(-70 582 200)">sweep_run_id (soft)</text>

  <!-- ══ PIPELINE OUTPUTS band ══ -->
  <text x="22" y="338" font-size="9.5" fill="#9aa5b1" font-weight="700" letter-spacing="0.5">PIPELINE OUTPUTS — one row per video (PK = video_id, FK → videos)</text>

  <!-- transcripts -->
  <rect x="20" y="348" width="226" height="128" rx="8" fill="#fff8e6" stroke="#b8860b" stroke-width="1.5"/>
  <rect x="20" y="348" width="226" height="26" rx="8" fill="#1f2d3d"/>
  <text x="133" y="366" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">transcripts</text>
  <text x="32" y="392" font-size="10" fill="#1f2d3d">video_id  (PK)</text>
  <text x="32" y="409" font-size="10" fill="#c2185b">video_id → videos.video_id</text>
  <text x="32" y="426" font-size="10" fill="#7a5b06">lang · text</text>
  <text x="32" y="443" font-size="10" fill="#7a5b06">fetched_at</text>
  <text x="32" y="464" font-size="9" fill="#9a7a2e">151 rows</text>

  <!-- summaries -->
  <rect x="262" y="348" width="226" height="128" rx="8" fill="#fff8e6" stroke="#b8860b" stroke-width="1.5"/>
  <rect x="262" y="348" width="226" height="26" rx="8" fill="#1f2d3d"/>
  <text x="375" y="366" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">summaries</text>
  <text x="274" y="392" font-size="10" fill="#1f2d3d">video_id  (PK)</text>
  <text x="274" y="409" font-size="10" fill="#c2185b">video_id → videos.video_id</text>
  <text x="274" y="426" font-size="10" fill="#7a5b06">headline · news_card</text>
  <text x="274" y="443" font-size="10" fill="#7a5b06">engine (nexus|fallback) · created_at</text>
  <text x="274" y="464" font-size="9" fill="#9a7a2e">4,014 rows — nexus 2,374 · fallback 1,640</text>

  <!-- scores -->
  <rect x="504" y="348" width="226" height="128" rx="8" fill="#fff8e6" stroke="#b8860b" stroke-width="1.5"/>
  <rect x="504" y="348" width="226" height="26" rx="8" fill="#1f2d3d"/>
  <text x="617" y="366" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">scores</text>
  <text x="516" y="392" font-size="10" fill="#1f2d3d">video_id  (PK)</text>
  <text x="516" y="409" font-size="10" fill="#c2185b">video_id → videos.video_id</text>
  <text x="516" y="426" font-size="10" fill="#7a5b06">implement_score · rationale · tags</text>
  <text x="516" y="443" font-size="10" fill="#7a5b06">brain_logged · scout_pushed · created_at</text>
  <text x="516" y="464" font-size="9" fill="#9a7a2e">439 rows — ai_ml/software_dev, ≥7.0 → QI Brain</text>

  <!-- FK lines to videos (upward) -->
  <path d="M 133 348 V 320 H 360 V 312" fill="none" stroke="#c2185b" stroke-width="1.3" marker-end="url(#fk)"/>
  <line x1="375" y1="348" x2="375" y2="312" stroke="#c2185b" stroke-width="1.3" marker-end="url(#fk)"/>
  <path d="M 617 348 V 320 H 470 V 312" fill="none" stroke="#c2185b" stroke-width="1.3" marker-end="url(#fk)"/>

  <!-- ══ AUX band ══ -->
  <text x="22" y="510" font-size="9.5" fill="#9aa5b1" font-weight="700" letter-spacing="0.5">AUXILIARY</text>

  <!-- recommendations -->
  <rect x="20" y="520" width="300" height="138" rx="8" fill="#fff8e6" stroke="#b8860b" stroke-width="1.5"/>
  <rect x="20" y="520" width="300" height="26" rx="8" fill="#1f2d3d"/>
  <text x="170" y="538" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">recommendations</text>
  <text x="32" y="564" font-size="10" fill="#1f2d3d">rec_id  (PK, autoincrement)</text>
  <text x="32" y="581" font-size="10" fill="#374151">channel_id · name · reason · url</text>
  <text x="32" y="598" font-size="10" fill="#374151">thumbnail · topic</text>
  <text x="32" y="615" font-size="10" fill="#374151">dismissed · added · created_at</text>
  <text x="32" y="637" font-size="9" fill="#9a7a2e">6 rows — Discover suggestions</text>
  <text x="32" y="651" font-size="8.5" fill="#9aa5b1">created on demand by recommend.ensure_schema()</text>

  <!-- state -->
  <rect x="340" y="520" width="226" height="138" rx="8" fill="#f1f3f5" stroke="#9aa5b1" stroke-width="1.5"/>
  <rect x="340" y="520" width="226" height="26" rx="8" fill="#1f2d3d"/>
  <text x="453" y="538" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">state</text>
  <text x="352" y="564" font-size="10" fill="#1f2d3d">key  (PK, text)</text>
  <text x="352" y="581" font-size="10" fill="#374151">value (text)</text>
  <text x="352" y="603" font-size="9" fill="#6b7280">1 row</text>
  <text x="352" y="618" font-size="8.5" fill="#9aa5b1">key-value store; holds</text>
  <text x="352" y="631" font-size="8.5" fill="#9aa5b1">transcripts_blocked_until (IP-block cooldown)</text>

  <!-- schema_version -->
  <rect x="586" y="520" width="272" height="138" rx="8" fill="#f1f3f5" stroke="#9aa5b1" stroke-width="1.5"/>
  <rect x="586" y="520" width="272" height="26" rx="8" fill="#1f2d3d"/>
  <text x="722" y="538" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">schema_version</text>
  <text x="598" y="564" font-size="10" fill="#1f2d3d">version (integer)</text>
  <text x="598" y="586" font-size="9" fill="#6b7280">1 row — v1</text>
  <text x="598" y="601" font-size="8.5" fill="#9aa5b1">post-v1 columns added by idempotent _migrate()</text>
  <text x="598" y="615" font-size="8.5" fill="#9aa5b1">ALTERs: favorite · topic_manual · disabled · dup_of · dup_count</text>
  <text x="598" y="635" font-size="8.5" fill="#9aa5b1">(sqlite_sequence — SQLite internal, not shown)</text>

  <text x="958" y="680" text-anchor="end" font-size="8" fill="#9aa5b1">Quiddity Innovations © 2026 · row counts captured 2026-06-24</text>
</svg>
