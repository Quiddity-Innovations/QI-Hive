<svg viewBox="0 0 1200 880" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="fk" markerWidth="11" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="link" markerWidth="11" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Background + Title -->
  <rect x="0" y="0" width="1200" height="880" fill="#ffffff" rx="14"/>
  <text x="600" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">MapSnap — Data Model</text>
  <text x="600" y="58" text-anchor="middle" font-size="12.5" fill="#64748b">Quiddity Innovations · Proof of Concept · 2026</text>

  <!-- ══ LEGEND (top right) ══ -->
  <rect x="952" y="76" width="236" height="172" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="1070" y="95" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Legend</text>
  <rect x="962" y="103" width="15" height="11" rx="2" fill="#eafaf0" stroke="#2e7d32"/>
  <text x="984" y="112" font-size="9.5" fill="#374151">SQLite app store (live tables)</text>
  <rect x="962" y="121" width="15" height="11" rx="2" fill="#fff8e6" stroke="#b8860b"/>
  <text x="984" y="130" font-size="9.5" fill="#374151">Per-profile JSON sidecar</text>
  <rect x="962" y="139" width="15" height="11" rx="2" fill="#f1f3f5" stroke="#9aa5b1" stroke-dasharray="4,2"/>
  <text x="984" y="148" font-size="9.5" fill="#374151">External / read-only sources</text>
  <line x1="962" y1="165" x2="980" y2="165" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#fk)"/>
  <text x="986" y="168" font-size="9.5" fill="#374151">Relational FK (1 — *)</text>
  <line x1="962" y1="183" x2="980" y2="183" stroke="#475569" stroke-width="1.6" stroke-dasharray="4,2" marker-end="url(#link)"/>
  <text x="986" y="186" font-size="9.5" fill="#374151">Join by table name (not FK)</text>
  <text x="1070" y="208" text-anchor="middle" font-size="8.5" fill="#94a3b8">App store = the only DB MapSnap owns.</text>
  <text x="1070" y="220" text-anchor="middle" font-size="8.5" fill="#94a3b8">Profile state = JSON sidecars on disk,</text>
  <text x="1070" y="232" text-anchor="middle" font-size="8.5" fill="#94a3b8">keyed to schema.json by table name.</text>
  <text x="1070" y="244" text-anchor="middle" font-size="8" fill="#cbd5e1">Quiddity Innovations © 2026</text>

  <!-- ══ APP STORE band ══ -->
  <rect x="40" y="80" width="888" height="222" rx="10" fill="#eafaf0" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="56" y="102" font-size="12" font-weight="700" fill="#14532d" letter-spacing="1">APPLICATION STORE — mapsnap_users.db (SQLite)</text>

  <!-- users -->
  <rect x="60" y="114" width="252" height="178" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="1.6"/>
  <rect x="60" y="114" width="252" height="28" rx="8" fill="#eafaf0" stroke="#2e7d32"/>
  <text x="186" y="133" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">users</text>
  <text x="74" y="160" font-size="11.5" fill="#1e293b">PK  id  INTEGER</text>
  <text x="74" y="179" font-size="11.5" fill="#1e293b">username  TEXT UNIQUE</text>
  <text x="74" y="198" font-size="11.5" fill="#1e293b">password_hash  TEXT (pbkdf2)</text>
  <text x="74" y="217" font-size="11.5" fill="#1e293b">role  TEXT (viewer…admin)</text>
  <text x="74" y="236" font-size="11.5" fill="#1e293b">tabs_override  TEXT</text>
  <text x="74" y="255" font-size="11.5" fill="#1e293b">features_override  TEXT</text>
  <text x="74" y="274" font-size="11.5" fill="#1e293b">must_change_pw · created_at</text>

  <!-- sessions -->
  <rect x="430" y="114" width="240" height="120" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="1.6"/>
  <rect x="430" y="114" width="240" height="28" rx="8" fill="#eafaf0" stroke="#2e7d32"/>
  <text x="550" y="133" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">sessions</text>
  <text x="444" y="160" font-size="11.5" fill="#1e293b">PK  token  TEXT</text>
  <text x="444" y="179" font-size="11.5" fill="#1e293b">FK  user_id → users.id</text>
  <text x="444" y="198" font-size="11.5" fill="#1e293b">expires_at  INTEGER (7-day TTL)</text>
  <text x="444" y="221" font-size="10.5" fill="#64748b">ON DELETE CASCADE</text>

  <!-- users 1—* sessions -->
  <line x1="312" y1="174" x2="430" y2="174" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#fk)"/>
  <text x="371" y="166" text-anchor="middle" font-size="10.5" fill="#1d4ed8">1 — *</text>

  <rect x="700" y="150" width="210" height="116" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-dasharray="4,2"/>
  <text x="805" y="170" text-anchor="middle" font-size="11.5" fill="#475569" font-weight="600">permissions.json</text>
  <text x="714" y="190" font-size="10.5" fill="#64748b">roles → tabs + features</text>
  <text x="714" y="208" font-size="10.5" fill="#64748b">per-user override can only</text>
  <text x="714" y="226" font-size="10.5" fill="#64748b">NARROW a role (never widen)</text>
  <text x="714" y="248" font-size="10.5" fill="#64748b">auth_mode: login | os_user</text>

  <!-- ══ KNOWLEDGE BUNDLE band ══ -->
  <text x="56" y="338" font-size="12" font-weight="700" fill="#9a3412" letter-spacing="1">PER-PROFILE KNOWLEDGE BUNDLE — Product/&lt;profile&gt;/ (engine-agnostic JSON sidecars)</text>

  <!-- schema.json (center root) -->
  <rect x="430" y="358" width="340" height="222" rx="8" fill="#fff8e6" stroke="#b8860b" stroke-width="2"/>
  <rect x="430" y="358" width="340" height="28" rx="8" fill="#fdecc8" stroke="#b8860b"/>
  <text x="600" y="377" text-anchor="middle" font-size="13" font-weight="700" fill="#713f12">schema.json  (Layer 1 — root)</text>
  <text x="444" y="404" font-size="11.5" fill="#1e293b" font-weight="600">metadata { db_type, server, database,</text>
  <text x="444" y="421" font-size="11.5" fill="#1e293b" font-weight="600">  object_count, table_count, view_count,</text>
  <text x="444" y="438" font-size="11.5" fill="#1e293b" font-weight="600">  extracted_date }</text>
  <text x="444" y="462" font-size="11.5" fill="#1e293b" font-weight="600">objects[] {</text>
  <text x="458" y="480" font-size="11" fill="#334155">name · object_type (Table/View/Collection)</text>
  <text x="458" y="497" font-size="11" fill="#334155">module · super_module · referencing_modules</text>
  <text x="458" y="514" font-size="11" fill="#334155">columns[] { name, data_type, length, scale,</text>
  <text x="472" y="530" font-size="11" fill="#334155">is_pk, nullable, default, label }</text>
  <text x="458" y="547" font-size="11" fill="#334155">foreign_keys_out[] · foreign_keys_in[]</text>
  <text x="444" y="572" font-size="11.5" fill="#1e293b" font-weight="600">}  ← soft (inferred) FKs added here</text>

  <!-- annotations.json -->
  <rect x="60" y="362" width="320" height="82" rx="8" fill="#fff8e6" stroke="#b8860b" stroke-width="1.5"/>
  <rect x="60" y="362" width="320" height="26" rx="8" fill="#fdecc8" stroke="#b8860b"/>
  <text x="220" y="380" text-anchor="middle" font-size="12.5" font-weight="700" fill="#713f12">annotations.json  (L2)</text>
  <text x="74" y="404" font-size="11" fill="#334155">per table: purpose · role · centrality</text>
  <text x="74" y="422" font-size="11" fill="#334155">join hints  → injected into AI prompt</text>
  <text x="74" y="438" font-size="10" fill="#a16207">build_annotations.py (no LLM, structural)</text>

  <!-- BU_Catalog.json -->
  <rect x="60" y="462" width="320" height="82" rx="8" fill="#fff8e6" stroke="#b8860b" stroke-width="1.5"/>
  <rect x="60" y="462" width="320" height="26" rx="8" fill="#fdecc8" stroke="#b8860b"/>
  <text x="220" y="480" text-anchor="middle" font-size="12.5" font-weight="700" fill="#713f12">BU_Catalog.json  (L3)</text>
  <text x="74" y="504" font-size="11" fill="#334155">business-name values: DocTypes,</text>
  <text x="74" y="522" font-size="11" fill="#334155">keyword types (e.g. "Check Image")</text>
  <text x="74" y="538" font-size="10" fill="#a16207">OnBase only · build_live_catalog / .expk</text>

  <!-- profile.json -->
  <rect x="820" y="362" width="320" height="96" rx="8" fill="#fff8e6" stroke="#b8860b" stroke-width="1.5"/>
  <rect x="820" y="362" width="320" height="26" rx="8" fill="#fdecc8" stroke="#b8860b"/>
  <text x="980" y="380" text-anchor="middle" font-size="12.5" font-weight="700" fill="#713f12">profile.json  (L4)</text>
  <text x="834" y="404" font-size="11" fill="#334155">per table: row_count · kind (lookup/fact)</text>
  <text x="834" y="421" font-size="11" fill="#334155">per col: distinct · null% · min/max ·</text>
  <text x="834" y="438" font-size="11" fill="#334155">semantic_type · MASKED sample_values</text>
  <text x="834" y="453" font-size="10" fill="#a16207">profile_schema.py · read-only · capped</text>

  <!-- .index/ ChromaDB -->
  <rect x="820" y="478" width="320" height="82" rx="8" fill="#fff8e6" stroke="#b8860b" stroke-width="1.5"/>
  <rect x="820" y="478" width="320" height="26" rx="8" fill="#fdecc8" stroke="#b8860b"/>
  <text x="980" y="496" text-anchor="middle" font-size="12.5" font-weight="700" fill="#713f12">.index/  (L5 — ChromaDB)</text>
  <text x="834" y="520" font-size="11" fill="#334155">one nomic-embed-text vector per table</text>
  <text x="834" y="537" font-size="11" fill="#334155">synthesized from the sidecars (local)</text>
  <text x="834" y="552" font-size="10" fill="#a16207">build_embeddings.py · source-hash gated</text>

  <!-- mapsnap_meta.json -->
  <rect x="430" y="612" width="340" height="124" rx="8" fill="#fff1e6" stroke="#ea580c" stroke-width="1.6" stroke-dasharray="6,3"/>
  <rect x="430" y="612" width="340" height="26" rx="8" fill="#ffe4cc" stroke="#ea580c"/>
  <text x="600" y="630" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9a3412">mapsnap_meta.json  (governance + UI)</text>
  <text x="444" y="654" font-size="11" fill="#334155">display_name · version · sort_order · fk_visibility</text>
  <text x="444" y="672" font-size="11" fill="#334155">ai.data_policy (local_only / cloud_metadata_only …)</text>
  <text x="444" y="690" font-size="11" fill="#334155">ai.column_classes { col → pii class }  ← drives masking</text>
  <text x="444" y="708" font-size="11" fill="#334155">ai.enrichment grid (layer × trigger) · ai.locked</text>
  <text x="444" y="727" font-size="10.5" fill="#64748b">read/written via /api/schema-meta (lock-guarded)</text>

  <!-- side files -->
  <rect x="60" y="612" width="320" height="124" rx="8" fill="#fff8e6" stroke="#b8860b" stroke-width="1.4"/>
  <rect x="60" y="612" width="320" height="26" rx="8" fill="#fdecc8" stroke="#b8860b"/>
  <text x="220" y="630" text-anchor="middle" font-size="12" font-weight="700" fill="#713f12">enrich_status.json · query_examples.json</text>
  <text x="74" y="654" font-size="11" fill="#334155">enrich_status: per-layer progress / hashes</text>
  <text x="74" y="672" font-size="11" fill="#334155">query_examples (D): verified { q, sql, uses }</text>
  <text x="74" y="690" font-size="11" fill="#334155">Documents/index.json: RAG doc chunks</text>
  <text x="74" y="710" font-size="10.5" fill="#64748b">all local; self-improving few-shot</text>

  <!-- source artifacts (external / planned dashed) -->
  <rect x="820" y="612" width="320" height="124" rx="8" fill="#f1f3f5" stroke="#9aa5b1" stroke-width="1.4" stroke-dasharray="5,3"/>
  <rect x="820" y="612" width="320" height="26" rx="8" fill="#e9edf1" stroke="#9aa5b1"/>
  <text x="980" y="630" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">source artifacts (external / import)</text>
  <text x="834" y="654" font-size="11" fill="#334155">CSV import → Objects / Columns / PK / FK</text>
  <text x="834" y="672" font-size="11" fill="#334155">DDL import (CREATE TABLE …)</text>
  <text x="834" y="690" font-size="11" fill="#334155">OnBase .expk / .spk (ZIP + XML config)</text>
  <text x="834" y="708" font-size="11" fill="#334155">schema.YYYYMMDD_*.bak (snapshots)</text>
  <text x="834" y="727" font-size="10.5" fill="#64748b">→ all normalise into schema.json</text>

  <!-- relationships: schema.json <-> sidecars (keyed by table name, dashed) -->
  <line x1="380" y1="401" x2="430" y2="420" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#link)"/>
  <line x1="380" y1="492" x2="430" y2="465" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#link)"/>
  <line x1="820" y1="405" x2="770" y2="430" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#link)"/>
  <line x1="820" y1="512" x2="770" y2="492" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#link)"/>
  <line x1="600" y1="612" x2="600" y2="582" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#link)"/>
  <text x="405" y="394" text-anchor="middle" font-size="9.5" fill="#475569">by table name</text>
  <text x="795" y="398" text-anchor="middle" font-size="9.5" fill="#475569">by table name</text>

  <!-- ══ External source DBs (planned/external dashed band) ══ -->
  <rect x="40" y="762" width="1100" height="94" rx="10" fill="#f1f3f5" stroke="#9aa5b1" stroke-width="1.4" stroke-dasharray="6,3"/>
  <text x="56" y="784" font-size="12" font-weight="700" fill="#334155" letter-spacing="1">EXTERNAL SOURCE DATABASES (read-only — never stored)</text>
  <text x="62" y="806" font-size="11" fill="#475569">SQL Server (OnBase hsi · Jenzabar) · PostgreSQL · MySQL · Oracle · SQLite · ChromaDB / Qdrant</text>
  <text x="62" y="824" font-size="10.5" fill="#64748b">MapSnap stores only the extracted STRUCTURE + masked metadata — regulated rows stay in the source.</text>
  <text x="62" y="842" font-size="10.5" fill="#64748b">'enriched_from' in metadata links a profile to the curated profile it was seeded from.</text>
</svg>
