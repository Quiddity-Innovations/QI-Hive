<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="arr-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4 L0,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arr-purple" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4 L0,8 Z" fill="#a855f7"/>
    </marker>
    <marker id="arr-orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4 L0,8 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-pink" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4 L0,8 Z" fill="#be185d"/>
    </marker>
  </defs>

  <!-- Background + Title -->
  <rect x="0" y="0" width="1200" height="900" fill="#ffffff" rx="14"/>
  <text x="600" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">MapSnap — System Architecture</text>
  <text x="600" y="58" text-anchor="middle" font-size="12.5" fill="#64748b">Quiddity Innovations · Proof of Concept · 2026</text>

  <!-- ══ LEGEND (top right) ══ -->
  <rect x="952" y="74" width="236" height="196" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="1070" y="93" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Legend</text>
  <rect x="962" y="101" width="15" height="11" rx="2" fill="#eafaf0" stroke="#2e7d32"/>
  <text x="984" y="110" font-size="9.5" fill="#374151">Live / Active</text>
  <rect x="962" y="119" width="15" height="11" rx="2" fill="#fff8e6" stroke="#b8860b"/>
  <text x="984" y="128" font-size="9.5" fill="#374151">Built · Partial / Optional</text>
  <rect x="962" y="137" width="15" height="11" rx="2" fill="#f1f3f5" stroke="#9aa5b1"/>
  <text x="984" y="146" font-size="9.5" fill="#374151">Planned</text>
  <rect x="962" y="155" width="15" height="11" rx="2" fill="#fff1e6" stroke="#ea580c" stroke-dasharray="3,2"/>
  <text x="984" y="164" font-size="9.5" fill="#374151">Guarded / Caution</text>
  <rect x="962" y="173" width="15" height="11" rx="2" fill="#1f2d3d" stroke="#1f2d3d"/>
  <text x="984" y="182" font-size="9.5" fill="#374151">Core server</text>
  <line x1="962" y1="199" x2="980" y2="199" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="986" y="202" font-size="9.5" fill="#374151">Solid = request flow</text>
  <line x1="962" y1="217" x2="980" y2="217" stroke="#2e7d32" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arr-green)"/>
  <text x="986" y="220" font-size="9.5" fill="#374151">Dashed = guarded egress</text>
  <text x="1070" y="240" text-anchor="middle" font-size="8.5" fill="#94a3b8">port 9876 · regulated rows</text>
  <text x="1070" y="252" text-anchor="middle" font-size="8.5" fill="#94a3b8">never leave the box by default</text>
  <text x="1070" y="264" text-anchor="middle" font-size="8" fill="#cbd5e1">Quiddity Innovations © 2026</text>

  <!-- ══ ACCESS / CLIENT ══ -->
  <rect x="40" y="80" width="892" height="92" rx="10" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="56" y="102" font-size="11" font-weight="700" fill="#3730a3" letter-spacing="1">ACCESS / CLIENT</text>
  <rect x="58" y="114" width="200" height="46" rx="8" fill="#eafaf0" stroke="#2e7d32"/>
  <text x="158" y="135" text-anchor="middle" font-size="12.5" fill="#14532d">Browser (local user)</text>
  <text x="158" y="151" text-anchor="middle" font-size="10" fill="#2e7d32">single-page HTML browser</text>
  <rect x="270" y="114" width="280" height="46" rx="8" fill="#eafaf0" stroke="#2e7d32"/>
  <text x="410" y="133" text-anchor="middle" font-size="12" fill="#14532d">Cloudflare named tunnel · QI_MapSnapTunnel</text>
  <text x="410" y="151" text-anchor="middle" font-size="10" fill="#2e7d32">mapsnap.quiddityinnovations.com</text>
  <rect x="562" y="114" width="180" height="46" rx="8" fill="#fff8e6" stroke="#b8860b"/>
  <text x="652" y="133" text-anchor="middle" font-size="12" fill="#713f12">Login auth · roles · tabs</text>
  <text x="652" y="151" text-anchor="middle" font-size="10" fill="#b8860b">auth.py · mapsnap_users.db</text>
  <rect x="754" y="114" width="166" height="46" rx="8" fill="#eafaf0" stroke="#2e7d32"/>
  <text x="837" y="133" text-anchor="middle" font-size="12" fill="#14532d">QI_MapSnap service</text>
  <text x="837" y="151" text-anchor="middle" font-size="10" fill="#2e7d32">NSSM · auto-start · logs</text>

  <line x1="486" y1="172" x2="486" y2="194" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ══ HTTP SERVER (core, dark navy) ══ -->
  <rect x="40" y="196" width="1148" height="124" rx="10" fill="#1f2d3d" stroke="#0f172a" stroke-width="2"/>
  <text x="56" y="220" font-size="13" font-weight="700" fill="#ffffff">server.py — stdlib ThreadingHTTPServer  ·  127.0.0.1:9876  ·  ~50 /api/* routes</text>
  <rect x="58" y="232" width="150" height="34" rx="7" fill="#27384b" stroke="#475569"/>
  <text x="133" y="254" text-anchor="middle" font-size="11.5" fill="#e2e8f0">/api/schema</text>
  <rect x="220" y="232" width="150" height="34" rx="7" fill="#27384b" stroke="#475569"/>
  <text x="295" y="254" text-anchor="middle" font-size="11.5" fill="#e2e8f0">/api/extract</text>
  <rect x="382" y="232" width="150" height="34" rx="7" fill="#27384b" stroke="#475569"/>
  <text x="457" y="254" text-anchor="middle" font-size="11.5" fill="#e2e8f0">/api/chat (SSE)</text>
  <rect x="544" y="232" width="150" height="34" rx="7" fill="#27384b" stroke="#475569"/>
  <text x="619" y="254" text-anchor="middle" font-size="11.5" fill="#e2e8f0">/api/nl2sql</text>
  <rect x="706" y="232" width="150" height="34" rx="7" fill="#27384b" stroke="#475569"/>
  <text x="781" y="254" text-anchor="middle" font-size="11.5" fill="#e2e8f0">/api/run-sql</text>
  <rect x="868" y="232" width="320" height="34" rx="7" fill="#27384b" stroke="#475569"/>
  <text x="1028" y="254" text-anchor="middle" font-size="11.5" fill="#e2e8f0">/api/index-documents · parse-config · auth/*</text>
  <rect x="58" y="276" width="555" height="34" rx="7" fill="#27384b" stroke="#475569"/>
  <text x="335" y="297" text-anchor="middle" font-size="11" fill="#e2e8f0">retrieval: find_relevant_tables + semantic_index.query (keyword + hybrid)</text>
  <rect x="625" y="276" width="563" height="34" rx="7" fill="#27384b" stroke="#475569"/>
  <text x="906" y="297" text-anchor="middle" font-size="11" fill="#e2e8f0">prompt build: system prompt + annotations + profile + catalog blocks</text>

  <line x1="486" y1="320" x2="486" y2="342" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="497" y="336" font-size="9.5" fill="#475569">cloud calls only</text>

  <!-- ══ GUARDRAIL ══ -->
  <rect x="40" y="344" width="1148" height="74" rx="10" fill="#fff1e6" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="7,3"/>
  <text x="56" y="367" font-size="12.5" font-weight="700" fill="#9a3412">EGRESS GUARDRAIL — guardrail.py  ·  single chokepoint  ·  fail-safe local_only</text>
  <text x="62" y="390" font-size="11.5" fill="#7c2d12">guard_cloud_egress · strip_local_only · scrub regulated values · per-profile data_policy · audit log</text>
  <rect x="858" y="356" width="320" height="50" rx="8" fill="#ffffff" stroke="#ea580c" stroke-dasharray="4,2"/>
  <text x="1018" y="376" text-anchor="middle" font-size="11" fill="#9a3412">local_only ✗ blocks  ·  cloud_metadata_only</text>
  <text x="1018" y="392" text-anchor="middle" font-size="11" fill="#9a3412">sends schema + SQL only, masks values</text>

  <!-- ══ LOCAL / CLOUD AI ══ -->
  <rect x="40" y="442" width="566" height="120" rx="10" fill="#eafaf0" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="56" y="465" font-size="12.5" font-weight="700" fill="#14532d">LOCAL AI (default — nothing leaves)</text>
  <rect x="58" y="476" width="250" height="34" rx="7" fill="#ffffff" stroke="#2e7d32"/>
  <text x="183" y="498" text-anchor="middle" font-size="11.5" fill="#15803d">Ollama LLM (qwen2.5-coder · sqlcoder)</text>
  <rect x="320" y="476" width="266" height="34" rx="7" fill="#ffffff" stroke="#2e7d32"/>
  <text x="453" y="498" text-anchor="middle" font-size="11.5" fill="#15803d">nomic-embed-text (local embeddings)</text>
  <rect x="58" y="518" width="528" height="34" rx="7" fill="#ffffff" stroke="#2e7d32"/>
  <text x="322" y="540" text-anchor="middle" font-size="11.5" fill="#15803d">verified-query library · query_library.py (local few-shot)</text>

  <rect x="622" y="442" width="566" height="120" rx="10" fill="#fff8e6" stroke="#b8860b" stroke-width="1.5"/>
  <text x="638" y="465" font-size="12.5" font-weight="700" fill="#713f12">CLOUD AI (optional · only past the guardrail)</text>
  <rect x="640" y="476" width="250" height="34" rx="7" fill="#ffffff" stroke="#b8860b"/>
  <text x="765" y="498" text-anchor="middle" font-size="11.5" fill="#92400e">OpenRouter (OpenAI-compatible)</text>
  <rect x="902" y="476" width="270" height="34" rx="7" fill="#ffffff" stroke="#b8860b"/>
  <text x="1037" y="498" text-anchor="middle" font-size="11.5" fill="#92400e">Direct provider APIs (frontier)</text>
  <rect x="640" y="518" width="532" height="34" rx="7" fill="#ffffff" stroke="#b8860b"/>
  <text x="906" y="540" text-anchor="middle" font-size="11" fill="#92400e">reasons over SCHEMA + writes SQL · never sees regulated row values</text>

  <line x1="300" y1="418" x2="300" y2="440" stroke="#2e7d32" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <line x1="905" y1="418" x2="905" y2="440" stroke="#b8860b" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arr-orange)"/>

  <!-- ══ ENRICHMENT ══ -->
  <rect x="40" y="584" width="724" height="200" rx="10" fill="#fff8e6" stroke="#b8860b" stroke-width="1.5"/>
  <text x="56" y="607" font-size="12.5" font-weight="700" fill="#713f12">ENRICHMENT — enrich.py  ·  idempotent · best-effort · db_type dispatch</text>
  <rect x="56" y="620" width="338" height="36" rx="7" fill="#ffffff" stroke="#b8860b"/>
  <text x="225" y="637" text-anchor="middle" font-size="11" fill="#713f12">L1 structure — extract_schema · db_extractors</text>
  <text x="225" y="650" text-anchor="middle" font-size="10" fill="#a16207">+ infer_soft_fks → schema.json</text>
  <rect x="410" y="620" width="338" height="36" rx="7" fill="#ffffff" stroke="#b8860b"/>
  <text x="579" y="637" text-anchor="middle" font-size="11" fill="#713f12">L2 annotations — build_annotations.py</text>
  <text x="579" y="650" text-anchor="middle" font-size="10" fill="#a16207">→ annotations.json (in prompt)</text>
  <rect x="56" y="664" width="338" height="36" rx="7" fill="#ffffff" stroke="#b8860b"/>
  <text x="225" y="681" text-anchor="middle" font-size="11" fill="#713f12">L3 catalog — build_live_catalog / .expk</text>
  <text x="225" y="694" text-anchor="middle" font-size="10" fill="#a16207">→ BU_Catalog.json (DocTypes)</text>
  <rect x="410" y="664" width="338" height="36" rx="7" fill="#ffffff" stroke="#b8860b"/>
  <text x="579" y="681" text-anchor="middle" font-size="11" fill="#713f12">L4 profiling — profile_schema.py</text>
  <text x="579" y="694" text-anchor="middle" font-size="10" fill="#a16207">→ profile.json (PII-masked samples)</text>
  <rect x="56" y="708" width="692" height="36" rx="7" fill="#ffffff" stroke="#b8860b"/>
  <text x="402" y="725" text-anchor="middle" font-size="11" fill="#713f12">L5 semantic — semantic_index.py / build_embeddings.py → ChromaDB .index/ (local)</text>
  <text x="402" y="738" text-anchor="middle" font-size="10" fill="#a16207">triggers: /api/extract · /api/index-documents · /api/parse-config</text>
  <text x="56" y="766" font-size="10" fill="#a16207">document_indexer.py → Documents/index.json (RAG)   ·   PII auto-detect → mapsnap_meta.json ai.column_classes</text>

  <!-- ══ PER-PROFILE STORE ══ -->
  <rect x="784" y="584" width="404" height="200" rx="10" fill="#f1f3f5" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="800" y="607" font-size="12.5" font-weight="700" fill="#334155">PER-PROFILE STORE — Product/&lt;profile&gt;/ (sidecars)</text>
  <rect x="800" y="620" width="174" height="32" rx="6" fill="#ffffff" stroke="#9aa5b1"/>
  <text x="887" y="640" text-anchor="middle" font-size="11" fill="#334155">schema.json</text>
  <rect x="990" y="620" width="182" height="32" rx="6" fill="#ffffff" stroke="#9aa5b1"/>
  <text x="1081" y="640" text-anchor="middle" font-size="11" fill="#334155">annotations.json</text>
  <rect x="800" y="658" width="174" height="32" rx="6" fill="#ffffff" stroke="#9aa5b1"/>
  <text x="887" y="678" text-anchor="middle" font-size="11" fill="#334155">BU_Catalog.json</text>
  <rect x="990" y="658" width="182" height="32" rx="6" fill="#ffffff" stroke="#9aa5b1"/>
  <text x="1081" y="678" text-anchor="middle" font-size="11" fill="#334155">profile.json</text>
  <rect x="800" y="696" width="174" height="32" rx="6" fill="#ffffff" stroke="#9aa5b1"/>
  <text x="887" y="716" text-anchor="middle" font-size="11" fill="#334155">.index/ (ChromaDB)</text>
  <rect x="990" y="696" width="182" height="32" rx="6" fill="#ffffff" stroke="#9aa5b1"/>
  <text x="1081" y="716" text-anchor="middle" font-size="11" fill="#334155">mapsnap_meta.json</text>
  <text x="800" y="746" font-size="10" fill="#475569">+ enrich_status.json · query_examples.json · Documents/</text>
  <text x="800" y="762" font-size="10" fill="#475569">App auth store: mapsnap_users.db (SQLite — users + sessions)</text>

  <line x1="990" y1="712" x2="766" y2="712" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="878" y="706" text-anchor="middle" font-size="9.5" fill="#475569">sidecars feed retrieval</text>

  <!-- ══ SOURCE DBs ══ -->
  <rect x="40" y="800" width="1148" height="74" rx="10" fill="#fdf2f8" stroke="#be185d" stroke-width="1.5"/>
  <text x="56" y="823" font-size="12.5" font-weight="700" fill="#9d174d">SOURCE DATABASES (read-only) — live extract via db_extractors / extract_schema · CSV &amp; DDL import</text>
  <text x="62" y="847" font-size="11.5" fill="#831843">SQL Server (OnBase hsi · Jenzabar) · PostgreSQL · MySQL · Oracle · SQLite · ChromaDB / Qdrant collections</text>
  <text x="62" y="865" font-size="10" fill="#be185d">drivers installed on demand (pyodbc · psycopg2 · PyMySQL · oracledb) — the app ships thin</text>

  <line x1="486" y1="784" x2="486" y2="798" stroke="#9d174d" stroke-width="1.8" marker-end="url(#arr-pink)"/>
  <text x="497" y="795" font-size="9.5" fill="#9d174d">read-only SELECTs (rows stay local)</text>
</svg>
