<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="flow" markerWidth="11" markerHeight="8" refX="11" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 11 4, 0 8" fill="#0284c7"/>
    </marker>
    <marker id="flow-amber" markerWidth="11" markerHeight="8" refX="11" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 11 4, 0 8" fill="#b8860b"/>
    </marker>
    <marker id="flow-grey" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Background + title -->
  <rect width="1000" height="600" fill="#ffffff" rx="12"/>
  <text x="500" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2d3d">M2V — Generation Pipeline (lyrics + audio → music video)</text>
  <text x="500" y="49" text-anchor="middle" font-size="11.5" fill="#64748b">Quiddity Innovations · Music to Video · status: new · 2026</text>
  <text x="500" y="65" text-anchor="middle" font-size="10" fill="#9aa5b1">engine/pipeline.py :: run() — a generator yielding one progress event per stage; the API streams these to the UI log</text>

  <!-- ══ LEGEND (top right) ══ -->
  <rect x="784" y="78" width="206" height="132" rx="7" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="887" y="96" text-anchor="middle" font-size="10" font-weight="700" fill="#1f2d3d">Legend</text>
  <rect x="794" y="104" width="14" height="10" rx="2" fill="#eafaf0" stroke="#2e7d32"/>
  <text x="814" y="113" font-size="9" fill="#374151">Verified running</text>
  <rect x="794" y="121" width="14" height="10" rx="2" fill="#fff8e6" stroke="#b8860b"/>
  <text x="814" y="130" font-size="9" fill="#374151">Built · Partial (lightly run)</text>
  <rect x="794" y="138" width="14" height="10" rx="2" fill="#f1f3f5" stroke="#9aa5b1"/>
  <text x="814" y="147" font-size="9" fill="#374151">Fallback / planned path</text>
  <line x1="794" y1="163" x2="812" y2="163" stroke="#0284c7" stroke-width="2" marker-end="url(#flow)"/>
  <text x="818" y="167" font-size="9" fill="#374151">Primary data flow</text>
  <line x1="794" y1="181" x2="812" y2="181" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4,2" marker-end="url(#flow-grey)"/>
  <text x="818" y="185" font-size="9" fill="#374151">Fallback when model down</text>
  <text x="887" y="202" text-anchor="middle" font-size="8" fill="#9aa5b1">Quiddity Innovations © 2026</text>

  <!-- ══ INPUTS band ══ -->
  <text x="22" y="100" font-size="9.5" fill="#9aa5b1" font-weight="700" letter-spacing="0.5">INPUTS</text>
  <rect x="20" y="108" width="150" height="58" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="95" y="130" text-anchor="middle" font-size="11" font-weight="700" fill="#0c4a6e">Audio track</text>
  <text x="95" y="146" text-anchor="middle" font-size="8.5" fill="#0284c7">mp3 / wav / flac / m4a</text>
  <text x="95" y="158" text-anchor="middle" font-size="8.5" fill="#0284c7">uploaded by creator</text>

  <rect x="20" y="176" width="150" height="48" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="95" y="196" text-anchor="middle" font-size="11" font-weight="700" fill="#0c4a6e">Lyrics</text>
  <text x="95" y="212" text-anchor="middle" font-size="8.5" fill="#0284c7">pasted, or extracted</text>

  <rect x="20" y="234" width="150" height="48" rx="8" fill="#f1f3f5" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="95" y="254" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">Reference photo</text>
  <text x="95" y="270" text-anchor="middle" font-size="8.5" fill="#94a3b8">optional · for IP-Adapter</text>

  <!-- lyric extraction note box -->
  <rect x="20" y="300" width="150" height="60" rx="8" fill="#fff8e6" stroke="#b8860b" stroke-width="1.3"/>
  <text x="95" y="319" text-anchor="middle" font-size="9.5" font-weight="700" fill="#7a5b06">Lyric extraction</text>
  <text x="95" y="334" text-anchor="middle" font-size="8" fill="#9a7a2e">lyrics_extractor.py</text>
  <text x="95" y="346" text-anchor="middle" font-size="8" fill="#9a7a2e">ID3 tags → Whisper</text>
  <text x="95" y="357" text-anchor="middle" font-size="8" fill="#9a7a2e">/api/extract-lyrics</text>
  <line x1="95" y1="300" x2="95" y2="224" stroke="#b8860b" stroke-width="1.4" stroke-dasharray="4,2" marker-end="url(#flow-amber)"/>

  <!-- ══ STAGE 1: DIRECT ══ -->
  <rect x="200" y="100" width="180" height="96" rx="8" fill="#fff8e6" stroke="#b8860b" stroke-width="1.5"/>
  <rect x="200" y="100" width="180" height="24" rx="8" fill="#1f2d3d"/>
  <text x="290" y="117" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1 · Direct (LLM)</text>
  <text x="212" y="140" font-size="8.5" fill="#7a5b06">lyric_analyzer.py · analyze()</text>
  <text x="212" y="154" font-size="8.5" fill="#7a5b06">split → ≤10 labelled scenes</text>
  <text x="212" y="168" font-size="8.5" fill="#7a5b06">Ollama qwen3:8b → per-scene</text>
  <text x="212" y="182" font-size="8.5" fill="#7a5b06">prompt + mood + palette</text>

  <!-- Ollama node + fallback -->
  <rect x="200" y="210" width="180" height="40" rx="7" fill="#f0fdf4" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="290" y="227" text-anchor="middle" font-size="9" font-weight="600" fill="#1b4d22">Ollama (local LLM)</text>
  <text x="290" y="240" text-anchor="middle" font-size="8" fill="#5f8a66">127.0.0.1:11434 · think:false</text>
  <line x1="290" y1="196" x2="290" y2="210" stroke="#0284c7" stroke-width="1.6" marker-end="url(#flow)"/>

  <rect x="200" y="262" width="180" height="34" rx="7" fill="#f1f3f5" stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="290" y="283" text-anchor="middle" font-size="8.5" fill="#475569">fallback: _fallback_prompt()</text>
  <line x1="290" y1="250" x2="290" y2="262" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4,2" marker-end="url(#flow-grey)"/>

  <!-- ══ STAGE 2: SEGMENT ══ -->
  <rect x="410" y="100" width="180" height="96" rx="8" fill="#fff8e6" stroke="#b8860b" stroke-width="1.5"/>
  <rect x="410" y="100" width="180" height="24" rx="8" fill="#1f2d3d"/>
  <text x="500" y="117" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2 · Segment audio</text>
  <text x="422" y="140" font-size="8.5" fill="#7a5b06">audio_analyzer.py</text>
  <text x="422" y="154" font-size="8.5" fill="#7a5b06">librosa MFCC + agglomerative</text>
  <text x="422" y="168" font-size="8.5" fill="#7a5b06">→ (start, end) per scene</text>
  <text x="422" y="182" font-size="8.5" fill="#7a5b06">duration: librosa→mutagen→ffprobe</text>

  <rect x="410" y="210" width="180" height="34" rx="7" fill="#f1f3f5" stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="500" y="231" text-anchor="middle" font-size="8.5" fill="#475569">fallback: even time split</text>
  <line x1="500" y1="196" x2="500" y2="210" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4,2" marker-end="url(#flow-grey)"/>

  <!-- ══ STAGE 3: IMAGE ══ -->
  <rect x="620" y="100" width="180" height="96" rx="8" fill="#fffaf0" stroke="#b8860b" stroke-width="1.5"/>
  <rect x="620" y="100" width="180" height="24" rx="8" fill="#1f2d3d"/>
  <text x="710" y="117" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3 · Image (per scene)</text>
  <text x="632" y="140" font-size="8.5" fill="#7a5b06">video_generator.py</text>
  <text x="632" y="154" font-size="8.5" fill="#7a5b06">SDXL Base 1.0 · 1024×576</text>
  <text x="632" y="168" font-size="8.5" fill="#7a5b06">+ IP-Adapter (if ref photo)</text>
  <text x="632" y="182" font-size="8.5" fill="#c0392b">partial · needs GPU weights</text>

  <!-- ref photo into stage 3 -->
  <path d="M 170 258 C 480 258 470 150 620 150" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4,2" marker-end="url(#flow-grey)"/>

  <!-- ══ STAGE 4: ANIMATE ══ -->
  <rect x="620" y="262" width="180" height="92" rx="8" fill="#fffaf0" stroke="#b8860b" stroke-width="1.5"/>
  <rect x="620" y="262" width="180" height="24" rx="8" fill="#1f2d3d"/>
  <text x="710" y="279" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">4 · Animate</text>
  <text x="632" y="302" font-size="8.5" fill="#7a5b06">Stable Video Diffusion XT</text>
  <text x="632" y="316" font-size="8.5" fill="#7a5b06">25 frames @ 8fps (~3.1s)</text>
  <text x="632" y="330" font-size="8.5" fill="#7a5b06">FFmpeg loop+scale → 1280×720</text>
  <text x="632" y="344" font-size="8.5" fill="#c0392b">partial · SDXL/SVD swap VRAM</text>

  <!-- ══ STAGE 5: ASSEMBLE ══ -->
  <rect x="410" y="262" width="180" height="92" rx="8" fill="#fff8e6" stroke="#b8860b" stroke-width="1.5"/>
  <rect x="410" y="262" width="180" height="24" rx="8" fill="#1f2d3d"/>
  <text x="500" y="279" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">5 · Assemble</text>
  <text x="422" y="302" font-size="8.5" fill="#7a5b06">assembler.py · FFmpeg</text>
  <text x="422" y="316" font-size="8.5" fill="#7a5b06">concat clips · mux song</text>
  <text x="422" y="330" font-size="8.5" fill="#7a5b06">burn SRT subtitles</text>
  <text x="422" y="344" font-size="8.5" fill="#5f8a66">produced real .mp4 + .srt</text>

  <!-- ══ OUTPUT ══ -->
  <rect x="200" y="262" width="180" height="92" rx="8" fill="#eafaf0" stroke="#2e7d32" stroke-width="1.6"/>
  <text x="290" y="290" text-anchor="middle" font-size="12" font-weight="700" fill="#1b4d22">🎬 Music video</text>
  <text x="290" y="308" text-anchor="middle" font-size="8.5" fill="#5f8a66">data/output/&lt;job&gt;.mp4</text>
  <text x="290" y="321" text-anchor="middle" font-size="8.5" fill="#5f8a66">audio-synced · captioned</text>
  <text x="290" y="338" text-anchor="middle" font-size="8.5" fill="#5f8a66">GET /api/download/{id}</text>

  <!-- ══ MAIN FLOW ARROWS (stage to stage) ══ -->
  <line x1="170" y1="140" x2="200" y2="140" stroke="#0284c7" stroke-width="2" marker-end="url(#flow)"/>
  <line x1="170" y1="200" x2="200" y2="160" stroke="#0284c7" stroke-width="2" marker-end="url(#flow)"/>
  <line x1="380" y1="148" x2="410" y2="148" stroke="#0284c7" stroke-width="2" marker-end="url(#flow)"/>
  <line x1="590" y1="148" x2="620" y2="148" stroke="#0284c7" stroke-width="2" marker-end="url(#flow)"/>
  <!-- audio also feeds assemble (original song) -->
  <path d="M 95 166 C 95 250 360 420 500 420 C 560 420 560 380 510 356" fill="none" stroke="#0284c7" stroke-width="1.6" stroke-dasharray="2,2" marker-end="url(#flow)"/>
  <text x="300" y="436" font-size="8.5" fill="#0284c7">original audio track muxed in at assembly</text>

  <!-- 3 -> 4 -->
  <line x1="710" y1="196" x2="710" y2="262" stroke="#0284c7" stroke-width="2" marker-end="url(#flow)"/>
  <text x="718" y="232" font-size="8" fill="#0284c7">still → motion</text>
  <!-- loop: per scene back (3->4 repeated) annotation -->
  <text x="632" y="216" font-size="8" fill="#9a7a2e" font-style="italic">repeated per scene (≤10)</text>
  <!-- 4 -> 5 -->
  <line x1="620" y1="308" x2="590" y2="308" stroke="#0284c7" stroke-width="2" marker-end="url(#flow)"/>
  <text x="600" y="300" text-anchor="end" font-size="8" fill="#0284c7">clips</text>
  <!-- 5 -> output -->
  <line x1="410" y1="308" x2="380" y2="308" stroke="#0284c7" stroke-width="2" marker-end="url(#flow)"/>

  <!-- ══ PROGRESS EVENTS strip ══ -->
  <rect x="20" y="468" width="780" height="44" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="34" y="486" font-size="9.5" fill="#475569" font-weight="700">Progress events (yielded by run(), polled by the UI):</text>
  <text x="34" y="502" font-size="9" fill="#64748b">start → analyzing → analyzed → audio → generating(×N) → clip_done / clip_error → assembling → done (or error)</text>

  <!-- ══ FOOTNOTE: standalone PoC ══ -->
  <rect x="20" y="524" width="960" height="56" rx="8" fill="#f1f3f5" stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="34" y="543" font-size="9.5" fill="#475569" font-weight="700">Standalone proof-of-concept (separate track):</text>
  <text x="34" y="559" font-size="9" fill="#6b7280">scenes.json storyboard → generate_frames.py (drives external ComfyUI :8188 → scene_##.png) → make_forro_video.py (MoviePy: Ken Burns + crossfades + captions).</text>
  <text x="34" y="572" font-size="9" fill="#6b7280">Rendered the first full M2V video forro_anime_mv.mp4 (1920×1080, 160s) — using placeholder frames, as the ComfyUI frame-gen step has not yet been run.</text>
</svg>
